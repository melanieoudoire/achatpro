          </div>
        ))}
      </div>
    </div>
  );
}

// ───────────────────────── 3. CENTRE ALERTES ─────────────────────────
function CentreAlertes({ctx}){
  const AL = window.AP3.ALERTS;
  const CAT = window.AP3.ALERT_CATS;
  const [cat,setCat] = useState3(ctx?.drill?.cat||'all');
  const [sev,setSev] = useState3('all');
  const [sel,setSel] = useState3(null);

  const shown = AL
    .filter(a=>cat==='all'?true:a.cat===cat)
    .filter(a=>sev==='all'?true:a.sev===sev)
    .sort((a,b)=>{
      const o={crit:0,urg:1,att:2,info:3};
      return o[a.sev]-o[b.sev];
    });

  const counts = {
    total: AL.length,
    crit: AL.filter(a=>a.sev==='crit').length,
    urg: AL.filter(a=>a.sev==='urg').length,
    att: AL.filter(a=>a.sev==='att').length,
    info: AL.filter(a=>a.sev==='info').length,
  };

  return (
    <div className="fi" style={{padding:'24px 28px',maxWidth:1280}}>
      <PageHeader icon="🔔" title="Centre d'alertes" sub="Toutes les alertes métier centralisées · triées par gravité · cliquez une alerte pour voir le détail et les actions"/>

      <div className="g4" style={{marginBottom:16}}>
        {[
          {l:'Total alertes',v:counts.total,c:P3.sd,i:'🔔'},
          {l:'Critiques',v:counts.crit,c:P3.terra,i:'🔴'},
          {l:'Urgentes',v:counts.urg,c:'#d97706',i:'🟠'},
          {l:'À surveiller',v:counts.att+counts.info,c:P3.gold,i:'🟡'},
        ].map((k,i)=>(
          <div key={i} className="kpi" style={{cursor:'pointer'}} onClick={()=>{
            if(i===1) setSev('crit');
            else if(i===2) setSev('urg');
            else if(i===3) setSev('att');
            else setSev('all');
          }}>
            <div style={{fontSize:17,marginBottom:3}}>{k.i}</div>
            <div className="kpi-v" style={{color:k.c}}>{k.v}</div>
            <div className="kpi-l">{k.l}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:6,marginBottom:11,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--txm)',marginRight:4}}>Catégorie :</span>
        <button className={`chip ${cat==='all'?'on':''}`} onClick={()=>setCat('all')}>Toutes</button>
        {CAT.map(c=><button key={c.id} className={`chip ${cat===c.id?'on':''}`} onClick={()=>setCat(c.id)}>{c.icon} {c.l} · {AL.filter(a=>a.cat===c.id).length}</button>)}
      </div>
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--txm)',marginRight:4}}>Gravité :</span>
        {[['all','Toutes'],['crit','🔴 Critique'],['urg','🟠 Urgent'],['att','🟡 Attention'],['info','⚪ Info']].map(([k,l])=>(
          <button key={k} className={`chip ${sev===k?'on':''}`} onClick={()=>setSev(k)}>{l}</button>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:sel?'1fr 380px':'1fr',gap:14,alignItems:'flex-start'}}>
        <div>
          {shown.length===0 && <div className="card cp" style={{textAlign:'center',color:'var(--txm)',fontSize:12,padding:30}}>Aucune alerte ne correspond à ce filtre.</div>}
          {shown.map(a=>{
            const catObj = CAT.find(c=>c.id===a.cat);
            return (
              <div key={a.id} className={`ccard ${sel===a.id?'sel':''}`} onClick={()=>setSel(sel===a.id?null:a.id)} style={{display:'flex',gap:11,alignItems:'flex-start',padding:'12px 14px'}}>
                <div style={{fontSize:20,flexShrink:0,marginTop:1}}>{({crit:'🔴',urg:'🟠',att:'🟡',info:'⚪'})[a.sev]}</div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:4,flexWrap:'wrap'}}>
                    <span style={{fontSize:12.5,fontWeight:700,color:P3.sd}}>{a.title}</span>
                    <SevPill sev={a.sev}/>
                    <span className="badge b-muted">{catObj?.icon} {catObj?.l}</span>
                  </div>
                  <div style={{fontSize:11.5,color:'var(--tx)',marginBottom:5,lineHeight:1.5}}>{a.sub}</div>
                  <div style={{fontSize:10.5,color:'var(--txm)'}}><Ref rel={a.rel} style={{fontWeight:600,color:'var(--txm)'}}>{a.rel}</Ref> · {a.date}</div>
                </div>
              </div>
            );
          })}
        </div>

        {sel && (() => {
          const a=AL.find(x=>x.id===sel); if(!a) return null;
          const catObj = CAT.find(c=>c.id===a.cat);
          return (
            <div className="card cp fi" style={{position:'sticky',top:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:11,gap:9}}>
                <div style={{display:'flex',alignItems:'flex-start',gap:9}}>
                  <span style={{fontSize:22}}>{({crit:'🔴',urg:'🟠',att:'🟡',info:'⚪'})[a.sev]}</span>
                  <div>
                    <SevPill sev={a.sev}/>
                    <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P3.sd,marginTop:5,lineHeight:1.4}}>{a.title}</div>
                  </div>
                </div>
                <button onClick={()=>setSel(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txm)',fontSize:18}}>×</button>
              </div>
              <div style={{display:'flex',gap:6,marginBottom:11,flexWrap:'wrap'}}>
                <span className="badge b-sage">{catObj?.icon} {catObj?.l}</span>
                <Ref rel={a.rel} className="badge b-muted">{a.rel}</Ref>
                <span className="badge b-muted">{a.date}</span>
              </div>
              <div style={{fontSize:12,color:'var(--tx)',lineHeight:1.7,marginBottom:14,padding:'10px 12px',background:'var(--bg)',borderRadius:9,border:'1px solid var(--bdr)'}}>{a.detail}</div>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',color:'var(--txm)',marginBottom:7}}>Actions proposées</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {a.actions.map((act,i)=>(
                  <button key={i} className={i===0?'btn btn-p':'btn btn-s'} style={{fontSize:11.5,justifyContent:'space-between',width:'100%'}} onClick={()=>act.m&&ctx.goto(act.m)}>
                    <span>{act.l}</span><span>→</span>
                  </button>
                ))}
                <button className="btn btn-g" style={{fontSize:11}}>Marquer comme traité</button>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

// ───────────────────────── 4. COMMANDES & RÉCEPTIONS ─────────────────────────
function Commandes({ctx}){
  const O = window.AP3.ORDERS;
  const [tab,setTab] = useState3('liste');
  const [sel,setSel] = useState3(null);

  const STATUS = {
    'reçu-ncr':{l:'Reçu avec NCR',c:'b-terra'},
    'retard':{l:'En retard',c:'b-terra'},
    'en-cours':{l:'En cours',c:'b-sage'},
    'recu':{l:'Reçu',c:'b-team'},
  };

  const order = O.find(o=>o.id===sel);
  const sup = order ? window.AP3.SUPPLIERS[order.supplier] : null;

  // 3-way matching highlight for chosen order
  const m3way = order ? (
    order.match3==='doublon-fact' ? {l:'⚠️ Doublon facture détecté',c:'b-terra'} :
    order.match3==='partiel' ? {l:'⚠️ Match partiel — 3 NCR + 10 manquantes',c:'b-gold'} :
    order.match3==='ok-fact-manquante' ? {l:'⚠️ Facture manquante J+30',c:'b-gold'} :
    order.match3==='ok' ? {l:'✓ Match 3-way OK',c:'b-team'} : {l:'N/A',c:'b-muted'}
  ) : null;

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <PageHeader icon="📦" title="Commandes & Réceptions" sub="Suivi commandes, réceptions, 3-way matching auto (commande / bon réception / facture)" right={[
        <button key="b" className="btn btn-p" style={{fontSize:12}}>+ Nouvelle commande</button>
      ]}/>

      <div className="g4" style={{marginBottom:16}}>
        {[
          {l:'Commandes ouvertes',v:O.filter(o=>o.status==='en-cours').length,d:'à recevoir',i:'📤'},
          {l:'Réceptions cette semaine',v:'4',d:'1 retard, 1 NCR',i:'📥'},
          {l:'Délai moyen',v:'8.2 j',d:'+0.4 j vs N-1',i:'⏱'},
          {l:'Taux conformité',v:'97.4 %',d:'+1.2 pt',i:'✅',up:true},
        ].map((k,i)=>(
          <div key={i} className="kpi">
            <div style={{fontSize:17,marginBottom:3}}>{k.i}</div>
            <div className="kpi-v">{k.v}</div>
            <div className="kpi-l">{k.l}</div>
            <div className="kpi-d" style={{color:k.up?P3.s:'var(--txm)'}}>{k.d}</div>
          </div>
        ))}
      </div>

      <div className="tab-row">
        <button className={`tab ${tab==='liste'?'on':''}`} onClick={()=>setTab('liste')}>📋 Commandes ouvertes</button>
        <button className={`tab ${tab==='recep'?'on':''}`} onClick={()=>setTab('recep')}>📥 Réceptions attendues</button>
        <button className={`tab ${tab==='3way'?'on':''}`} onClick={()=>setTab('3way')}>🔍 3-way matching</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:sel?'1fr 400px':'1fr',gap:14,alignItems:'flex-start'}}>
        <div className="card cp">
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{borderBottom:'1.5px solid var(--bdr)'}}>
              {['N°','Fournisseur','Article','Montant','Émise','Attendue','Statut','3-way'].map(h=>(
                <th key={h} style={{textAlign:'left',padding:'9px 8px',color:'var(--txm)',fontWeight:600,fontSize:11}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {O.filter(o=>{
                if(tab==='recep') return o.status==='en-cours'||o.status==='retard';
                if(tab==='3way') return o.match3!=='na';
                return true;
              }).map(o=>{
                const s=window.AP3.SUPPLIERS[o.supplier];
                const st=STATUS[o.status];
                return (
                  <tr key={o.id} onClick={()=>setSel(o.id===sel?null:o.id)} style={{cursor:'pointer',borderBottom:'1px solid var(--bdr)',background:sel===o.id?'rgba(122,139,111,0.06)':'transparent'}}>
                    <td style={{padding:'10px 8px',fontWeight:700,color:P3.sd}}><Ref rel={o.id} style={{fontWeight:700,color:P3.sd}}>{o.id}</Ref></td>

                    <td style={{padding:'10px 8px',color:'var(--tx)'}}>{o.art}</td>
                    <td style={{padding:'10px 8px',color:P3.sd,fontWeight:600}}>{o.amount}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.date}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.expect}</td>
                    <td style={{padding:'10px 8px'}}><span className={`badge ${st.c}`}>{st.l}</span></td>
                    <td style={{padding:'10px 8px',fontSize:11}}>{o.match3==='doublon-fact'?'⚠️ Doublon':o.match3==='partiel'?'⚠️ Partiel':o.match3==='ok-fact-manquante'?'⚠️ Fact ?':o.match3==='ok'?'✓':'—'}</td>

          <div className="card cp fi" style={{position:'sticky',top:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:11}}>
              <div>
                <div style={{fontSize:11,color:'var(--txm)'}}><Ref rel={order.id} style={{color:'var(--txm)'}}>{order.id}</Ref></div>
                <div style={{fontFamily:'Georgia,serif',fontSize:16,fontWeight:700,color:P3.sd,marginTop:2}}><Ref k="supplier" id={order.supplier} style={{fontWeight:700,color:P3.sd}}>{sup.n}</Ref></div>
                <div style={{fontSize:11,color:'var(--tx)',marginTop:3}}>{order.art}</div>
              </div>
              <button onClick={()=>setSel(null)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txm)',fontSize:18}}>×</button>
            </div>

            <div style={{fontSize:10,fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',color:'var(--txm)',marginBottom:7}}>3-way matching</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:14}}>
              {[
                {l:'Commande',v:order.amount,sub:order.date,ok:true},
                {l:'Réception',v:order.received||'—',sub:order.status==='retard'?'En retard':'—',ok:order.received&&order.status!=='retard'},
                {l:'Facture',v:order.invoice,sub:'',ok:order.invoice!=='Doublon'&&order.invoice!=='En retard'},
              ].map((c,i)=>(
                <div key={i} style={{padding:'9px 10px',background:'var(--bg)',borderRadius:8,border:`1px solid ${c.ok?'var(--bdr)':'rgba(184,92,62,0.30)'}`}}>
                  <div style={{fontSize:9.5,color:'var(--txm)',letterSpacing:'.4px',textTransform:'uppercase',marginBottom:3}}>{c.l}</div>
                  <div style={{fontSize:11.5,fontWeight:700,color:c.ok?P3.sd:P3.terra,lineHeight:1.3}}>{c.v}</div>
                  <div style={{fontSize:10,color:'var(--txm)'}}>{c.sub}</div>
                </div>
              ))}
            </div>

            <div style={{padding:'10px 12px',background:m3way.c==='b-team'?'rgba(122,139,111,0.08)':'rgba(184,92,62,0.07)',borderRadius:9,border:`1px solid ${m3way.c==='b-team'?'rgba(122,139,111,0.22)':'rgba(184,92,62,0.25)'}`,marginBottom:14}}>

// ───────────────────────── 6. DRILLDOWN DÉPENSES ─────────────────────────
function DepensesDrill({ctx}){
  const D = window.AP3.DEPENSES_CAT;
  const [cat,setCat] = useState3(null); // selected category id
  const [sup,setSup] = useState3(null); // selected supplier
  const total = D.reduce((a,c)=>a+c.v,0);

  // Layer 1 — Categories
  if(!cat) return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <Crumb ctx={ctx} parts={[{label:'Dépenses 2026'}]}/>
      <PageHeader icon="📊" title="Dépenses 2026 · par catégorie" sub={`Volume total ${(total/1000).toFixed(1)} M€ · 6 catégories · cliquez une catégorie pour explorer ses fournisseurs`}/>

      <div className="g3" style={{marginBottom:14}}>
        {D.map(c=>{
          const pct = (c.v/total*100).toFixed(1);
          return (
            <div key={c.id} className="card cp card-hover" onClick={()=>setCat(c.id)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:9}}>
                <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P3.sd}}>{c.l}</div>
                <span className="badge b-sage">{pct} %</span>
              </div>
              <div style={{fontFamily:'Georgia,serif',fontSize:24,fontWeight:700,color:P3.sd,marginBottom:4}}>{c.v} K€</div>
              <div style={{fontSize:11,color:'var(--txm)',marginBottom:9}}>{c.suppliers.length} fournisseurs</div>
              <div className="ptrack"><div className="pfill" style={{width:pct+'%'}}/></div>
              <div style={{fontSize:11,color:P3.s,fontWeight:600,marginTop:9}}>Explorer les fournisseurs →</div>
            </div>
          );
        })}
      </div>
    </div>
  );

  const catObj = D.find(c=>c.id===cat);

  // Layer 3 — Supplier orders
  if(sup){
    const supObj = catObj.suppliers.find(s=>s.sup===sup);
    const orders = window.AP3.ORDERS.filter(o=>o.supplier===sup);
    const fullSup = window.AP3.SUPPLIERS[sup]||{n:supObj.n};
    return (
      <div className="fi" style={{padding:'24px 28px'}}>
        <Crumb ctx={ctx} parts={[
          {label:'Dépenses 2026',go:()=>{setCat(null);setSup(null);}},
          {label:catObj.l,go:()=>setSup(null)},
          {label:fullSup.n}
        ]}/>
        <PageHeader icon="🏢" title={fullSup.n} sub={`${catObj.l} · ${supObj.v} K€ cumulés YTD · ${supObj.orders} commandes`} right={[
          <button key="x" className="btn btn-s" style={{fontSize:12}} onClick={()=>ctx.goto('eval')}>📊 Fiche fournisseur complète</button>
        ]}/>

        <div className="g3" style={{marginBottom:14}}>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>💰</div><div className="kpi-v">{supObj.v} K€</div><div className="kpi-l">Dépense YTD</div></div>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>📦</div><div className="kpi-v">{supObj.orders}</div><div className="kpi-l">Commandes</div></div>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>🤝</div><div className="kpi-v">82/100</div><div className="kpi-l">Score qualité</div></div>
        </div>

        <div className="card cp">
          <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P3.sd,marginBottom:11}}>Commandes récentes</div>
          {orders.length===0 ? <div style={{fontSize:12,color:'var(--txm)'}}>Aucune commande récente trackée dans cette catégorie.</div> : (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead><tr style={{borderBottom:'1.5px solid var(--bdr)'}}>
                {['N° commande','Article','Montant','Émise','Reçue','Statut'].map(h=>(<th key={h} style={{textAlign:'left',padding:'9px 8px',fontSize:11,color:'var(--txm)',fontWeight:600}}>{h}</th>))}
              </tr></thead>
              <tbody>
                {orders.map(o=>(
                  <tr key={o.id} onClick={()=>ctx.goto('commandes')} style={{cursor:'pointer',borderBottom:'1px solid var(--bdr)'}}>
                    <td style={{padding:'10px 8px',fontWeight:700,color:P3.sd}}>{o.id}</td>
                    <td style={{padding:'10px 8px'}}>{o.art}</td>
                    <td style={{padding:'10px 8px',fontWeight:600,color:P3.sd}}>{o.amount}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.date}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.received||'—'}</td>
                    <td style={{padding:'10px 8px'}}><span className={`badge ${o.status==='retard'||o.status==='reçu-ncr'?'b-terra':'b-sage'}`}>{o.status==='retard'?'Retard':o.status==='reçu-ncr'?'Reçu NCR':o.status==='recu'?'Reçu':'En cours'}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    );
  }

  // Layer 2 — Suppliers in category
  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <Crumb ctx={ctx} parts={[{label:'Dépenses 2026',go:()=>setCat(null)},{label:catObj.l}]}/>
      <PageHeader icon="📁" title={catObj.l} sub={`${catObj.v} K€ cumulés YTD · ${catObj.suppliers.length} fournisseurs · cliquez pour explorer les commandes`}/>

      <div className="g2" style={{marginBottom:14}}>
        {catObj.suppliers.map(s=>{
          const pct=(s.v/catObj.v*100).toFixed(1);
          const full=window.AP3.SUPPLIERS[s.sup];
          return (
            <div key={s.sup} className="card cp card-hover" onClick={()=>setSup(s.sup)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:9}}>
                <div>
                  <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P3.sd}}>{s.n}</div>
                  {full && <div style={{fontSize:11,color:'var(--txm)'}}>{full.sec} · {full.loc}</div>}
                </div>
                <span className="badge b-sage">{pct} %</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
                <div>
                  <div style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P3.sd}}>{s.v} K€</div>
                  <div style={{fontSize:11,color:'var(--txm)'}}>{s.orders} commandes</div>
                </div>
                <div style={{fontSize:11,color:P3.s,fontWeight:600}}>Voir commandes →</div>
              </div>
              <div className="ptrack" style={{marginTop:11}}><div className="pfill" style={{width:pct+'%'}}/></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

<script type="text/babel">
// ═══ INLINED FROM apdb.jsx ═══
// AchatPro — Base de données (Pilotage) : explorateur du référentiel fictif.
// Toutes les lignes sont cliquables (data-ref-kind / data-ref-id) → drawer apref.jsx.
(function(){
const {useState,useMemo}=React;

const num=s=>{const m=String(s||'').replace(/\s/g,'').match(/([\d.,]+)\s*(K|M|Mds)?/i);if(!m)return 0;let v=parseFloat(m[1].replace(',','.'))||0;const u=(m[2]||'').toLowerCase();if(u==='k')v*=1e3;if(u==='m')v*=1e6;if(u==='mds')v*=1e9;return v;};
const riskColor=r=>r==='élevé'?'#B85C3E':r==='modéré'?'#C9A961':'#7A8B6F';
const SEV={crit:{l:'Critique',c:'#B85C3E'},urg:{l:'Urgent',c:'#C9A961'},att:{l:'Attention',c:'#8A7E10'},info:{l:'Info',c:'#7A8B6F'}};

function Th({children,w,right}){return <th style={{textAlign:right?'right':'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase',whiteSpace:'nowrap',width:w}}>{children}</th>;}
function Td({children,mono,right,c,b}){return <td style={{padding:'9px 11px',fontSize:11.5,color:c||'var(--tx)',fontFamily:mono?'monospace':'inherit',textAlign:right?'right':'left',fontWeight:b?700:400,verticalAlign:'middle'}}>{children}</td>;}

function Table({cols,rows}){
  return (
    <div className="card" style={{overflow:'hidden',padding:0}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>{cols.map((c,i)=><Th key={i} right={c.right}>{c.l}</Th>)}<Th w={30}></Th></tr></thead>
          <tbody>
            {rows.map((r,i)=>(
              <tr key={i} data-ref-kind={r._k} data-ref-id={r._id} title="Ouvrir la fiche" style={{borderBottom:'1px solid var(--bdr)',cursor:'pointer'}}>
                {r.cells.map((cell,j)=><Td key={j} {...(cols[j].td||{})}>{cell}</Td>)}
                <Td c="var(--txm)">→</Td>
              </tr>
            ))}
            {rows.length===0 ? <tr><td colSpan={cols.length+1} style={{padding:'26px 12px',textAlign:'center',fontSize:12,color:'var(--txm)'}}>Aucun enregistrement ne correspond à la recherche.</td></tr> : null}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Score({v}){
  const c=v>=80?'#7A8B6F':v>=70?'#C9A961':'#B85C3E';
  return <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
    <span style={{width:34,height:5,borderRadius:3,background:'var(--bdr)',overflow:'hidden',display:'inline-block'}}><span style={{display:'block',width:(v||0)+'%',height:'100%',background:c}}/></span>
    <span style={{fontWeight:700,color:c,fontSize:11.5}}>{v||'—'}</span>
  </span>;
}
function Tag({children,c}){return <span style={{padding:'2px 8px',borderRadius:14,background:(c||'#7A8B6F')+'18',color:c||'#7A8B6F',fontSize:10,fontWeight:700,whiteSpace:'nowrap'}}>{children}</span>;}

function BaseDonnees(){
  const DB=(window.APRef&&window.APRef.DB)||{suppliers:{},contracts:{},orders:{},categories:{},docs:{},alerts:{}};
  const [tab,setTab]=useState('suppliers');
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('all');

  const S=Object.entries(DB.suppliers), C=Object.entries(DB.contracts), O=Object.entries(DB.orders), K=Object.entries(DB.categories), D=Object.entries(DB.docs), A=Object.entries(DB.alerts);
  const ql=q.toLowerCase().trim();
  const hit=(...f)=>!ql||f.some(x=>String(x||'').toLowerCase().includes(ql));

  const spendTotal=useMemo(()=>S.reduce((a,[,s])=>a+num(s.ytdSpend),0),[DB]);
  const fmtM=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' M€':Math.round(v/1e3)+' K€';

  const TABS=[['suppliers','🏢 Fournisseurs',S.length],['contracts','📑 Contrats',C.length],['orders','📦 Commandes',O.length],['categories','📊 Catégories',K.length],['docs','📄 Documents',D.length],['alerts','🔔 Alertes',A.length]];

  const sup=id=>DB.suppliers[id]?DB.suppliers[id].n:id;

  let cols=[],rows=[];
  if(tab==='suppliers'){
    const secs=['all',...Array.from(new Set(S.map(([,s])=>s.sec)))];
    cols=[{l:'Fournisseur'},{l:'Secteur'},{l:'Site'},{l:'Cat.'},{l:'Score IA'},{l:'ESG'},{l:'Risque'},{l:'Dépense YTD',right:true,td:{right:true,b:true}},{l:'Cmd',right:true,td:{right:true}}];
    rows=S.filter(([,s])=>(cat==='all'||s.sec===cat)&&hit(s.n,s.sec,s.loc,s.risk,(s.certs||[]).join(' '))).map(([id,s])=>({_k:'supplier',_id:id,cells:[
      <span style={{fontWeight:700,color:'var(--txs)'}}>{s.n}</span>,s.sec,s.loc,<Tag c={s.cat==='A'?'#B85C3E':s.cat==='B'?'#C9A961':'#7A8B6F'}>{'Cat. '+(s.cat||'B')}</Tag>,<Score v={s.score}/>,<Score v={s.esg}/>,<Tag c={riskColor(s.risk)}>{s.risk||'—'}</Tag>,s.ytdSpend||'—',s.orders||0]}));
    var filters=secs;
  } else if(tab==='contracts'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Objet'},{l:'Fournisseur'},{l:'Début'},{l:'Fin'},{l:'Montant',right:true,td:{right:true,b:true}},{l:'Préavis'},{l:'Tacite'},{l:'Sévérité'}];
    rows=C.filter(([id,c])=>hit(id,c.n,sup(c.supId))).map(([id,c])=>({_k:'contract',_id:id,cells:[
      id,<span style={{fontWeight:600,color:'var(--txs)'}}>{c.n}</span>,sup(c.supId),c.start,c.end,c.amount,c.preavis,c.tac?<Tag c="#C9A961">Oui</Tag>:<span style={{color:'var(--txm)'}}>Non</span>,<Tag c={(SEV[c.sev]||{}).c}>{(SEV[c.sev]||{}).l||c.sev}</Tag>]}));
  } else if(tab==='orders'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Fournisseur'},{l:'Article'},{l:'Montant',right:true,td:{right:true,b:true}},{l:'Commandée'},{l:'Attendue'},{l:'Reçue'},{l:'Statut'}];
    rows=O.filter(([id,o])=>hit(id,o.art,sup(o.supId),o.status)).map(([id,o])=>({_k:'order',_id:id,cells:[
      id,sup(o.supId),<span style={{fontWeight:600,color:'var(--txs)'}}>{o.art}</span>,o.amount,o.date,o.expect,o.received,<Tag c={/retard|NCR|doublon|manquante/i.test(o.status)?'#B85C3E':'#7A8B6F'}>{o.status}</Tag>]}));
  } else if(tab==='categories'){
    cols=[{l:'Catégorie'},{l:'Volume YTD',right:true,td:{right:true,b:true}},{l:'Part'},{l:'Tendance'},{l:'Top fournisseurs'}];
    rows=K.filter(([id,c])=>hit(c.l,(c.top||[]).join(' '))).map(([id,c])=>({_k:'category',_id:id,cells:[
      <span style={{fontWeight:700,color:'var(--txs)'}}>{c.icon} {c.l}</span>,c.v+' K€',
      <span style={{display:'inline-flex',alignItems:'center',gap:7}}><span style={{width:46,height:5,borderRadius:3,background:'var(--bdr)',display:'inline-block',overflow:'hidden'}}><span style={{display:'block',width:(c.share*4)+'%',height:'100%',background:'#7A8B6F'}}/></span>{c.share}%</span>,
      <Tag c={c.trend.startsWith('+')&&c.trend!=='+0%'?'#B85C3E':c.trend.startsWith('−')?'#7A8B6F':'#8A8A8A'}>{c.trend}</Tag>,
      (c.top||[]).join(' · ')]}));
  } else if(tab==='docs'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Type'},{l:'Fournisseur'},{l:'Contenu'}];
    rows=D.filter(([id,d])=>hit(d.ref,d.type,d.summary,sup(d.supId))).map(([id,d])=>({_k:'doc',_id:id,cells:[d.ref,<Tag>{d.type}</Tag>,sup(d.supId),d.summary]}));
  } else {
    cols=[{l:'ID',td:{mono:true}},{l:'Sévérité'},{l:'Catégorie'},{l:'Intitulé'},{l:'Élément lié',td:{mono:true}},{l:'Date'}];
    rows=A.filter(([id,a])=>hit(id,a.title,a.cat,a.rel)).map(([id,a])=>({_k:'alert',_id:id,cells:[
      id,<Tag c={(SEV[a.sev]||{}).c}>{(SEV[a.sev]||{}).l||a.sev}</Tag>,a.cat,<span style={{fontWeight:600,color:'var(--txs)'}}>{a.title}</span>,a.rel,a.date]}));
  }

  const total=S.length+C.length+O.length+K.length+D.length+A.length;

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:'#3D4A3D',marginBottom:3}}>Base de données</h2>
      <p style={{color:'var(--txm)',fontSize:13,marginBottom:18}}>Référentiel de démonstration — panel fournisseurs, contrats, commandes et catégories. Chaque ligne ouvre sa fiche détaillée.</p>

      <div className="g4" style={{marginBottom:14}}>
        {[{l:'Enregistrements',v:total,c:'#3D4A3D',i:'🗄️'},{l:'Fournisseurs actifs',v:S.length,c:'#7A8B6F',i:'🏢'},{l:'Dépense YTD cumulée',v:fmtM(spendTotal),c:'#C9A961',i:'💰'},{l:'Contrats sous gestion',v:C.length,c:'#B85C3E',i:'📑'}].map((k,i)=>(
          <div key={i} className="kpi">
            <div style={{fontSize:18,marginBottom:4}}>{k.i}</div>
            <div className="kpi-v" style={{color:k.c}}>{k.v}</div>
            <div className="kpi-l">{k.l}</div>
          </div>
        ))}
      </div>

      <div className="card csm" style={{marginBottom:12,display:'flex',alignItems:'center',gap:9}}>
        <span style={{fontSize:15}}>🔍</span>
        <input className="inp" placeholder="Rechercher un fournisseur, une référence, un article…" value={q} onChange={e=>setQ(e.target.value)} style={{border:'none',background:'none',boxShadow:'none',flex:1}}/>
        <span style={{fontSize:11,color:'var(--txm)',whiteSpace:'nowrap'}}>{rows.length} résultat{rows.length>1?'s':''}</span>
      </div>

      <div className="tab-row" style={{flexWrap:'wrap'}}>
        {TABS.map(([k,l,n])=>(
          <button key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>{setTab(k);setCat('all');}}>{l} <span style={{opacity:.6,marginLeft:4}}>{n}</span></button>
        ))}
      </div>

      {tab==='suppliers' ? (
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {['all',...Array.from(new Set(S.map(([,s])=>s.sec)))].map(s=>(
            <button key={s} className={'chip '+(cat===s?'on':'')} onClick={()=>setCat(s)} style={{fontSize:11}}>{s==='all'?'Tous secteurs':s}</button>
          ))}
        </div>
      ) : null}

// ── SVG Charts ───────────────────────────────────────────────
function AreaChart({data, k1, k2, c1=P.s, c2=P.gold, h=150}){
  const W=600, H=h*2;
  const v1=data.map(d=>+d[k1]||0), v2=k2?data.map(d=>+d[k2]||0):[];
  const allV=[...v1,...v2]; const mn=Math.min(...allV), mx=Math.max(...allV)||1, rng=mx-mn;
  const px=(v,i)=>[i/(data.length-1)*(W-40)+20, H-20-(v-mn)/rng*(H-40)];
  const path=(vals)=>vals.map((v,i)=>{ const [x,y]=px(v,i); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
  const area=(vals,color)=>{ const p=path(vals); const [lx]=px(vals[vals.length-1],vals.length-1); const [fx]=px(vals[0],0); return `${p} L${lx.toFixed(1)} ${H-20} L${fx.toFixed(1)} ${H-20} Z`; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c1} stopOpacity=".18"/><stop offset="100%" stopColor={c1} stopOpacity=".01"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c2} stopOpacity=".22"/><stop offset="100%" stopColor={c2} stopOpacity=".01"/></linearGradient>
      </defs>
      {[0,.25,.5,.75,1].map(f=><line key={f} x1="20" y1={(H-20-(H-40)*f).toFixed(1)} x2={W-20} y2={(H-20-(H-40)*f).toFixed(1)} stroke="rgba(122,139,111,0.08)" strokeWidth="1"/>)}
      <path d={area(v1,c1)} fill="url(#g1)"/>
      {k2&&<path d={area(v2,c2)} fill="url(#g2)"/>}
      <path d={path(v1)} fill="none" stroke={c1} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {k2&&<path d={path(v2)} fill="none" stroke={c2} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      {data.map((d,i)=>{
        const [x]=px(v1[i],i);
        return i%3===0 ? <text key={i} x={x} y={H} textAnchor="middle" fontSize="18" fill={P.tx} opacity=".6">{d.month||d.name||''}</text> : null;
      })}
    </svg>
  );
}

function BarChart({data, dk, h=160, multi=false, keys=[], colors=CC}){
  const W=580, H=h*2;
  const vals=multi?data.flatMap(d=>keys.map(k=>+d[k]||0)):data.map(d=>+d[dk]||0);
  const mx=Math.max(...vals)||1;
  const n=data.length, bw=W/n, pad=bw*.14;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      {[0,.25,.5,.75,1].map(f=><line key={f} x1="0" y1={(H-20-(H-40)*f).toFixed(1)} x2={W} y2={(H-20-(H-40)*f).toFixed(1)} stroke="rgba(122,139,111,0.07)" strokeWidth="1"/>)}
      {data.map((d,i)=>{
        if(multi) return keys.map((k,ki)=>{
          const v=(+d[k]||0)/mx*(H-40); const subW=(bw-pad*2)/keys.length;
          const x=i*bw+pad+ki*subW; const y=H-20-v;
          return <rect key={k} x={x} y={y} width={subW-2} height={v} fill={colors[ki]} rx="3"/>;
        });
        const v=(+d[dk]||0)/mx*(H-40); const x=i*bw+pad; const y=H-20-v;
        return <rect key={i} x={x} y={y} width={bw-pad*2} height={v} fill={CC[i%CC.length]} rx="3"/>;
      })}
      {data.map((d,i)=>{
        const x=i*bw+bw/2;
        return i%2===0?<text key={i} x={x} y={H+2} textAnchor="middle" fontSize="16" fill={P.tx} opacity=".55">{d.month||d.name||''}</text>:null;
      })}
    </svg>
  );
}

function Donut({data, h=180}){
  const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
  let ang=-Math.PI/2; const cx=90, cy=h*.9, R=72, ri=46;
  const slices=data.map(d=>{
    const a=(d.value/total)*Math.PI*2;
    const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);
    ang+=a;
    const x2=cx+R*Math.cos(ang),y2=cy+R*Math.sin(ang);
    const ix1=cx+ri*Math.cos(ang-a),iy1=cy+ri*Math.sin(ang-a);
    const ix2=cx+ri*Math.cos(ang),iy2=cy+ri*Math.sin(ang);
    const lg=a>Math.PI?1:0;
    return {path:`M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R},0,${lg},1,${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ri},${ri},0,${lg},0,${ix1.toFixed(2)},${iy1.toFixed(2)} Z`,color:d.color||CC[0],name:d.name,value:d.value};
  });
  return (
    <svg viewBox={`0 0 320 ${h*1.8}`} style={{width:'100%',height:h}}>
      {slices.map((sl,i)=><path key={i} d={sl.path} fill={sl.color} opacity=".9"/>)}
      {data.map((d,i)=>(
        <g key={i} transform={`translate(182,${14+i*20})`}>
          <rect width="9" height="9" rx="2" fill={d.color||CC[i]} y="-1"/>
          <text x="13" y="8" fontSize="11" fill={P.tx}>{d.name} — {d.value}%</text>
        </g>
      ))}
    </svg>
  );
}

function HBar({data, h=170}){
  const W=390, H=h*2; const n=data.length; const rowH=H/n;
  const mx=Math.max(...data.map(d=>d.val||0))||1;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}}>
      {data.map((d,i)=>{
        const bw=(d.val/mx)*240; const y=i*rowH+rowH*.15;
        return (
          <g key={i}>
            <text x="0" y={y+rowH*.65} fontSize="12" fill={P.tx}>{d.name}</text>
            <rect x="90" y={y+rowH*.1} width={bw} height={rowH*.65} fill={CC[i%CC.length]} rx="3"/>
            <text x={95+bw} y={y+rowH*.65} fontSize="11" fill={P.tx} opacity=".6">{d.val}K€</text>
          </g>
        );
      })}
    </svg>
  );
}

function RadarChart({data, dk='A', color=P.s, h=155}){
  const n=data.length, cx=80, cy=h*.9, R=62;
  const pts=data.map((d,i)=>{
    const ang=-Math.PI/2+i*(Math.PI*2/n), val=(d[dk]||0)/100;
    return {x:cx+R*val*Math.cos(ang),y:cy+R*val*Math.sin(ang),lx:cx+(R+20)*Math.cos(ang),ly:cy+(R+20)*Math.sin(ang),label:d.subject};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const grids=[.25,.5,.75,1].map(f=>data.map((_,i)=>{
    const ang=-Math.PI/2+i*(Math.PI*2/n);
    return `${(cx+R*f*Math.cos(ang)).toFixed(1)},${(cy+R*f*Math.sin(ang)).toFixed(1)}`;
  }).join(' '));
  return (
    <svg viewBox={`0 0 280 ${h*1.8}`} style={{width:'100%',height:h}}>
      {grids.map((g,i)=><polygon key={i} points={g} fill="none" stroke="rgba(122,139,111,0.13)" strokeWidth="1"/>)}
      {pts.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="rgba(122,139,111,0.09)" strokeWidth="1"/>)}
      <polygon points={poly} fill={color} fillOpacity=".14" stroke={color} strokeWidth="1.5"/>
      {pts.map((p,i)=><text key={i} x={p.lx} y={p.ly+4} textAnchor="middle" fontSize="10" fill={P.tx} opacity=".7">{p.label}</text>)}
    </svg>
  );
}

function TcoModule(){
  const [v,setV]=useState({a:'',inst:'',maint:'',en:'',form:'',dur:'5',fin:''});
  const [res,setRes]=useState(null);
  const set=(k,val)=>setV(p=>({...p,[k]:val}));
  const calc=()=>{
    const pa=+v.a||0,inst=+v.inst||0,maint=(+v.maint||0)*(+v.dur||5),en=(+v.en||0)*(+v.dur||5),form=+v.form||0,fin=+v.fin||0;
    const h=inst+maint+en+form+fin,tot=pa+h;
    setRes({pa,h,tot,an:Math.round(tot/(+v.dur||5)),pct:pa>0?Math.round(h/pa*100):0,items:[{l:'Prix d\'achat',val:pa},{l:'Installation',val:inst},{l:'Maintenance totale',val:maint},{l:'Énergie totale',val:en},{l:'Formation',val:form},{l:'Fin de vie',val:fin}]});
  };
  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P.sd,marginBottom:3}}>Calculateur TCO</h2>
      <p style={{color:'var(--txm)',fontSize:13,marginBottom:18}}>Total Cost of Ownership — Révélez tous les coûts cachés</p>
      <div className="g2">
        <div className="card cp">
          <div className="g2" style={{marginBottom:12}}>
            {[{k:'a',l:"Prix d'achat (€)"},{k:'inst',l:'Installation (€)'},{k:'maint',l:'Maintenance/an (€)'},{k:'en',l:'Énergie/an (€)'},{k:'form',l:'Formation (€)'},{k:'dur',l:'Durée (ans)'},{k:'fin',l:'Fin de vie (€)'}].map(f=>(
              <div key={f.k}><label style={{fontSize:11,fontWeight:600,color:'var(--txm)',display:'block',marginBottom:3}}>{f.l}</label><input type="number" className="inp" value={v[f.k]} onChange={e=>set(f.k,e.target.value)} placeholder="0"/></div>
            ))}
          </div>
          <button className="btn btn-p" onClick={calc}>Calculer le TCO</button>
        </div>
        <div className="card cp">
          {res?(
            <div>
              <div style={{textAlign:'center',marginBottom:18}}>
                <div style={{fontSize:11,color:'var(--txm)',marginBottom:3}}>TCO Total sur {v.dur} ans</div>
                <div style={{fontFamily:'Georgia,serif',fontSize:34,fontWeight:700,color:P.s}}>{res.tot.toLocaleString('fr-FR')} €</div>
                <div style={{fontSize:12,color:'var(--txm)'}}>{res.an.toLocaleString('fr-FR')} €/an</div>
              </div>
              <div style={{background:'var(--bg)',borderRadius:9,padding:'11px 13px',marginBottom:12,border:'1px solid var(--bdr)'}}>
                {[{l:'Coûts visibles',val:res.pa,c:P.s},{l:'Coûts cachés 🧊',val:res.h,c:P.terra}].map(b=>(
                  <div key={b.l} style={{marginBottom:10}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                      <span style={{fontWeight:600}}>{b.l}</span><span style={{fontWeight:700,color:b.c}}>{b.val.toLocaleString('fr-FR')} €</span>
                    </div>
                    <div className="ptrack"><div className="pfill" style={{width:`${res.tot>0?b.val/res.tot*100:0}%`,background:b.c}}/></div>
                  </div>
                ))}
              </div>
              {res.items.filter(i=>i.val>0).map(i=>(
                <div key={i.l} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',borderBottom:'1px solid var(--bdr)'}}>
                  <span style={{color:'var(--txm)'}}>{i.l}</span><span style={{fontWeight:600}}>{i.val.toLocaleString('fr-FR')} €</span>

            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                    <div style={{position:'absolute',left:0,top:4,width:14,height:14,borderRadius:'50%',background:i===0?P.s:'var(--card2)',border:`2px solid ${i===0?P.s:'var(--bdr)'}`,zIndex:1}}/>
                    {i<VERS.length-1&&<div style={{position:'absolute',left:6,top:18,bottom:0,width:2,background:'var(--bdr)'}}/>}
                    <div style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:9,padding:'9px 12px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                        <span className="badge b-sage">{v.v}</span>
                        <span style={{fontSize:11,color:'var(--txm)'}}>{v.d} — {v.a}</span>
                        {i>0&&<button className="btn btn-g" style={{fontSize:10,padding:'2px 7px',marginLeft:'auto'}}>Restaurer</button>}
                      </div>
                      <div style={{fontSize:12,color:'var(--tx)'}}>{v.n}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {tab==='Sandbox'&&(
              <div>
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:600,color:P.sd,marginBottom:4}}>Test avec données fictives</div>
                  <div style={{fontSize:11,color:'var(--txm)',marginBottom:10}}>L'IA va compléter les variables avec des exemples réalistes.</div>
                  <button className="btn btn-p" onClick={runSandbox} disabled={sbLoad}>{sbLoad?'Exécution…':'▶ Exécuter le prompt'}</button>
                </div>
                {sbRes&&(<><hr className="div"/><div style={{fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase',marginBottom:7}}>Résultat</div><div className="pcontent" style={{fontFamily:'inherit',fontSize:12,lineHeight:1.85}}>{sbRes}</div></>)}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Comparateur d'Offres + Cost Saving / Cost Avoidance ─────
const OFFERS_DEMO = [
  {id:1, sup:'Dell France', price:1280, qty:25, ship:450, warranty:3, delay:12, rse:72, pay:'30j', total:0},
  {id:2, sup:'Lenovo / Computacenter', price:1185, qty:25, ship:0, warranty:4, delay:5, rse:84, pay:'45j', total:0},
  {id:3, sup:'HP Inc.', price:1340, qty:25, ship:280, warranty:2, delay:10, rse:68, pay:'30j', total:0},
  {id:4, sup:'Asus Pro', price:1095, qty:25, ship:520, warranty:1, delay:21, rse:55, pay:'comptant', total:0},
];
OFFERS_DEMO.forEach(o=>{o.total=o.price*o.qty+o.ship;});

const SAVINGS_LOG = [
  {id:'CS-2026-014', type:'Cost Saving', cat:'IT', sup:'Lenovo', desc:'Renégociation parc PC portables', amt:11875, baseline:'Offre Dell (référence marché)', status:'Validé', valid:'M. Durand (DAF)', date:'28 avr. 2026'},
  {id:'CA-2026-008', type:'Cost Avoidance', cat:'Énergie', sup:'Engie', desc:'Évitement hausse tarif index ICHT', amt:18400, baseline:'Tarif catalogue 2026 sans négo', status:'Validé', valid:'M. Durand (DAF)', date:'14 avr. 2026'},
  {id:'CS-2026-011', type:'Cost Saving', cat:'Prestations', sup:'Veolia', desc:'Renégo contrat nettoyage -8%', amt:11600, baseline:'Tarif contrat précédent', status:'Validé', valid:'C. Petit (Achats)', date:'2 avr. 2026'},
  {id:'CA-2026-006', type:'Cost Avoidance', cat:'IT', sup:'Adobe', desc:'Résiliation 14 licences inactives', amt:9660, baseline:'Renouvellement automatique prévu', status:'En attente', valid:'—', date:'1 mai 2026'},
  {id:'CS-2026-018', type:'Cost Saving', cat:'EPI', sup:'Decathlon Pro', desc:'Passage tarif Compte Entreprise', amt:4200, baseline:'Tarif standard', status:'En attente', valid:'—', date:'30 avr. 2026'},
  {id:'CA-2026-009', type:'Cost Avoidance', cat:'BTP', sup:'Lafarge', desc:'Stop hausse indexation matière', amt:7800, baseline:'Application clause d\'indexation', status:'Refusé', valid:'M. Durand — manque justificatif', date:'25 avr. 2026'},
];

function Comparateur(){
  const [tab,setTab]=useState('compare');
  const [offers,setOffers]=useState(OFFERS_DEMO);
  const [weights,setWeights]=useState({prix:35,qual:20,delai:15,garantie:15,rse:15});
  const [savings,setSavings]=useState(SAVINGS_LOG);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({type:'Cost Saving',cat:'IT',sup:'',desc:'',amt:'',baseline:''});

  const minPrice=Math.min(...offers.map(o=>o.total));
  const maxPrice=Math.max(...offers.map(o=>o.total));
  const cheapest=offers.find(o=>o.total===minPrice);

  const score=(o)=>{
    const sPrix=100-((o.total-minPrice)/(maxPrice-minPrice||1))*100;
    const sQual=o.warranty*20+(o.warranty>=3?20:0);
    const sDelai=Math.max(0,100-o.delay*4);
    const sGar=o.warranty*22;
    const sRse=o.rse;
    return Math.round((sPrix*weights.prix+sQual*weights.qual+sDelai*weights.delai+sGar*weights.garantie+sRse*weights.rse)/100);
  };
  const scored=offers.map(o=>({...o,score:score(o)}));
  const winner=scored.reduce((a,b)=>a.score>b.score?a:b);
  const baselineMax=Math.max(...offers.map(o=>o.total));
  const winnerSavings=baselineMax-winner.total;

  const validated=savings.filter(s=>s.status==='Validé');
  const pending=savings.filter(s=>s.status==='En attente');
  const totalCS=validated.filter(s=>s.type==='Cost Saving').reduce((a,b)=>a+b.amt,0);
  const totalCA=validated.filter(s=>s.type==='Cost Avoidance').reduce((a,b)=>a+b.amt,0);
  const totalPending=pending.reduce((a,b)=>a+b.amt,0);

  const submitSaving=()=>{
    if(!form.desc||!form.amt) return;
    const newId=`${form.type==='Cost Saving'?'CS':'CA'}-2026-${(savings.length+20).toString().padStart(3,'0')}`;
    setSavings([{id:newId,...form,amt:+form.amt,status:'En attente',valid:'—',date:new Date().toLocaleDateString('fr-FR')},...savings]);
    setForm({type:'Cost Saving',cat:'IT',sup:'',desc:'',amt:'',baseline:''});
    setShowForm(false);
  };
  const validate=(id,decision)=>{
    setSavings(savings.map(s=>s.id===id?{...s,status:decision,valid:decision==='Validé'?'M. Durand (DAF)':'Refusé — '+(prompt('Motif ?')||'non motivé'),date:new Date().toLocaleDateString('fr-FR')}:s));
  };
  const pushToSavings=(amt,desc,sup,type='Cost Saving')=>{
    const newId=`${type==='Cost Saving'?'CS':'CA'}-2026-${(savings.length+30).toString().padStart(3,'0')}`;
    setSavings([{id:newId,type,cat:'IT',sup,desc,amt,baseline:'Comparatif d\'offres '+winner.sup,status:'En attente',valid:'—',date:new Date().toLocaleDateString('fr-FR')},...savings]);
    setTab('savings');
  };

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div>
          <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P.sd}}>Comparateur d'offres & Suivi des Savings</h2>
          <p style={{color:'var(--txm)',fontSize:13}}>Analyse comparative + Cost Saving / Cost Avoidance avec validation</p>
        </div>
      </div>
      <div className="tab-row">
        <button className={`tab ${tab==='compare'?'on':''}`} onClick={()=>setTab('compare')}>📊 Comparatif d'offres</button>
        <button className={`tab ${tab==='savings'?'on':''}`} onClick={()=>setTab('savings')}>💰 Savings Tracker</button>
        <button className={`tab ${tab==='analytics'?'on':''}`} onClick={()=>setTab('analytics')}>📈 Analytics</button>
      </div>

      {tab==='compare'&&(
        <div>
          <div className="card cp" style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd}}>Cas démo : Renouvellement 25 ordinateurs portables</div>
              <span className="badge b-gold">4 offres reçues</span>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txm)',marginBottom:6,letterSpacing:'.5px'}}>PONDÉRATION DES CRITÈRES (somme = {Object.values(weights).reduce((a,b)=>a+b,0)}%)</div>
            <div className="g4" style={{gap:10}}>
              {Object.entries(weights).map(([k,v])=>(
                <div key={k}>
                  <div style={{fontSize:11,color:'var(--txm)',marginBottom:3,textTransform:'capitalize'}}>{k} : <strong style={{color:P.sd}}>{v}%</strong></div>
                  <input type="range" min="0" max="50" value={v} onChange={e=>setWeights({...weights,[k]:+e.target.value})} style={{width:'100%',accentColor:P.s}}/>
                </div>
              ))}
            </div>
          </div>

          <div className="card cp" style={{marginBottom:14,overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{borderBottom:'2px solid var(--bdr)'}}>
                  <th style={{textAlign:'left',padding:'8px 6px',color:'var(--txm)',fontWeight:600,fontSize:11}}>Critère</th>
                  {scored.map(o=>(
                    <th key={o.id} style={{textAlign:'left',padding:'8px 6px',color:o.id===winner.id?P.sd:'var(--txs)',fontWeight:700}}>
                      {o.id===winner.id&&<span style={{marginRight:5}}>🏆</span>}
                      <Ref name={o.sup} style={{fontWeight:700}}>{o.sup}</Ref>
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  {l:'Prix unitaire HT',k:'price',fmt:v=>v+' €',best:'min'},
                  {l:'Frais de port',k:'ship',fmt:v=>v+' €',best:'min'},
                  {l:'Total HT livré',k:'total',fmt:v=>v.toLocaleString('fr-FR')+' €',best:'min'},
                  {l:'Délai (jours)',k:'delay',fmt:v=>v+' j',best:'min'},
                  {l:'Garantie (ans)',k:'warranty',fmt:v=>v+' ans',best:'max'},
                  {l:'Score RSE /100',k:'rse',fmt:v=>v,best:'max'},
                  {l:'Paiement',k:'pay',fmt:v=>v,best:null},
                ].map((row,ri)=>{
                  const vals=scored.map(o=>o[row.k]);
                  const bestV=row.best==='min'?Math.min(...vals.filter(v=>typeof v==='number')):row.best==='max'?Math.max(...vals.filter(v=>typeof v==='number')):null;
                  return (
                    <tr key={ri} style={{borderBottom:'1px solid var(--bdr)'}}>
                      <td style={{padding:'8px 6px',color:'var(--txm)',fontWeight:500}}>{row.l}</td>
                      {scored.map(o=>(
                        <td key={o.id} style={{padding:'8px 6px',background:o[row.k]===bestV?'rgba(168,184,155,0.18)':'transparent',fontWeight:o[row.k]===bestV?700:500,color:o[row.k]===bestV?P.sd:'var(--tx)',borderRadius:5}}>
                          {row.fmt(o[row.k])}
                          {o[row.k]===bestV&&<span style={{marginLeft:4,color:P.s}}>✓</span>}
                        </td>
                      ))}
                    </tr>
                  );
                })}
                <tr style={{borderTop:'2px solid var(--bdr)',background:'rgba(122,139,111,0.05)'}}>
                  <td style={{padding:'10px 6px',fontWeight:700,color:P.sd}}>Score pondéré IA /100</td>
                  {scored.map(o=>(
                    <td key={o.id} style={{padding:'10px 6px',fontFamily:'Georgia,serif',fontSize:18,fontWeight:700,color:o.id===winner.id?P.s:'var(--tx)'}}>{o.score}</td>
                  ))}
                </tr>
              </tbody>
            </table>
          </div>

          <div className="card cp" style={{background:'linear-gradient(135deg,rgba(122,139,111,0.08),rgba(201,169,97,0.05))',border:`1.5px solid ${P.s}33`}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
              <div style={{fontSize:34}}>🏆</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'Georgia,serif',fontSize:16,fontWeight:700,color:P.sd,marginBottom:4}}>Recommandation IA : {winner.sup}</div>
                <div style={{fontSize:12,color:'var(--tx)',lineHeight:1.65,marginBottom:10}}>
                  Score pondéré <strong>{winner.score}/100</strong> — Meilleure combinaison prix/qualité/délai/RSE.
                  Économie réelle vs offre la plus chère : <strong style={{color:P.s}}>{winnerSavings.toLocaleString('fr-FR')} €</strong> ({Math.round(winnerSavings/baselineMax*100)}%).
                </div>
                <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                  <button className="btn btn-p" style={{fontSize:12}} onClick={()=>pushToSavings(winnerSavings,`Comparatif PC portables — choix ${winner.sup}`,winner.sup,'Cost Saving')}>💰 Déclarer en Cost Saving</button>
                  <button className="btn btn-s" style={{fontSize:12}} onClick={()=>pushToSavings(winnerSavings,`Évitement écart prix max — ${winner.sup}`,winner.sup,'Cost Avoidance')}>🛡️ Déclarer en Cost Avoidance</button>
                  <button className="btn btn-g">📄 Exporter PDF</button>
                  <button className="btn btn-g">✉️ Notifier le fournisseur</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {tab==='savings'&&(
        <div>
          <div className="g4" style={{marginBottom:14}}>
            <div className="kpi"><div className="kpi-l">💰 Cost Saving validé</div><div className="kpi-v" style={{color:P.s}}>{totalCS.toLocaleString('fr-FR')} €</div><div className="kpi-d up">{validated.filter(s=>s.type==='Cost Saving').length} dossiers</div></div>
            <div className="kpi"><div className="kpi-l">🛡️ Cost Avoidance validé</div><div className="kpi-v" style={{color:P.gold}}>{totalCA.toLocaleString('fr-FR')} €</div><div className="kpi-d up">{validated.filter(s=>s.type==='Cost Avoidance').length} dossiers</div></div>
            <div className="kpi"><div className="kpi-l">⏳ En attente validation</div><div className="kpi-v" style={{color:P.terra}}>{totalPending.toLocaleString('fr-FR')} €</div><div className="kpi-d">{pending.length} à arbitrer</div></div>
            <div className="kpi"><div className="kpi-l">🎯 Total Savings YTD</div><div className="kpi-v">{(totalCS+totalCA).toLocaleString('fr-FR')} €</div><div className="kpi-d up">+12.4% vs N-1</div></div>
          </div>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd}}>Registre des économies</div>
            <button className="btn btn-p" onClick={()=>setShowForm(!showForm)}>+ Déclarer une économie</button>
          </div>

          {showForm&&(
            <div className="card cp" style={{marginBottom:12,border:`1.5px solid ${P.s}`}}>
              <div style={{fontWeight:700,color:P.sd,marginBottom:9}}>Nouvelle déclaration de Saving</div>
              <div className="g3" style={{gap:9,marginBottom:9}}>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Type</label><select className="inp" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option>Cost Saving</option><option>Cost Avoidance</option></select></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Catégorie</label><select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}><option>IT</option><option>BTP</option><option>Énergie</option><option>Prestations</option><option>EPI</option><option>Marketing</option></select></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Fournisseur</label><input className="inp" value={form.sup} onChange={e=>setForm({...form,sup:e.target.value})} placeholder="Ex: Lenovo"/></div>
              </div>
              <div className="g2" style={{gap:9,marginBottom:9}}>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Description / Action</label><input className="inp" value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} placeholder="Ex: Renégociation contrat -8%"/></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Baseline (référence)</label><input className="inp" value={form.baseline} onChange={e=>setForm({...form,baseline:e.target.value})} placeholder="Ex: Tarif contrat précédent"/></div>
              </div>
              <div style={{display:'flex',gap:9,alignItems:'flex-end'}}>
                <div style={{flex:1}}><label style={{fontSize:11,color:'var(--txm)'}}>Montant économisé (€)</label><input type="number" className="inp" value={form.amt} onChange={e=>setForm({...form,amt:e.target.value})} placeholder="0"/></div>
                <button className="btn btn-p" onClick={submitSaving}>Soumettre pour validation</button>
                <button className="btn btn-g" onClick={()=>setShowForm(false)}>Annuler</button>
              </div>
              <div style={{marginTop:9,padding:'7px 10px',background:'rgba(201,169,97,0.07)',borderRadius:7,fontSize:11,color:'#8A5E10'}}>
                💡 Différence : <strong>Cost Saving</strong> = économie réelle sur prix antérieur. <strong>Cost Avoidance</strong> = hausse évitée vs référence projetée.
              </div>
            </div>
          )}

          <div className="card" style={{overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>
                  {['Réf.','Type','Catégorie','Fournisseur','Description','Montant','Baseline','Statut','Validateur','Actions'].map(h=>(
                    <th key={h} style={{textAlign:'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {savings.map(s=>(
                  <tr key={s.id} style={{borderBottom:'1px solid var(--bdr)'}}>
                    <td style={{padding:'9px 11px',fontFamily:'monospace',fontSize:10.5,color:'var(--txm)'}}>{s.id}</td>
                    <td style={{padding:'9px 11px'}}><span className={`badge ${s.type==='Cost Saving'?'b-sage':'b-gold'}`}>{s.type==='Cost Saving'?'💰 CS':'🛡️ CA'}</span></td>
                    <td style={{padding:'9px 11px',fontSize:11.5}}>{s.cat}</td>
                    <td style={{padding:'9px 11px',fontSize:11.5,fontWeight:600}}><Ref name={s.sup} style={{fontWeight:600}}>{s.sup}</Ref></td>
                    <td style={{padding:'9px 11px',fontSize:11.5,maxWidth:200}}>{s.desc}</td>
                    <td style={{padding:'9px 11px',fontWeight:700,color:s.type==='Cost Saving'?P.s:P.gold,fontFamily:'Georgia,serif',fontSize:13}}>{s.amt.toLocaleString('fr-FR')} €</td>
                    <td style={{padding:'9px 11px',fontSize:10.5,color:'var(--txm)',maxWidth:150}}>{s.baseline}</td>
                    <td style={{padding:'9px 11px'}}>
                      {s.status==='Validé'&&<span className="badge b-sage">✓ Validé</span>}
                      {s.status==='En attente'&&<span className="badge b-gold">⏳ En attente</span>}
                      {s.status==='Refusé'&&<span className="badge b-terra">✗ Refusé</span>}
                    </td>
                    <td style={{padding:'9px 11px',fontSize:10.5,color:'var(--txm)'}}>{s.valid}<div style={{fontSize:9,opacity:.7}}>{s.date}</div></td>
                    <td style={{padding:'9px 11px'}}>
                      {s.status==='En attente'?(
                        <div style={{display:'flex',gap:4}}>
                          <button onClick={()=>validate(s.id,'Validé')} style={{background:P.s,color:'#fff',border:'none',borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer',fontWeight:700}}>✓ Valider</button>
                          <button onClick={()=>validate(s.id,'Refusé')} style={{background:'transparent',color:P.terra,border:`1px solid ${P.terra}`,borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer'}}>✗ Refuser</button>
                        </div>
                      ):(<button className="btn btn-g" style={{fontSize:10,padding:'3px 8px'}}>Voir</button>)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{marginTop:11,padding:'10px 13px',background:'rgba(122,139,111,0.06)',borderRadius:9,border:'1px solid var(--bdr)',fontSize:11.5,color:'var(--tx)'}}>
            <strong style={{color:P.sd}}>📋 Workflow de validation :</strong> Acheteur déclare → Manager Achats vérifie → DAF arbitre (si &gt; 5k€) → Comptabilité enregistre. Toute économie validée alimente le KPI Savings YTD du tableau de bord et du reporting CODIR.
          </div>
        </div>
      )}

      {tab==='analytics'&&(
        <div>
          <div className="g2" style={{marginBottom:14}}>
            <div className="card cp">
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>Répartition CS vs CA</div>
              <Donut data={[{name:'Cost Saving',value:Math.round(totalCS/(totalCS+totalCA)*100)||50,color:P.s},{name:'Cost Avoidance',value:Math.round(totalCA/(totalCS+totalCA)*100)||50,color:P.gold}]} h={170}/>
            </div>
            <div className="card cp">
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>Savings par catégorie (€)</div>
              <HBar data={['IT','Énergie','Prestations','EPI','BTP','Marketing'].map(c=>({name:c,val:Math.round(validated.filter(s=>s.cat===c).reduce((a,b)=>a+b.amt,0)/1000)||Math.floor(Math.random()*15+3)}))} h={170}/>
            </div>
          </div>
          <div className="card cp">
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>📈 Cumulé YTD vs Objectif</div>
            <div style={{padding:'14px 0'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}>
                <span>Réalisé : <strong style={{color:P.s}}>{(totalCS+totalCA).toLocaleString('fr-FR')} €</strong></span>
                <span>Objectif annuel : <strong>500 000 €</strong></span>
              </div>
              <div className="ptrack" style={{height:14}}><div className="pfill" style={{width:Math.min(100,(totalCS+totalCA)/500000*100)+'%'}}/></div>
              <div style={{marginTop:6,fontSize:11,color:'var(--txm)'}}>{Math.round((totalCS+totalCA)/500000*100)}% de l'objectif annuel atteint au 6 mai 2026</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Rédaction de contrats ──────────────────────────────────
const CONTRACT_TYPES=[

  }[mod]||['Aide-moi sur ce module','Voir les prompts','Générer un rapport'];
  const send=async()=>{
    if(!inp.trim()||load) return;
    const u=inp.trim();setInp('');setMsgs(m=>[...m,{role:'user',text:u}]);setLoad(true);
    try{const t=await window.claude.complete({messages:[{role:'user',content:`Assistant AchatPro, expert achats. Module: ${mod}. Question: ${u}. Réponds concis en français, max 100 mots.`}]});setMsgs(m=>[...m,{role:'ai',text:t}]);}
    catch(e){setMsgs(m=>[...m,{role:'ai',text:'Erreur de connexion.'}]);}
    setLoad(false);
  };
  return (
    <div className={`ia-panel ${open?'':'shut'}`}>
      {open&&<>
        <div className="ia-hdr">
          <div style={{width:28,height:28,borderRadius:7,background:'rgba(122,139,111,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>✦</div>
          <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:700,color:P.sd}}>Assistant AchatPro</div><div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--txm)'}}><span style={{width:5,height:5,borderRadius:'50%',background:'#22c55e',display:'inline-block'}}/>En ligne</div></div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txm)',fontSize:17,borderRadius:5,padding:'2px 5px'}}>×</button>
        </div>
        <div className="ia-msgs">
          {msgs.map((m,i)=><div key={i} style={{alignSelf:m.role==='user'?'flex-end':'flex-start',maxWidth:'90%'}}><div className={`bub ${m.role==='user'?'bub-u':'bub-ai'}`}>{m.text}</div></div>)}
          {load&&<div style={{alignSelf:'flex-start'}}><div className="bub bub-ai" style={{color:'var(--txm)',fontSize:11}}>● ● ●</div></div>}
          <div ref={bottom}/>
        </div>
        <div className="ia-sug">
          <div className="ia-sug-lbl">Suggestions</div>
          {SUGG.map((s,i)=><button key={i} className="sugg" onClick={()=>setInp(s)}>{s}</button>)}
        </div>
        <div className="ia-inp-row">
          <input className="ia-inp" placeholder="Posez votre question…" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/>
          <button className="ia-send" onClick={send}>→</button>
        </div>
      </>}
    </div>
  );
}

// ── Router: use v8 modules when available, fall back to v1 for the rest ─
const NAV=[
  {sec:'Pilotage',items:[
    {id:'dashboard',e:'🏠',l:'Tableau de bord'},
    {id:'basededonnees',e:'🗄️',l:'Base de données'},
  ]},
  {sec:'Opérations',items:[
    {id:'processus',e:'🧭',l:'Processus A→Z'},
    {id:'email',e:'✉️',l:'Assistant Emails IA'},
    {id:'comparateur',e:'📊',l:'Comparateur d\'offres'},
    {id:'sourcing',e:'🔍',l:'Sourcing augmenté'},
    {id:'workflows',e:'✅',l:'Workflows approbation'},
  ]},
  {sec:'Analyse',items:[
    {id:'dashboards',e:'📊',l:'Dashboards & Reporting'},
    {id:'tco',e:'💰',l:'Calculateur TCO'},
    {id:'couts',e:'📉',l:'Analyse des coûts'},
    {id:'eval',e:'🤝',l:'Évaluation fournisseurs'},
  ]},
  {sec:'Contractuel',items:[
    {id:'contrats',e:'📑',l:'Analyse de contrats'},
    {id:'redaction',e:'✍️',l:'Rédaction contrats'},
  ]},
  {sec:'Risques & Conformité',items:[
    {id:'risques',e:'🛡️',l:'Gestion des risques'},
    {id:'rse',e:'🌱',l:'RSE / ESG / Conformité'},
  ]},
  {sec:'Configuration',items:[
    {id:'integrations',e:'🔗',l:'Intégrations'},
    {id:'knowledge',e:'📚',l:'Base de connaissances'},
    {id:'prompts',e:'🪄',l:'Prompts Library'},
  ]},
];
const ALL_ITEMS=NAV.flatMap(s=>s.items);
const MOD_LABEL=Object.fromEntries(ALL_ITEMS.map(i=>[i.id,i.l]));
const MOD_SEC={}; NAV.forEach(s=>s.items.forEach(i=>{MOD_SEC[i.id]=s.sec;}));

function App(){
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "ambiance": "terre",
    "density": "cosy",
    "perso": "botanique"
  }/*EDITMODE-END*/;
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [mod,setMod]=useState('dashboard');
  const [dark,setDark]=useState(false);
  const [ia,setIa]=useState(false);

  // Expose global navigation for cross-module links (window.APRef.goto)
  useEffect(()=>{
    if(window.APRef) window.APRef.goto=(id)=>setMod(id);
    else window.APRef={goto:(id)=>setMod(id),DB:{suppliers:{},contracts:{},orders:{},categories:{},docs:{},alerts:{}}};
  },[]);

  useEffect(()=>{
    const root=document.documentElement;
    root.setAttribute('data-ambiance',t.ambiance);
    root.setAttribute('data-density',t.density);
    root.setAttribute('data-perso',t.perso);
  },[t.ambiance,t.density,t.perso]);

  const render=()=>{
    // v8 modules from external .jsx files, when loaded
    if(mod==='basededonnees'&&window.BaseDonnees) return React.createElement(window.BaseDonnees);
    if(mod==='processus'&&window.Processus2) return React.createElement(window.Processus2);
    if(mod==='sourcing'&&window.Sourcing2) return React.createElement(window.Sourcing2);
    if(mod==='workflows'&&window.Workflows2) return React.createElement(window.Workflows2);
    if(mod==='integrations'&&window.IntegrationsModule) return React.createElement(window.IntegrationsModule);
    if(mod==='knowledge'&&window.KnowledgeModule) return React.createElement(window.KnowledgeModule);

    // Native modules (defined earlier in this file)
    switch(mod){
      case 'dashboard': return <Dashboard/>;
      case 'processus': return <ProcessusAZ/>;
      case 'email': return <EmailModule/>;
      case 'sourcing': return <Sourcing/>;
      case 'workflows': return <Workflows/>;
      case 'comparateur': return <Comparateur/>;
      case 'dashboards': return <Dashboards/>;
      case 'tco': return <TcoModule/>;
      case 'contrats': return <AnalyseContrats/>;
      case 'eval': return <EvalFournisseurs/>;
      case 'risques': return <Risques/>;
      case 'rse': return <Rse/>;
      case 'prompts': return <PromptsLibrary/>;
      case 'couts': return <AnalyseCouts/>;
      case 'redaction': return <RedactionContrats/>;
      case 'integrations': return <Simple title="Intégrations" sub="Connectez AchatPro à votre ERP, SAP, DocuSign et outils métiers" icon="🔗"/>;
      case 'knowledge': return <Simple title="Base de connaissances" sub="Glossaire, procédures, modèles et micro-formations" icon="📚"/>;
      case 'basededonnees': return <Simple title="Base de données" sub="Référentiel fournisseurs, contrats, commandes et catégories" icon="🗄️"/>;
      default: return <Dashboard/>;
    }
  };

  // Global click delegation for cross-module drilldown (data-ref-kind / data-ref-id)
  useEffect(()=>{
    const h=(e)=>{
      const el=e.target.closest('[data-ref-kind][data-ref-id]');
      if(!el) return;
      if(window.APRef&&window.APRef.open){window.APRef.open(el.dataset.refKind,el.dataset.refId);}
    };
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[]);

  return (
    <div className={dark?'dark':''} style={{display:'flex',width:'100%',height:'100vh',overflow:'hidden',background:'var(--bg)'}}>
      <div className="sidebar">
        <div className="sidebar-logo">
          <span style={{fontSize:22}}>🌿</span>
          <div><div className="logo-text">AchatPro</div><div className="logo-sub">Copilote IA Achats</div></div>
        </div>
        <div className="snav">
          {NAV.map(s=>(
            <div key={s.sec}>
              <div className="sec-lbl">{s.sec}</div>
              {s.items.map(item=>(
                <button key={item.id} className={`ni ${mod===item.id?'active':''} ${item.id==='prompts'?'ni-prompts':''}`} onClick={()=>setMod(item.id)}>
                  <span style={{fontSize:14,flexShrink:0,width:18,textAlign:'center'}}>{item.e}</span>{item.l}
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="sfooter">
          <div className="ucard">
            <div className="avatar">MO</div>
            <div><div className="uname">Mélanie Oudoire</div><div className="urole">Responsable Achats</div></div>
          </div>
        </div>
      </div>
      <div className="main-area">
        <div className="topbar">
          <div className="breadcrumb">
            <span>{MOD_SEC[mod]}</span><span style={{opacity:.35}}>›</span><strong>{MOD_LABEL[mod]}</strong>
          </div>
          <div className="tsearch">
            <span style={{fontSize:13,opacity:.45}}>🔍</span>
            <input placeholder="Rechercher ou demander à l'IA…"/>
          </div>
          <div style={{display:'flex',gap:7}}>
            <div className="tbtn" style={{position:'relative'}}>🔔<div style={{position:'absolute',top:5,right:5,width:7,height:7,borderRadius:'50%',background:P.terra,border:'2px solid var(--card)'}}/></div>
            <button className="tbtn" onClick={()=>setDark(!dark)}>{dark?'☀️':'🌙'}</button>
            <button className="tbtn" onClick={()=>setIa(!ia)} style={{color:ia?P.s:'var(--txm)',borderColor:ia?P.s:'var(--bdr)'}}>✦</button>
          </div>
        </div>
        <div className="content-area">
          <div className="content">{render()}</div>
          <IaPanel open={ia} onClose={()=>setIa(false)} mod={mod}/>
          {window.APDetailDrawer?React.createElement(window.APDetailDrawer):null}
        </div>
      </div>
      {window.TweaksPanel?React.createElement(window.TweaksPanel,{title:'Tweaks'},
        React.createElement(window.TweakSection,{title:'Ambiance'},
          React.createElement(window.TweakRadio,{label:'Palette',value:t.ambiance,onChange:v=>setTweak('ambiance',v),options:[
            {value:'terre',label:'Terre'},{value:'aube',label:'Aube'},{value:'ardoise',label:'Ardoise'},{value:'encre',label:'Encre'},
          ]})
        ),
        React.createElement(window.TweakSection,{title:'Densité'},
          React.createElement(window.TweakRadio,{label:'Espacement',value:t.density,onChange:v=>setTweak('density',v),options:[
            {value:'compact',label:'Compact'},{value:'cosy',label:'Confort'},{value:'airy',label:'Spacieux'},
          ]})
        ),
        React.createElement(window.TweakSection,{title:'Personnalité'},
          React.createElement(window.TweakRadio,{label:'Style',value:t.perso,onChange:v=>setTweak('perso',v),options:[
            {value:'botanique',label:'Botanique'},{value:'editorial',label:'Editorial'},{value:'tech',label:'Tech'},
          ]})
        )
      ):null}
      {!ia&&<button className="fab" onClick={()=>setIa(true)} title="Assistant IA">✦</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
