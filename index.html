// ───────────────────────── 6. DRILLDOWN DÉPENSES ─────────────────────────
function DepensesDrill({ctx}){
  const D = window.AP3.DEPENSES_CAT;
  const [cat,setCat] = useState3(null); // selected category id
  const [sup,setSup] = useState3(null); // selected supplier
  const total = D.reduce((a,c)=>a+c.v,0);

  // Layer 1 — Categories
  if(!cat) return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <Crumb ctx={ctx} parts={[{label:'Dépenses 2026'}]}/>
      <PageHeader icon="📊" title="Dépenses 2026 · par catégorie" sub={`Volume total ${(total/1000).toFixed(1)} M€ · 6 catégories · cliquez une catégorie pour explorer ses fournisseurs`}/>

      <div className="g3" style={{marginBottom:14}}>
        {D.map(c=>{
          const pct = (c.v/total*100).toFixed(1);
          return (
            <div key={c.id} className="card cp card-hover" onClick={()=>setCat(c.id)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:9}}>
                <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P3.sd}}>{c.l}</div>
                <span className="badge b-sage">{pct} %</span>
              </div>
              <div style={{fontFamily:'Georgia,serif',fontSize:24,fontWeight:700,color:P3.sd,marginBottom:4}}>{c.v} K€</div>
              <div style={{fontSize:11,color:'var(--txm)',marginBottom:9}}>{c.suppliers.length} fournisseurs</div>
              <div className="ptrack"><div className="pfill" style={{width:pct+'%'}}/></div>
              <div style={{fontSize:11,color:P3.s,fontWeight:600,marginTop:9}}>Explorer les fournisseurs →</div>
            </div>
          );
        })}
      </div>
    </div>
  );

  const catObj = D.find(c=>c.id===cat);

  // Layer 3 — Supplier orders
  if(sup){
    const supObj = catObj.suppliers.find(s=>s.sup===sup);
    const orders = window.AP3.ORDERS.filter(o=>o.supplier===sup);
    const fullSup = window.AP3.SUPPLIERS[sup]||{n:supObj.n};
    return (
      <div className="fi" style={{padding:'24px 28px'}}>
        <Crumb ctx={ctx} parts={[
          {label:'Dépenses 2026',go:()=>{setCat(null);setSup(null);}},
          {label:catObj.l,go:()=>setSup(null)},
          {label:fullSup.n}
        ]}/>
        <PageHeader icon="🏢" title={fullSup.n} sub={`${catObj.l} · ${supObj.v} K€ cumulés YTD · ${supObj.orders} commandes`} right={[
          <button key="x" className="btn btn-s" style={{fontSize:12}} onClick={()=>ctx.goto('eval')}>📊 Fiche fournisseur complète</button>
        ]}/>

        <div className="g3" style={{marginBottom:14}}>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>💰</div><div className="kpi-v">{supObj.v} K€</div><div className="kpi-l">Dépense YTD</div></div>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>📦</div><div className="kpi-v">{supObj.orders}</div><div className="kpi-l">Commandes</div></div>
          <div className="kpi"><div style={{fontSize:17,marginBottom:3}}>🤝</div><div className="kpi-v">82/100</div><div className="kpi-l">Score qualité</div></div>
        </div>

        <div className="card cp">
          <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P3.sd,marginBottom:11}}>Commandes récentes</div>
          {orders.length===0 ? <div style={{fontSize:12,color:'var(--txm)'}}>Aucune commande récente trackée dans cette catégorie.</div> : (
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead><tr style={{borderBottom:'1.5px solid var(--bdr)'}}>
                {['N° commande','Article','Montant','Émise','Reçue','Statut'].map(h=>(<th key={h} style={{textAlign:'left',padding:'9px 8px',fontSize:11,color:'var(--txm)',fontWeight:600}}>{h}</th>))}
              </tr></thead>
              <tbody>
                {orders.map(o=>(
                  <tr key={o.id} onClick={()=>ctx.goto('commandes')} style={{cursor:'pointer',borderBottom:'1px solid var(--bdr)'}}>
                    <td style={{padding:'10px 8px',fontWeight:700,color:P3.sd}}>{o.id}</td>
                    <td style={{padding:'10px 8px'}}>{o.art}</td>
                    <td style={{padding:'10px 8px',fontWeight:600,color:P3.sd}}>{o.amount}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.date}</td>
                    <td style={{padding:'10px 8px',color:'var(--txm)'}}>{o.received||'—'}</td>
                    <td style={{padding:'10px 8px'}}><span className={`badge ${o.status==='retard'||o.status==='reçu-ncr'?'b-terra':'b-sage'}`}>{o.status==='retard'?'Retard':o.status==='reçu-ncr'?'Reçu NCR':o.status==='recu'?'Reçu':'En cours'}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    );
  }

  // Layer 2 — Suppliers in category
  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <Crumb ctx={ctx} parts={[{label:'Dépenses 2026',go:()=>setCat(null)},{label:catObj.l}]}/>
      <PageHeader icon="📁" title={catObj.l} sub={`${catObj.v} K€ cumulés YTD · ${catObj.suppliers.length} fournisseurs · cliquez pour explorer les commandes`}/>

      <div className="g2" style={{marginBottom:14}}>
        {catObj.suppliers.map(s=>{
          const pct=(s.v/catObj.v*100).toFixed(1);
          const full=window.AP3.SUPPLIERS[s.sup];
          return (
            <div key={s.sup} className="card cp card-hover" onClick={()=>setSup(s.sup)}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:9}}>
                <div>
                  <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P3.sd}}>{s.n}</div>
                  {full && <div style={{fontSize:11,color:'var(--txm)'}}>{full.sec} · {full.loc}</div>}
                </div>
                <span className="badge b-sage">{pct} %</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
                <div>
                  <div style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P3.sd}}>{s.v} K€</div>
                  <div style={{fontSize:11,color:'var(--txm)'}}>{s.orders} commandes</div>
                </div>
                <div style={{fontSize:11,color:P3.s,fontWeight:600}}>Voir commandes →</div>
              </div>
              <div className="ptrack" style={{marginTop:11}}><div className="pfill" style={{width:pct+'%'}}/></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Expose to window so the main App scope can use them
Object.assign(window, {
  AnalyseurDocuments, ConseilAchat, CentreAlertes, Commandes, CalendrierContrats, DepensesDrill,
});

<script type="text/babel">
// ═══ INLINED FROM apdb.jsx ═══
// AchatPro — Base de données (Pilotage) : explorateur du référentiel fictif.
// Toutes les lignes sont cliquables (data-ref-kind / data-ref-id) → drawer apref.jsx.
(function(){
const {useState,useMemo}=React;

const num=s=>{const m=String(s||'').replace(/\s/g,'').match(/([\d.,]+)\s*(K|M|Mds)?/i);if(!m)return 0;let v=parseFloat(m[1].replace(',','.'))||0;const u=(m[2]||'').toLowerCase();if(u==='k')v*=1e3;if(u==='m')v*=1e6;if(u==='mds')v*=1e9;return v;};
const riskColor=r=>r==='élevé'?'#B85C3E':r==='modéré'?'#C9A961':'#7A8B6F';
const SEV={crit:{l:'Critique',c:'#B85C3E'},urg:{l:'Urgent',c:'#C9A961'},att:{l:'Attention',c:'#8A7E10'},info:{l:'Info',c:'#7A8B6F'}};

function Th({children,w,right}){return <th style={{textAlign:right?'right':'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase',whiteSpace:'nowrap',width:w}}>{children}</th>;}
function Td({children,mono,right,c,b}){return <td style={{padding:'9px 11px',fontSize:11.5,color:c||'var(--tx)',fontFamily:mono?'monospace':'inherit',textAlign:right?'right':'left',fontWeight:b?700:400,verticalAlign:'middle'}}>{children}</td>;}

function Table({cols,rows}){
  return (
    <div className="card" style={{overflow:'hidden',padding:0}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>{cols.map((c,i)=><Th key={i} right={c.right}>{c.l}</Th>)}<Th w={30}></Th></tr></thead>
          <tbody>
            {rows.map((r,i)=>(
              <tr key={i} data-ref-kind={r._k} data-ref-id={r._id} title="Ouvrir la fiche" style={{borderBottom:'1px solid var(--bdr)',cursor:'pointer'}}>
                {r.cells.map((cell,j)=><Td key={j} {...(cols[j].td||{})}>{cell}</Td>)}
                <Td c="var(--txm)">→</Td>
              </tr>
            ))}
            {rows.length===0 ? <tr><td colSpan={cols.length+1} style={{padding:'26px 12px',textAlign:'center',fontSize:12,color:'var(--txm)'}}>Aucun enregistrement ne correspond à la recherche.</td></tr> : null}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function Score({v}){
  const c=v>=80?'#7A8B6F':v>=70?'#C9A961':'#B85C3E';
  return <span style={{display:'inline-flex',alignItems:'center',gap:6}}>
    <span style={{width:34,height:5,borderRadius:3,background:'var(--bdr)',overflow:'hidden',display:'inline-block'}}><span style={{display:'block',width:(v||0)+'%',height:'100%',background:c}}/></span>
    <span style={{fontWeight:700,color:c,fontSize:11.5}}>{v||'—'}</span>
  </span>;
}
function Tag({children,c}){return <span style={{padding:'2px 8px',borderRadius:14,background:(c||'#7A8B6F')+'18',color:c||'#7A8B6F',fontSize:10,fontWeight:700,whiteSpace:'nowrap'}}>{children}</span>;}

function BaseDonnees(){
  const DB=(window.APRef&&window.APRef.DB)||{suppliers:{},contracts:{},orders:{},categories:{},docs:{},alerts:{}};
  const [tab,setTab]=useState('suppliers');
  const [q,setQ]=useState('');
  const [cat,setCat]=useState('all');

  const S=Object.entries(DB.suppliers), C=Object.entries(DB.contracts), O=Object.entries(DB.orders), K=Object.entries(DB.categories), D=Object.entries(DB.docs), A=Object.entries(DB.alerts);
  const ql=q.toLowerCase().trim();
  const hit=(...f)=>!ql||f.some(x=>String(x||'').toLowerCase().includes(ql));

  const spendTotal=useMemo(()=>S.reduce((a,[,s])=>a+num(s.ytdSpend),0),[DB]);
  const fmtM=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' M€':Math.round(v/1e3)+' K€';

  const TABS=[['suppliers','🏢 Fournisseurs',S.length],['contracts','📑 Contrats',C.length],['orders','📦 Commandes',O.length],['categories','📊 Catégories',K.length],['docs','📄 Documents',D.length],['alerts','🔔 Alertes',A.length]];

  const sup=id=>DB.suppliers[id]?DB.suppliers[id].n:id;

  let cols=[],rows=[];
  if(tab==='suppliers'){
    const secs=['all',...Array.from(new Set(S.map(([,s])=>s.sec)))];
    cols=[{l:'Fournisseur'},{l:'Secteur'},{l:'Site'},{l:'Cat.'},{l:'Score IA'},{l:'ESG'},{l:'Risque'},{l:'Dépense YTD',right:true,td:{right:true,b:true}},{l:'Cmd',right:true,td:{right:true}}];
    rows=S.filter(([,s])=>(cat==='all'||s.sec===cat)&&hit(s.n,s.sec,s.loc,s.risk,(s.certs||[]).join(' '))).map(([id,s])=>({_k:'supplier',_id:id,cells:[
      <span style={{fontWeight:700,color:'var(--txs)'}}>{s.n}</span>,s.sec,s.loc,<Tag c={s.cat==='A'?'#B85C3E':s.cat==='B'?'#C9A961':'#7A8B6F'}>{'Cat. '+(s.cat||'B')}</Tag>,<Score v={s.score}/>,<Score v={s.esg}/>,<Tag c={riskColor(s.risk)}>{s.risk||'—'}</Tag>,s.ytdSpend||'—',s.orders||0]}));
    var filters=secs;
  } else if(tab==='contracts'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Objet'},{l:'Fournisseur'},{l:'Début'},{l:'Fin'},{l:'Montant',right:true,td:{right:true,b:true}},{l:'Préavis'},{l:'Tacite'},{l:'Sévérité'}];
    rows=C.filter(([id,c])=>hit(id,c.n,sup(c.supId))).map(([id,c])=>({_k:'contract',_id:id,cells:[
      id,<span style={{fontWeight:600,color:'var(--txs)'}}>{c.n}</span>,sup(c.supId),c.start,c.end,c.amount,c.preavis,c.tac?<Tag c="#C9A961">Oui</Tag>:<span style={{color:'var(--txm)'}}>Non</span>,<Tag c={(SEV[c.sev]||{}).c}>{(SEV[c.sev]||{}).l||c.sev}</Tag>]}));
  } else if(tab==='orders'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Fournisseur'},{l:'Article'},{l:'Montant',right:true,td:{right:true,b:true}},{l:'Commandée'},{l:'Attendue'},{l:'Reçue'},{l:'Statut'}];
    rows=O.filter(([id,o])=>hit(id,o.art,sup(o.supId),o.status)).map(([id,o])=>({_k:'order',_id:id,cells:[
      id,sup(o.supId),<span style={{fontWeight:600,color:'var(--txs)'}}>{o.art}</span>,o.amount,o.date,o.expect,o.received,<Tag c={/retard|NCR|doublon|manquante/i.test(o.status)?'#B85C3E':'#7A8B6F'}>{o.status}</Tag>]}));
  } else if(tab==='categories'){
    cols=[{l:'Catégorie'},{l:'Volume YTD',right:true,td:{right:true,b:true}},{l:'Part'},{l:'Tendance'},{l:'Top fournisseurs'}];
    rows=K.filter(([id,c])=>hit(c.l,(c.top||[]).join(' '))).map(([id,c])=>({_k:'category',_id:id,cells:[
      <span style={{fontWeight:700,color:'var(--txs)'}}>{c.icon} {c.l}</span>,c.v+' K€',
      <span style={{display:'inline-flex',alignItems:'center',gap:7}}><span style={{width:46,height:5,borderRadius:3,background:'var(--bdr)',display:'inline-block',overflow:'hidden'}}><span style={{display:'block',width:(c.share*4)+'%',height:'100%',background:'#7A8B6F'}}/></span>{c.share}%</span>,
      <Tag c={c.trend.startsWith('+')&&c.trend!=='+0%'?'#B85C3E':c.trend.startsWith('−')?'#7A8B6F':'#8A8A8A'}>{c.trend}</Tag>,
      (c.top||[]).join(' · ')]}));
  } else if(tab==='docs'){
    cols=[{l:'Référence',td:{mono:true}},{l:'Type'},{l:'Fournisseur'},{l:'Contenu'}];
    rows=D.filter(([id,d])=>hit(d.ref,d.type,d.summary,sup(d.supId))).map(([id,d])=>({_k:'doc',_id:id,cells:[d.ref,<Tag>{d.type}</Tag>,sup(d.supId),d.summary]}));
  } else {
    cols=[{l:'ID',td:{mono:true}},{l:'Sévérité'},{l:'Catégorie'},{l:'Intitulé'},{l:'Élément lié',td:{mono:true}},{l:'Date'}];
    rows=A.filter(([id,a])=>hit(id,a.title,a.cat,a.rel)).map(([id,a])=>({_k:'alert',_id:id,cells:[
      id,<Tag c={(SEV[a.sev]||{}).c}>{(SEV[a.sev]||{}).l||a.sev}</Tag>,a.cat,<span style={{fontWeight:600,color:'var(--txs)'}}>{a.title}</span>,a.rel,a.date]}));
  }

  const total=S.length+C.length+O.length+K.length+D.length+A.length;

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:'#3D4A3D',marginBottom:3}}>Base de données</h2>
      <p style={{color:'var(--txm)',fontSize:13,marginBottom:18}}>Référentiel de démonstration — panel fournisseurs, contrats, commandes et catégories. Chaque ligne ouvre sa fiche détaillée.</p>

      <div className="g4" style={{marginBottom:14}}>
        {[{l:'Enregistrements',v:total,c:'#3D4A3D',i:'🗄️'},{l:'Fournisseurs actifs',v:S.length,c:'#7A8B6F',i:'🏢'},{l:'Dépense YTD cumulée',v:fmtM(spendTotal),c:'#C9A961',i:'💰'},{l:'Contrats sous gestion',v:C.length,c:'#B85C3E',i:'📑'}].map((k,i)=>(
          <div key={i} className="kpi">
            <div style={{fontSize:18,marginBottom:4}}>{k.i}</div>
            <div className="kpi-v" style={{color:k.c}}>{k.v}</div>
            <div className="kpi-l">{k.l}</div>
          </div>
        ))}
      </div>

      <div className="card csm" style={{marginBottom:12,display:'flex',alignItems:'center',gap:9}}>
        <span style={{fontSize:15}}>🔍</span>
        <input className="inp" placeholder="Rechercher un fournisseur, une référence, un article…" value={q} onChange={e=>setQ(e.target.value)} style={{border:'none',background:'none',boxShadow:'none',flex:1}}/>
        <span style={{fontSize:11,color:'var(--txm)',whiteSpace:'nowrap'}}>{rows.length} résultat{rows.length>1?'s':''}</span>
      </div>

      <div className="tab-row" style={{flexWrap:'wrap'}}>
        {TABS.map(([k,l,n])=>(
          <button key={k} className={'tab '+(tab===k?'on':'')} onClick={()=>{setTab(k);setCat('all');}}>{l} <span style={{opacity:.6,marginLeft:4}}>{n}</span></button>
        ))}
      </div>

      {tab==='suppliers' ? (
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
          {['all',...Array.from(new Set(S.map(([,s])=>s.sec)))].map(s=>(
            <button key={s} className={'chip '+(cat===s?'on':'')} onClick={()=>setCat(s)} style={{fontSize:11}}>{s==='all'?'Tous secteurs':s}</button>
          ))}
        </div>
      ) : null}

      <Table cols={cols} rows={rows}/>

      <div className="card cp" style={{marginTop:14,background:'rgba(122,139,111,0.06)',border:'1px solid rgba(122,139,111,0.22)'}}>
        <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:'#3D4A3D',marginBottom:6}}>Sources du référentiel</div>
        <div style={{fontSize:11.5,color:'var(--tx)',lineHeight:1.6,marginBottom:10}}>Données consolidées depuis SAP S/4HANA (commandes, factures), Coface (notation financière), Ecovadis (scores RSE) et BODACC (veille juridique). Jeu de données fictif à usage de démonstration.</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          <button className="btn btn-s" style={{fontSize:10.5}}>⬇ Exporter la table (.xlsx)</button>
          <button className="btn btn-g" style={{fontSize:10.5}} onClick={()=>window.APRef&&window.APRef.goto('integrations')}>🔗 Voir les connecteurs</button>
          <button className="btn btn-g" style={{fontSize:10.5}} onClick={()=>window.APRef&&window.APRef.goto('eval')}>📊 Évaluation fournisseurs</button>
        </div>
      </div>
    </div>
  );
}
window.BaseDonnees=BaseDonnees;
})();

</script>
<script type="text/babel">
// ═══ INLINED FROM apfil.jsx ═══
// AchatPro — Socle commun des modules refondus : dossier fil rouge + briques IA live.
// Expose : window.APFIL (dossier, helpers), window.IaLive, window.FilRouge, window.Sec, window.Meta
(function(){
const {useState}=React;
const C={sd:'#3D4A3D',s:'#7A8B6F',sl:'#A8B89B',gold:'#C9A961',terra:'#B85C3E',ink:'#8A5E10'};
window.APC=C;

// ─── Dossier fil rouge ────────────────────────────────────────
const DOSSIER={
  id:'DA-2026-089',
  titre:'Renouvellement maintenance CVC — 14 sites',
  demandeur:'S. Bertin · Directeur Technique & Environnement de travail',
  cat:'Facilities',
  supId:'dalkia',
  contractId:'CTR-DAL-2025-018',
  montant:'420 K€ / an',
  echeance:'Contrat en cours jusqu\'au 31/01/2027 · préavis 2 mois',
  enjeu:'Le titulaire propose une nouvelle grille tarifaire à +16 %. Décision attendue : renégocier, remettre en concurrence, ou les deux.',
  pieces:[
    {n:'Note de besoin DT — 6 pages',t:'PDF'},
    {n:'Nouvelle grille tarifaire Dalkia 2027',t:'XLSX'},
    {n:'Historique interventions 2024-2026 (1 842 lignes)',t:'CSV'},
    {n:'Contrat en cours + avenant n°2',t:'PDF'},
  ],
};
window.APFIL={DOSSIER,C};

// Bandeau fil rouge — rappelle le cas suivi de bout en bout
function FilRouge({etape,children}){
  const [open,setOpen]=useState(false);
  return (
    <div className="card" style={{marginBottom:14,padding:0,overflow:'hidden',borderLeft:'4px solid '+C.gold}}>
      <div onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',cursor:'pointer',flexWrap:'wrap'}}>
        <span className="badge b-gold" style={{flexShrink:0}}>FIL ROUGE</span>
        <span data-ref-kind="order" data-ref-id="CMD-2026-145" style={{fontFamily:'monospace',fontSize:11,color:'var(--txm)'}}>{DOSSIER.id}</span>
        <span style={{fontSize:12.5,fontWeight:700,color:'var(--txs)'}}>{DOSSIER.titre}</span>
        <span data-ref-kind="supplier" data-ref-id={DOSSIER.supId} style={{fontSize:11.5,color:C.s,fontWeight:600,cursor:'pointer',textDecoration:'underline dotted'}}>Dalkia Maintenance</span>
        <span style={{fontSize:11.5,fontWeight:700,color:C.sd}}>{DOSSIER.montant}</span>
        <span style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:9}}>
          {etape?<span style={{fontSize:11,color:'var(--txm)'}}>Vous êtes ici : <strong style={{color:C.sd}}>{etape}</strong></span>:null}
          <span style={{color:'var(--txm)',fontSize:12}}>{open?'▲':'▼'}</span>
        </span>
      </div>
      {open?(
        <div style={{padding:'0 16px 14px',fontSize:11.5,lineHeight:1.65,color:'var(--tx)'}}>
          <div style={{padding:'10px 12px',background:'var(--bg)',border:'1px solid var(--bdr)',borderRadius:8,marginBottom:9}}>
            <strong>Enjeu · </strong>{DOSSIER.enjeu}<br/>
            <span style={{color:'var(--txm)'}}>{DOSSIER.demandeur} · {DOSSIER.echeance} · </span>
            <span data-ref-kind="contract" data-ref-id={DOSSIER.contractId} style={{cursor:'pointer',color:C.terra,fontWeight:600,textDecoration:'underline dotted'}}>{DOSSIER.contractId}</span>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {DOSSIER.pieces.map((p,i)=>(
              <span key={i} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:20,fontSize:10.5}}>
                <span style={{fontFamily:'monospace',fontWeight:700,color:C.gold}}>{p.t}</span>{p.n}
              </span>
            ))}
          </div>
          {children}
        </div>
      ):null}
    </div>
  );
}
window.FilRouge=FilRouge;

// ─── Brique IA live réutilisable ──────────────────────────────
// <IaLive label prompt hint cta rows/> → appelle réellement le modèle et affiche le résultat.
function IaLive({label,prompt,hint,cta,minH,onDone}){
  const [out,setOut]=useState('');
  const [load,setLoad]=useState(false);
  const [t0,setT0]=useState(null);
  const run=async()=>{
    setLoad(true);setOut('');const start=Date.now();
    try{
      const r=await window.claude.complete({messages:[{role:'user',content:prompt}]});
      setOut(r);setT0(((Date.now()-start)/1000).toFixed(1));
      if(onDone) onDone(r);
    }catch(e){setOut('⚠️ Génération indisponible : '+e.message);}
    setLoad(false);
  };
  return (
    <div style={{border:'1px solid rgba(122,139,111,0.28)',background:'rgba(122,139,111,0.05)',borderRadius:10,padding:'12px 14px'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:hint?5:9,flexWrap:'wrap'}}>
        <span style={{fontSize:10,fontWeight:700,letterSpacing:'.6px',textTransform:'uppercase',color:C.s}}>✦ IA génératif</span>
        <span style={{fontSize:12.5,fontWeight:700,color:'var(--txs)'}}>{label}</span>
        <button className="btn btn-p" style={{fontSize:11,marginLeft:'auto'}} onClick={run} disabled={load}>{load?'Génération…':(cta||'Générer')}</button>
      </div>
      {hint?<div style={{fontSize:11,color:'var(--txm)',marginBottom:9,lineHeight:1.5}}>{hint}</div>:null}
      {load?<div style={{fontSize:11.5,color:'var(--txm)',padding:'14px 0',display:'flex',alignItems:'center',gap:8}}><span className="pulse-dot"/>Analyse des pièces du dossier…</div>:null}
      {out?(
        <div>

];

function Radar({scores, size=210, color=PR.s}){
  const cx=size/2, cy=size/2, R=size/2-34, n=AXES.length;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; };
  const poly=AXES.map((ax,i)=>{ const [x,y]=pt(i,R*scores[ax.k]/10); return `${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ');
  return (
    <svg width={size} height={size} style={{display:'block',margin:'0 auto'}}>
      {[0.25,0.5,0.75,1].map((g,gi)=>(
        <polygon key={gi} points={AXES.map((ax,i)=>{const [x,y]=pt(i,R*g);return `${x},${y}`;}).join(' ')} fill="none" stroke="var(--bdr)" strokeWidth="1"/>
      ))}
      {AXES.map((ax,i)=>{ const [x,y]=pt(i,R); return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="var(--bdr)" strokeWidth="1"/>; })}
      <polygon points={poly} fill={color+'33'} stroke={color} strokeWidth="2"/>
      {AXES.map((ax,i)=>{ const [x,y]=pt(i,R+18); return <text key={i} x={x} y={y} fontSize="9.5" fill="var(--txm)" textAnchor="middle" dominantBaseline="middle">{ax.icon}</text>; })}
    </svg>
  );
}

function Gauge({val, max=10, color}){
  const pct=val/max;
  const c=color||(pct>=0.75?PR.s:pct>=0.5?PR.gold:PR.terra);
  return (
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{flex:1,height:9,background:'var(--bdr)',borderRadius:5,overflow:'hidden'}}>
        <div style={{width:`${pct*100}%`,height:'100%',background:`linear-gradient(90deg,${PR.terra},${PR.gold},${PR.s})`,borderRadius:5}}/>
      </div>
      <span style={{fontFamily:'Georgia,serif',fontSize:18,fontWeight:700,color:PR.sd}}>{val.toFixed(1)}<span style={{fontSize:11,color:'var(--txm)'}}>/{max}</span></span>
    </div>
  );
}

// ════════════════════════ PLAN ANNUEL DES ACHATS ════════════════════════

        <button className={`chip ${fcat==='all'?'on':''}`} onClick={()=>setFcat('all')}>Toutes</button>
        {cats.map(c=><button key={c} className={`chip ${fcat===c?'on':''}`} onClick={()=>setFcat(c)}>{c}</button>)}

      </div>

      {view==='timeline' && (
        <div className="card cp" style={{overflowX:'auto'}}>
          <div style={{minWidth:760}}>
            <div style={{display:'grid',gridTemplateColumns:'200px repeat(12,1fr)',gap:0,marginBottom:6,borderBottom:'1px solid var(--bdr)',paddingBottom:6}}>
              <div style={{fontSize:10,fontWeight:700,color:'var(--txm)',textTransform:'uppercase'}}>Initiative</div>
              {MOIS.slice(1).map((m,i)=><div key={i} style={{fontSize:10,fontWeight:600,color: (i+1)===6?PA.terra:'var(--txm)',textAlign:'center'}}>{m}</div>)}
            </div>
            {shown.map(p=>(
              <div key={p.id} data-ref-kind="initiative" data-ref-id={p.id} style={{display:'grid',gridTemplateColumns:'200px repeat(12,1fr)',gap:0,alignItems:'center',padding:'5px 0',cursor:'pointer',borderRadius:6}}
                onMouseEnter={e=>e.currentTarget.style.background='rgba(122,139,111,0.05)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <div style={{paddingRight:10}}>
                  <div style={{fontSize:11.5,fontWeight:600,color:'var(--txs)',lineHeight:1.25,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.titre}</div>
                  <div style={{fontSize:9.5,color:'var(--txm)'}}>{p.id} · {p.pilote}</div>
                </div>
                <div style={{gridColumn:`${p.start+1} / ${p.end+2}`,height:22,borderRadius:11,background:TYPE_COLOR[p.type],display:'flex',alignItems:'center',padding:'0 9px',position:'relative',boxShadow:'0 1px 4px rgba(0,0,0,0.12)'}}>
                  <span style={{fontSize:9.5,color:'#fff',fontWeight:700,whiteSpace:'nowrap'}}>{V8().fmtK(p.saving)} {p.statut==='retard'?'🔴':p.statut==='tension'?'🟡':''}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {view==='kanban' && (
        <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10}}>
          {PHASES.map(([ph,label])=>(
            <div key={ph} style={{background:'var(--bg)',borderRadius:10,padding:8,minHeight:120}}>
              <div style={{fontSize:10.5,fontWeight:700,color:PA.sd,marginBottom:8,display:'flex',justifyContent:'space-between'}}>{label}<span style={{color:'var(--txm)'}}>{shown.filter(p=>p.phase===ph).length}</span></div>
              {shown.filter(p=>p.phase===ph).map(p=>(
                <div key={p.id} data-ref-kind="initiative" data-ref-id={p.id} className="card csm" style={{marginBottom:7,cursor:'pointer',borderLeft:`3px solid ${TYPE_COLOR[p.type]}`,padding:'9px 10px'}}>
                  <div style={{fontSize:11,fontWeight:600,color:'var(--txs)',lineHeight:1.3,marginBottom:4}}>{p.titre}</div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <span style={{fontSize:10,color:PA.s,fontWeight:700}}>{V8().fmtK(p.saving)}</span>
                    {p.statut!=='ok' && <span style={{fontSize:10}}>{p.statut==='retard'?'🔴':'🟡'}</span>}
                  </div>
                </div>

          ))}

      {view==='liste' && (
        <div className="card" style={{overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>
              {['Réf.','Initiative','Catégorie','Type','Période','Budget','Saving','Phase','Pilote'].map(h=><th key={h} style={{textAlign:'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',textTransform:'uppercase',letterSpacing:'.5px'}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {shown.map(p=>(
                <tr key={p.id} data-ref-kind="initiative" data-ref-id={p.id} style={{borderBottom:'1px solid var(--bdr)',cursor:'pointer'}}>
                  <td style={{padding:'9px 11px',fontFamily:'monospace',fontSize:10.5,color:'var(--txm)'}}>{p.id}</td>
                  <td style={{padding:'9px 11px',fontWeight:600}}>{p.titre}</td>
                  <td style={{padding:'9px 11px',color:'var(--txm)'}}>{p.cat}</td>
                  <td style={{padding:'9px 11px'}}><span className="badge" style={{background:TYPE_COLOR[p.type]+'18',color:TYPE_COLOR[p.type],border:'none',fontSize:9.5}}>{TYPE_LABEL[p.type]}</span></td>
                  <td style={{padding:'9px 11px',fontSize:11,color:'var(--txm)'}}>{MOIS[p.start]}→{MOIS[p.end]}</td>
                  <td style={{padding:'9px 11px',fontFamily:'Georgia,serif',fontWeight:700,color:PA.sd}}>{V8().fmtK(p.budget)}</td>
                  <td style={{padding:'9px 11px',fontWeight:700,color:PA.s}}>{V8().fmtK(p.saving)}</td>
                  <td style={{padding:'9px 11px',fontSize:11}}>{({cadrage:'Cadrage',sourcing:'Sourcing',ao:'AO',nego:'Négo',contractualisation:'Contract.',finalisee:'✓ Finalisée'})[p.phase]}</td>
                  <td style={{padding:'9px 11px',fontSize:11,color:'var(--txm)'}}>{p.pilote} {p.statut==='retard'?'🔴':p.statut==='tension'?'🟡':''}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ════════════════════════ DEMANDES D'ACHAT ════════════════════════
function DemandesAchat({ctx}){
  const D=V8().DAS;
  const COLS=[['a-traiter','📥 À traiter','#B85C3E'],['sourcing','🔍 En sourcing','#C9A961'],['nego','🤝 En négo','#7A8B6F'],['commande','📦 Commande émise','#3D4A3D'],['soldee','✅ Soldée','#A8B89B']];
  const actives=D.filter(d=>!['soldee','refusee'].includes(d.statut));
  const montantTotal=actives.reduce((a,b)=>a+b.montant,0);
  const aTraiter=D.filter(d=>d.statut==='a-traiter').length;

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <HeaderA icon="📥" title="Demandes d'Achat" sub="Vos dossiers d'achats en cours — du besoin à la commande"
        right={[<button key="1" className="btn btn-p">+ Nouvelle demande</button>]}/>

      <KpiRowA items={[
        {i:'📥',l:'À traiter',v:aTraiter,c:PA.terra},
        {i:'⏳',l:'En cours',v:actives.length,c:PA.gold},
        {i:'💰',l:'Montant en cours',v:V8().fmtK(montantTotal),c:PA.sd},
        {i:'⚡',l:'Délai moyen traitement',v:'4,2 j',d:'−1,8 j vs N-1',c:PA.s},
      ]}/>

      <div style={{display:'flex',gap:6,marginBottom:14,alignItems:'center'}}>
        <span style={{fontSize:12.5,color:'var(--tx)',fontWeight:600}}>Pipeline des demandes</span>
        <span style={{fontSize:11,color:'var(--txm)'}}>· cliquez une carte pour le détail</span>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10}}>
        {COLS.map(([st,label,col])=>{
          const items=D.filter(d=>d.statut===st);
          return (
            <div key={st} style={{background:'var(--bg)',borderRadius:10,padding:9,minHeight:160}}>
              <div style={{fontSize:11,fontWeight:700,color:PA.sd,marginBottom:9,display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:`2px solid ${col}`,paddingBottom:6}}>
                <span style={{lineHeight:1.2}}>{label}</span><span style={{color:'var(--txm)'}}>{items.length}</span>
              </div>
              {items.map(d=>(
                <div key={d.id} data-ref-kind="da" data-ref-id={d.id} className="card csm" style={{marginBottom:8,cursor:'pointer',padding:'10px 11px'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:6,marginBottom:5}}>
                    <span style={{fontSize:9.5,fontFamily:'monospace',color:'var(--txm)'}}>{d.id}</span>
                    <span style={{fontSize:11,fontWeight:700,color:PA.sd,whiteSpace:'nowrap'}}>{V8().fmtK(d.montant)}</span>
                  </div>
                  <div style={{fontSize:11.5,fontWeight:600,color:'var(--txs)',lineHeight:1.3,marginBottom:5}}>{d.titre}</div>
                  <div style={{fontSize:10,color:'var(--txm)',marginBottom:6}}>{d.demandeur} · {d.bu}</div>
                  {d.badge && <div style={{fontSize:9.5,color:d.consolidation?'#8A5E10':PA.s,background:d.consolidation?'rgba(201,169,97,0.10)':'rgba(122,139,111,0.08)',borderRadius:5,padding:'4px 6px',lineHeight:1.35}}>🤖 {d.badge}</div>}
                </div>
              ))}
              {items.length===0 && <div style={{fontSize:10.5,color:'var(--txm)',textAlign:'center',padding:'12px 0',opacity:.6}}>—</div>}
            </div>
          );
        })}
      </div>

      <div style={{marginTop:14,display:'flex',gap:10,flexWrap:'wrap'}}>
        {D.filter(d=>d.statut==='refusee').map(d=>(
          <div key={d.id} data-ref-kind="da" data-ref-id={d.id} className="card csm" style={{cursor:'pointer',borderLeft:`3px solid ${PA.terra}`,flex:'1 1 280px',opacity:.85}}>
            <div style={{fontSize:11,fontWeight:600,color:'var(--txs)'}}>❌ {d.titre} <span style={{fontFamily:'monospace',fontSize:9.5,color:'var(--txm)'}}>· {d.id}</span></div>
            <div style={{fontSize:10,color:'var(--txm)',marginTop:3}}>{d.badge}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

Object.assign(window, { VeilleMarches, PlanAnnuel, DemandesAchat });

<script type="text/babel">
// ═══ V8 MODULE: apv8-mod-b.jsx ═══
// AchatPro v8 — Modules B : Coach Négociation · Budget & Engagements · KPI/Pareto · GED
// Charge APRÈS apv8-data.jsx. Expose CoachNego, BudgetEngagements, SuiviKPI, GedAchats.
const { useState: useStateB, useMemo: useMemoB } = React;

const W8 = () => window.APV8;
const SparkB = (props) => React.createElement(window.APV8UI.Spark, props);
const RefB = (props) => React.createElement(window.Ref, props);
const PB = { s:'#7A8B6F', sl:'#A8B89B', sd:'#3D4A3D', gold:'#C9A961', terra:'#B85C3E', tx:'#5A5A52' };

function HeaderB({icon, title, sub, right}){
  return (
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:18,gap:18,flexWrap:'wrap'}}>
      <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
        <div style={{fontSize:26,lineHeight:1}}>{icon}</div>
        <div>
          <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:PB.sd,marginBottom:2}}>{title}</h2>
          <p style={{color:'var(--txm)',fontSize:13}}>{sub}</p>
        </div>
      </div>
      {right && <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>{right}</div>}
    </div>
  );
}
function KpiB({items}){
  return (
    <div className="g4" style={{marginBottom:16}}>
      {items.map((k,i)=>(
        <div key={i} className="kpi">
          <div style={{fontSize:18,marginBottom:4}}>{k.i}</div>
          <div className="kpi-v" style={{color:k.c||PB.sd}}>{k.v}</div>
          <div className="kpi-l">{k.l}</div>
          {k.d && <div className="kpi-d" style={{color:'var(--txm)'}}>{k.d}</div>}
        </div>
      ))}
    </div>
  );
}

// ════════════════════════ COACH NÉGOCIATION ════════════════════════
function CoachNego({ctx}){
  const N=W8().NEGOS, L=W8().LEVIERS, LC=W8().LEVIER_CATS;
  const [tab,setTab]=useStateB('negos');
  const [sel,setSel]=useStateB(N.find(n=>n.statut==='En cours')||N[0]);
  const [lcat,setLcat]=useStateB('all');
  const enCours=N.filter(n=>!['Conclue'].includes(n.statut));
  const ecoCible=enCours.reduce((a,b)=>a+(b.cible||0),0);

  const statutColor=s=>({'En cours':PB.gold,'Prête':PB.s,'Préparation':PB.sl,'Conclue':PB.s,'À venir':'var(--txm)'})[s]||'var(--txm)';
  const shownLeviers=lcat==='all'?L:L.filter(l=>l.cat===lcat);

  // ZOPA bar : plancher → réserve, avec cible et idéal
  function Zopa({z}){
    if(!z) return null;
    const min=z.ideal*0.96, max=z.reserve*1.04, span=max-min;
    const pos=v=>((v-min)/span*100);
    return (
      <div style={{margin:'6px 0 14px'}}>
        <div style={{position:'relative',height:46}}>
          {/* ZOPA zone plancher fournisseur → réserve acheteur */}
          <div style={{position:'absolute',top:18,left:`${pos(z.plancher)}%`,width:`${pos(z.reserve)-pos(z.plancher)}%`,height:10,background:'rgba(122,139,111,0.25)',borderRadius:5,border:'1px solid rgba(122,139,111,0.5)'}}/>
          {[['ideal','Idéal',PB.s,'▼'],['cible','Cible',PB.sd,'▼'],['plancher','Plancher fourn.',PB.terra,'▲'],['reserve','Réserve max',PB.gold,'▲']].map(([k,lab,col,ar])=>(
            <div key={k} style={{position:'absolute',top:ar==='▼'?0:30,left:`${pos(z[k])}%`,transform:'translateX(-50%)',textAlign:'center'}}>
              {ar==='▼' && <div style={{fontSize:9,fontWeight:700,color:col,whiteSpace:'nowrap'}}>{lab} {W8().fmtK(z[k])}</div>}
              <div style={{fontSize:9,color:col}}>{ar}</div>
              {ar==='▲' && <div style={{fontSize:9,fontWeight:700,color:col,whiteSpace:'nowrap'}}>{lab} {W8().fmtK(z[k])}</div>}
            </div>
          ))}
          <div style={{position:'absolute',top:22.5,left:0,right:0,height:1,background:'var(--bdr)'}}/>
        </div>
        <div style={{fontSize:10.5,color:'var(--txm)',textAlign:'center',marginTop:2}}>Zone d'accord possible (ZOPA) en surbrillance</div>
      </div>
    );
  }

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <HeaderB icon="🎯" title="Coach Négociation" sub="Préparez vos négociations : BATNA, ZOPA, leviers et brief"/>
      <KpiB items={[
        {i:'🎯',l:'Négos en cours',v:enCours.length,c:PB.sd},
        {i:'💰',l:'Économie cible cumulée',v:W8().fmtK(ecoCible),c:PB.s},
        {i:'📈',l:'Taux de réussite',v:'73%',d:'16 négos menées',c:PB.s},
        {i:'✅',l:'Prêtes à lancer',v:N.filter(n=>n.statut==='Prête'||n.prep>=90).length,c:PB.gold},
      ]}/>

      <div className="tab-row">
        <button className={`tab ${tab==='negos'?'on':''}`} onClick={()=>setTab('negos')}>🎯 Mes négociations</button>
        <button className={`tab ${tab==='leviers'?'on':''}`} onClick={()=>setTab('leviers')}>🛠️ Bibliothèque de leviers ({L.length})</button>
      </div>

      {tab==='negos' && (
        <div style={{display:'grid',gridTemplateColumns:'300px 1fr',gap:14}}>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {N.map(n=>(
              <div key={n.id} className="card csm" onClick={()=>setSel(n)} style={{cursor:'pointer',borderLeft:`3px solid ${statutColor(n.statut)}`,background:sel.id===n.id?'rgba(122,139,111,0.08)':'var(--card)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                  <span style={{fontSize:9.5,fontFamily:'monospace',color:'var(--txm)'}}>{n.id}</span>
                  <span className="badge" style={{background:statutColor(n.statut)+'18',color:statutColor(n.statut),border:'none',fontSize:9}}>{n.statut}</span>
                </div>
                <div style={{fontSize:12,fontWeight:700,color:'var(--txs)',lineHeight:1.3,marginBottom:5}}>{n.titre}</div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:10.5,color:'var(--txm)'}}>Cible {W8().fmtK(n.obtenu||n.cible||0)}</span>
                  <div style={{display:'flex',alignItems:'center',gap:5}}>
                    <div style={{width:44,height:5,background:'var(--bdr)',borderRadius:3,overflow:'hidden'}}><div style={{width:`${n.prep}%`,height:'100%',background:statutColor(n.statut)}}/></div>
                    <span style={{fontSize:9.5,color:'var(--txm)'}}>{n.prep}%</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="card cp">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,gap:12}}>
              <div>
                <div style={{fontFamily:'Georgia,serif',fontSize:18,fontWeight:700,color:PB.sd,lineHeight:1.3}}>{sel.titre}</div>
                {sel.supId && <div style={{fontSize:12,marginTop:3}}><RefB k="supplier" id={sel.supId} style={{color:PB.s,fontWeight:600}}>{W8().supName(sel.supId)}</RefB> · {sel.id}</div>}
              </div>
              <span className="badge" style={{background:statutColor(sel.statut)+'18',color:statutColor(sel.statut),border:'none'}}>{sel.statut}</span>

// ════════════════════════ BUDGET & ENGAGEMENTS ════════════════════════
function BudgetEngagements({ctx}){
  const B=W8().BUDGETS, G=W8().BUDGET_GLOBAL, M=W8().BUDGET_MENSUEL;
  const dispo=G.total-G.conso-G.engage;
  const pctConso=Math.round(G.conso/G.total*100);
  const pctEngage=Math.round(G.engage/G.total*100);
  const maxM=Math.max(...M.map(m=>Math.max(m.cible,m.reel||0,m.proj||0)));

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <HeaderB icon="💰" title="Budget & Engagements" sub="Suivi de la consommation budgétaire et projection d'atterrissage"
        right={[<button key="1" className="btn btn-g">⬇ Export DAF</button>]}/>

      <KpiB items={[
        {i:'💼',l:'Budget annuel',v:W8().fmtK(G.total),c:PB.sd},
        {i:'📊',l:'Consommé',v:W8().fmtK(G.conso),d:pctConso+'%',c:PB.s},
        {i:'🔒',l:'Engagé (non facturé)',v:W8().fmtK(G.engage),d:pctEngage+'%',c:PB.gold},
        {i:'🎯',l:'Atterrissage projeté',v:W8().fmtK(G.atterrissage),d:G.atterrissage<G.total?'sous budget ✓':'dépassement',c:G.atterrissage<G.total?PB.s:PB.terra},
      ]}/>

      <div className="g2" style={{marginBottom:14}}>
        <div className="card cp">
          <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:PB.sd,marginBottom:12}}>Consommation mensuelle vs cible (K€)</div>
          <div style={{display:'flex',alignItems:'flex-end',gap:5,height:170,paddingTop:10}}>
            {M.map((m,i)=>{
              const val=m.reel||m.proj||0;
              const isProj=!m.reel;
              return (
                <div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,height:'100%',justifyContent:'flex-end'}}>
                  <div style={{position:'relative',width:'100%',display:'flex',justifyContent:'center',alignItems:'flex-end',height:'100%'}}>
                    <div style={{width:'62%',height:`${val/maxM*100}%`,background:isProj?'repeating-linear-gradient(45deg,rgba(122,139,111,0.35),rgba(122,139,111,0.35) 4px,rgba(122,139,111,0.15) 4px,rgba(122,139,111,0.15) 8px)':(val>m.cible?PB.terra:PB.s),borderRadius:'4px 4px 0 0',transition:'height .3s'}} title={`${val} K€`}/>
                    <div style={{position:'absolute',bottom:`${m.cible/maxM*100}%`,left:'15%',right:'15%',height:2,background:PB.gold,opacity:.8}}/>
                  </div>
                  <span style={{fontSize:9,color: i===5?PB.terra:'var(--txm)',fontWeight:i===5?700:400}}>{m.m}</span>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex',gap:14,marginTop:10,fontSize:10.5,color:'var(--txm)'}}>
            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:11,height:11,borderRadius:3,background:PB.s}}/>Réel</span>
            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:11,height:11,borderRadius:3,background:'repeating-linear-gradient(45deg,rgba(122,139,111,0.4),rgba(122,139,111,0.4) 3px,transparent 3px,transparent 6px)'}}/>Projeté</span>
            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:11,height:2,background:PB.gold}}/>Cible mensuelle</span>
          </div>
        </div>

        <div className="card cp">
          <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:PB.sd,marginBottom:12}}>Répartition budgétaire globale</div>
          <div style={{marginBottom:16}}>
            <div style={{display:'flex',height:34,borderRadius:8,overflow:'hidden',border:'1px solid var(--bdr)'}}>
              <div style={{width:`${pctConso}%`,background:PB.s,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:10.5,fontWeight:700}}>{pctConso}%</div>
              <div style={{width:`${pctEngage}%`,background:PB.gold,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:10.5,fontWeight:700}}>{pctEngage}%</div>
              <div style={{flex:1,background:'rgba(122,139,111,0.12)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--txm)',fontSize:10.5,fontWeight:700}}>{100-pctConso-pctEngage}%</div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:11}}>
              <span style={{color:PB.s,fontWeight:600}}>● Consommé {W8().fmtK(G.conso)}</span>
              <span style={{color:PB.gold,fontWeight:600}}>● Engagé {W8().fmtK(G.engage)}</span>
              <span style={{color:'var(--txm)',fontWeight:600}}>● Disponible {W8().fmtK(dispo)}</span>
            </div>
          </div>
          <div style={{padding:'11px 13px',background:'var(--bg)',borderRadius:9,border:'1px solid var(--bdr)'}}>
            <div style={{fontSize:11,color:'var(--txm)',marginBottom:4}}>Burn rate moyen</div>
            <div style={{display:'flex',alignItems:'baseline',gap:8}}>
              <span style={{fontFamily:'Georgia,serif',fontSize:24,fontWeight:700,color:PB.sd}}>{W8().fmtK(G.burn)}</span>
              <span style={{fontSize:11,color:'var(--txm)'}}>/ mois</span>
            </div>
            <div style={{fontSize:11,color:PB.s,marginTop:5}}>🎯 Atterrissage projeté {W8().fmtK(G.atterrissage)} — soit {W8().fmtK(G.total-G.atterrissage)} sous budget</div>
          </div>
        </div>
      </div>

      <div className="card cp">
        <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:PB.sd,marginBottom:12}}>Consommation par catégorie</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
          <thead><tr style={{borderBottom:'2px solid var(--bdr)'}}>
            {['Catégorie','Budget','Consommé','Engagé','Disponible','Avancement','vs N-1'].map(h=><th key={h} style={{textAlign:h==='Catégorie'?'left':'right',padding:'8px 10px',fontSize:10,fontWeight:700,color:'var(--txm)',textTransform:'uppercase',letterSpacing:'.4px'}}>{h}</th>)}
          </tr></thead>
          <tbody>
            {B.map(b=>{
              const dispoC=b.budget-b.conso-b.engage;
              const pct=Math.round((b.conso+b.engage)/b.budget*100);
              return (
                <tr key={b.id} style={{borderBottom:'1px solid var(--bdr)',background:b.risque?'rgba(184,92,62,0.04)':'transparent'}}>
                  <td style={{padding:'9px 10px',fontWeight:600}}>{b.icon} {b.l}</td>
                  <td style={{padding:'9px 10px',textAlign:'right',fontFamily:'Georgia,serif',fontWeight:700,color:PB.sd}}>{W8().fmtK(b.budget)}</td>
                  <td style={{padding:'9px 10px',textAlign:'right'}}>{W8().fmtK(b.conso)}</td>
                  <td style={{padding:'9px 10px',textAlign:'right',color:PB.gold}}>{W8().fmtK(b.engage)}</td>
                  <td style={{padding:'9px 10px',textAlign:'right',color:dispoC<0?PB.terra:PB.s,fontWeight:600}}>{W8().fmtK(dispoC)}</td>
                  <td style={{padding:'9px 10px',width:120}}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <div style={{flex:1,height:6,background:'var(--bdr)',borderRadius:3,overflow:'hidden'}}><div style={{width:`${Math.min(pct,100)}%`,height:'100%',background:pct>95?PB.terra:pct>80?PB.gold:PB.s}}/></div>
                      <span style={{fontSize:10,color:'var(--txm)',width:30,textAlign:'right'}}>{pct}%</span>
                    </div>
                  </td>
                  <td style={{padding:'9px 10px',textAlign:'right',color:b.n1>5?PB.terra:b.n1<0?PB.s:'var(--txm)',fontWeight:600}}>{b.n1>0?'+':''}{b.n1}%</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {B.filter(b=>b.alerte).map((b,i)=>(
        <div key={i} className="card cp" style={{marginTop:10,borderLeft:`4px solid ${PB.terra}`,background:'rgba(184,92,62,0.05)'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:20}}>⚠️</span>
            <div style={{flex:1}}>
              <div style={{fontSize:12.5,fontWeight:700,color:PB.terra}}>{b.icon} {b.l}</div>
              <div style={{fontSize:11.5,color:'var(--tx)',marginTop:2}}>{b.alerte}</div>
            </div>
            <button className="btn btn-s" style={{fontSize:11}} onClick={()=>ctx&&ctx.goto('workflows')}>Geler engagements →</button>
          </div>
        </div>
      ))}
    </div>
  );
}

// ════════════════════════ SUIVI DÉPENSES & KPI (Pareto / ABC) ════════════════════════
function SuiviKPI({ctx}){
  const K=W8().KPIS, F=W8().F;
  const [tab,setTab]=useStateB('cockpit');
  const themes=Array.from(new Set(K.map(k=>k.theme)));
  const stColor=s=>s==='g'?PB.s:s==='y'?PB.gold:PB.terra;
  const stDot=s=>s==='g'?'🟢':s==='y'?'🟡':'🔴';

  // Pareto : tri par spend desc + cumul
  const sorted=[...F].sort((a,b)=>b.spend-a.spend);
  const totalSpend=sorted.reduce((a,b)=>a+b.spend,0);
  let cum=0;
  const pareto=sorted.map(f=>{ cum+=f.spend; return {...f, cumPct:cum/totalSpend*100, pct:f.spend/totalSpend*100}; });
  const maxSpend=sorted[0].spend;
  const abc=f=>f.cumPct<=80?'A':f.cumPct<=95?'B':'C';
  const abcColor={A:PB.terra,B:PB.gold,C:PB.sl};

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <HeaderB icon="📈" title="Suivi des Dépenses & KPI" sub="Cockpit de performance Achats — 12 indicateurs, Pareto et classification ABC"/>

      <div className="tab-row">
        <button className={`tab ${tab==='cockpit'?'on':''}`} onClick={()=>setTab('cockpit')}>📊 Cockpit KPI</button>
        <button className={`tab ${tab==='pareto'?'on':''}`} onClick={()=>setTab('pareto')}>📉 Pareto fournisseurs</button>
        <button className={`tab ${tab==='abc'?'on':''}`} onClick={()=>setTab('abc')}>🔤 Classification ABC</button>
      </div>

      {tab==='cockpit' && themes.map(th=>(
        <div key={th} style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--txm)',textTransform:'uppercase',letterSpacing:'.6px',marginBottom:8}}>{th}</div>
          <div className="g3" style={{gap:10}}>
            {K.filter(k=>k.theme===th).map(k=>(
              <div key={k.id} className="card cp">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                  <div style={{fontSize:12,fontWeight:600,color:'var(--txs)',lineHeight:1.3,flex:1}}>{k.l}</div>
                  <span style={{fontSize:13}}>{stDot(k.st)}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:6}}>
                  <div>
                    <div style={{fontFamily:'Georgia,serif',fontSize:24,fontWeight:700,color:stColor(k.st),lineHeight:1}}>{k.v}</div>
                    <div style={{fontSize:10,color:'var(--txm)',marginTop:3}}>{k.sub}</div>
                  </div>
                  <SparkB data={k.spark} color={stColor(k.st)}/>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--txm)',borderTop:'1px solid var(--bdr)',paddingTop:6}}>
                  <span>🎯 {k.cible}</span>
                  <span style={{color:PB.s,fontWeight:600}}>{k.var}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}

      {tab==='pareto' && (
        <div className="card cp">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:PB.sd}}>Dépenses par fournisseur & courbe cumulée</div>
            <span style={{fontSize:11,color:'var(--txm)'}}>Total {W8().fmtK(totalSpend)} · {F.length} fournisseurs</span>
          </div>
          <div style={{fontSize:11,color:'var(--txm)',marginBottom:14}}>La barre verticale marque le seuil 80% : les fournisseurs à gauche (classe A) concentrent l'essentiel du spend et sont prioritaires en pilotage et négociation.</div>
          <div style={{position:'relative',height:230,display:'flex',alignItems:'flex-end',gap:4,paddingTop:20}}>
            {/* courbe cumulée */}
            <svg style={{position:'absolute',inset:'20px 0 24px 0',width:'100%',height:'calc(100% - 44px)',overflow:'visible',pointerEvents:'none'}} preserveAspectRatio="none" viewBox={`0 0 ${pareto.length} 100`}>
              <polyline points={pareto.map((f,i)=>`${i+0.5},${100-f.cumPct}`).join(' ')} fill="none" stroke={PB.terra} strokeWidth="0.7" vectorEffect="non-scaling-stroke"/>
              <line x1="0" y1="20" x2={pareto.length} y2="20" stroke={PB.gold} strokeWidth="0.5" strokeDasharray="2 2" vectorEffect="non-scaling-stroke"/>
            </svg>
            {pareto.map((f,i)=>(
              <div key={f.fid} data-ref-kind="supplier" data-ref-id={f.sid} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,height:'100%',justifyContent:'flex-end',cursor:'pointer'}} title={`${f.nom} · ${W8().fmtK(f.spend)} · ${f.pct.toFixed(1)}%`}>
                <div style={{width:'72%',height:`${f.spend/maxSpend*100}%`,background:abcColor[abc(f)],borderRadius:'3px 3px 0 0',transition:'opacity .15s'}}/>
                <span style={{fontSize:8.5,color:'var(--txm)',whiteSpace:'nowrap',transform:'rotate(-35deg)',transformOrigin:'center',marginTop:4,width:0,overflow:'visible'}}>{f.nom.split(' ')[0]}</span>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:16,marginTop:24,fontSize:11,color:'var(--txm)',justifyContent:'center'}}>
            {[['A','Classe A · top 80%'],['B','Classe B · 80-95%'],['C','Classe C · queue']].map(([k,l])=>(
              <span key={k} style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:12,height:12,borderRadius:3,background:abcColor[k]}}/>{l}</span>
            ))}
            <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:14,height:2,background:PB.terra}}/>Cumul %</span>
          </div>
        </div>
      )}

      {tab==='abc' && (
        <div className="card" style={{overflow:'hidden'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>
              {['Classe','Fournisseur','Spend','% du total','% cumulé','Dépendance','Pilotage recommandé'].map(h=><th key={h} style={{textAlign:h==='Fournisseur'?'left':'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',textTransform:'uppercase',letterSpacing:'.4px'}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {pareto.map(f=>{
                const cls=abc(f);
                const reco={A:'Revue trimestrielle + négo annuelle',B:'Revue semestrielle',C:'Gestion simplifiée / catalogue'}[cls];
                return (
                  <tr key={f.fid} data-ref-kind="supplier" data-ref-id={f.sid} style={{borderBottom:'1px solid var(--bdr)',cursor:'pointer'}}>
                    <td style={{padding:'9px 11px'}}><span style={{display:'inline-flex',width:24,height:24,borderRadius:6,background:abcColor[cls],color:'#fff',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:12}}>{cls}</span></td>
                    <td style={{padding:'9px 11px',fontWeight:600}}>{f.nom}</td>
                    <td style={{padding:'9px 11px',fontFamily:'Georgia,serif',fontWeight:700,color:PB.sd}}>{W8().fmtK(f.spend)}</td>
                    <td style={{padding:'9px 11px',color:'var(--txm)'}}>{f.pct.toFixed(1)}%</td>
                    <td style={{padding:'9px 11px',color:'var(--txm)'}}>{f.cumPct.toFixed(1)}%</td>
                    <td style={{padding:'9px 11px',color:f.dependance>50?PB.terra:'var(--tx)'}}>{f.dependance}%</td>
                    <td style={{padding:'9px 11px',fontSize:11,color:'var(--txm)'}}>{reco}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── SVG Charts ───────────────────────────────────────────────
function AreaChart({data, k1, k2, c1=P.s, c2=P.gold, h=150}){
  const W=600, H=h*2;
  const v1=data.map(d=>+d[k1]||0), v2=k2?data.map(d=>+d[k2]||0):[];
  const allV=[...v1,...v2]; const mn=Math.min(...allV), mx=Math.max(...allV)||1, rng=mx-mn;
  const px=(v,i)=>[i/(data.length-1)*(W-40)+20, H-20-(v-mn)/rng*(H-40)];
  const path=(vals)=>vals.map((v,i)=>{ const [x,y]=px(v,i); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
  const area=(vals,color)=>{ const p=path(vals); const [lx]=px(vals[vals.length-1],vals.length-1); const [fx]=px(vals[0],0); return `${p} L${lx.toFixed(1)} ${H-20} L${fx.toFixed(1)} ${H-20} Z`; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c1} stopOpacity=".18"/><stop offset="100%" stopColor={c1} stopOpacity=".01"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c2} stopOpacity=".22"/><stop offset="100%" stopColor={c2} stopOpacity=".01"/></linearGradient>
      </defs>
      {[0,.25,.5,.75,1].map(f=><line key={f} x1="20" y1={(H-20-(H-40)*f).toFixed(1)} x2={W-20} y2={(H-20-(H-40)*f).toFixed(1)} stroke="rgba(122,139,111,0.08)" strokeWidth="1"/>)}
      <path d={area(v1,c1)} fill="url(#g1)"/>
      {k2&&<path d={area(v2,c2)} fill="url(#g2)"/>}
      <path d={path(v1)} fill="none" stroke={c1} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {k2&&<path d={path(v2)} fill="none" stroke={c2} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>}
      {data.map((d,i)=>{
        const [x]=px(v1[i],i);

      })}
    </svg>
  );
}

function BarChart({data, dk, h=160, multi=false, keys=[], colors=CC}){
  const W=580, H=h*2;
  const vals=multi?data.flatMap(d=>keys.map(k=>+d[k]||0)):data.map(d=>+d[dk]||0);
  const mx=Math.max(...vals)||1;
  const n=data.length, bw=W/n, pad=bw*.14;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      {[0,.25,.5,.75,1].map(f=><line key={f} x1="0" y1={(H-20-(H-40)*f).toFixed(1)} x2={W} y2={(H-20-(H-40)*f).toFixed(1)} stroke="rgba(122,139,111,0.07)" strokeWidth="1"/>)}
      {data.map((d,i)=>{
        if(multi) return keys.map((k,ki)=>{
          const v=(+d[k]||0)/mx*(H-40); const subW=(bw-pad*2)/keys.length;
          const x=i*bw+pad+ki*subW; const y=H-20-v;
          return <rect key={k} x={x} y={y} width={subW-2} height={v} fill={colors[ki]} rx="3"/>;
        });
        const v=(+d[dk]||0)/mx*(H-40); const x=i*bw+pad; const y=H-20-v;
        return <rect key={i} x={x} y={y} width={bw-pad*2} height={v} fill={CC[i%CC.length]} rx="3"/>;
      })}
      {data.map((d,i)=>{
        const x=i*bw+bw/2;
        return i%2===0?<text key={i} x={x} y={H+2} textAnchor="middle" fontSize="16" fill={P.tx} opacity=".55">{d.month||d.name||''}</text>:null;
      })}
    </svg>
  );
}

function Donut({data, h=180}){
  const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
  let ang=-Math.PI/2; const cx=90, cy=h*.9, R=72, ri=46;
  const slices=data.map(d=>{
    const a=(d.value/total)*Math.PI*2;
    const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);
    ang+=a;
    const x2=cx+R*Math.cos(ang),y2=cy+R*Math.sin(ang);
    const ix1=cx+ri*Math.cos(ang-a),iy1=cy+ri*Math.sin(ang-a);
    const ix2=cx+ri*Math.cos(ang),iy2=cy+ri*Math.sin(ang);
    const lg=a>Math.PI?1:0;
    return {path:`M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R},0,${lg},1,${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ri},${ri},0,${lg},0,${ix1.toFixed(2)},${iy1.toFixed(2)} Z`,color:d.color||CC[0],name:d.name,value:d.value};
  });
  return (
    <svg viewBox={`0 0 320 ${h*1.8}`} style={{width:'100%',height:h}}>
      {slices.map((sl,i)=><path key={i} d={sl.path} fill={sl.color} opacity=".9"/>)}
      {data.map((d,i)=>(
        <g key={i} transform={`translate(182,${14+i*20})`}>

        </g>
      ))}
    </svg>
  );
}

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}}>
      {data.map((d,i)=>{

function RadarChart({data, dk='A', color=P.s, h=155}){
  const n=data.length, cx=80, cy=h*.9, R=62;
  const pts=data.map((d,i)=>{
    const ang=-Math.PI/2+i*(Math.PI*2/n), val=(d[dk]||0)/100;
    return {x:cx+R*val*Math.cos(ang),y:cy+R*val*Math.sin(ang),lx:cx+(R+20)*Math.cos(ang),ly:cy+(R+20)*Math.sin(ang),label:d.subject};
  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const grids=[.25,.5,.75,1].map(f=>data.map((_,i)=>{
    const ang=-Math.PI/2+i*(Math.PI*2/n);
    return `${(cx+R*f*Math.cos(ang)).toFixed(1)},${(cy+R*f*Math.sin(ang)).toFixed(1)}`;
  }).join(' '));
  return (
    <svg viewBox={`0 0 280 ${h*1.8}`} style={{width:'100%',height:h}}>
      {grids.map((g,i)=><polygon key={i} points={g} fill="none" stroke="rgba(122,139,111,0.13)" strokeWidth="1"/>)}

  );
}

function TcoModule(){
  const [v,setV]=useState({a:'',inst:'',maint:'',en:'',form:'',dur:'5',fin:''});
  const [res,setRes]=useState(null);
  const set=(k,val)=>setV(p=>({...p,[k]:val}));
  const calc=()=>{
    const pa=+v.a||0,inst=+v.inst||0,maint=(+v.maint||0)*(+v.dur||5),en=(+v.en||0)*(+v.dur||5),form=+v.form||0,fin=+v.fin||0;
    const h=inst+maint+en+form+fin,tot=pa+h;
    setRes({pa,h,tot,an:Math.round(tot/(+v.dur||5)),pct:pa>0?Math.round(h/pa*100):0,items:[{l:'Prix d\'achat',val:pa},{l:'Installation',val:inst},{l:'Maintenance totale',val:maint},{l:'Énergie totale',val:en},{l:'Formation',val:form},{l:'Fin de vie',val:fin}]});
  };
  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P.sd,marginBottom:3}}>Calculateur TCO</h2>
      <p style={{color:'var(--txm)',fontSize:13,marginBottom:18}}>Total Cost of Ownership — Révélez tous les coûts cachés</p>
      <div className="g2">
        <div className="card cp">
          <div className="g2" style={{marginBottom:12}}>
            {[{k:'a',l:"Prix d'achat (€)"},{k:'inst',l:'Installation (€)'},{k:'maint',l:'Maintenance/an (€)'},{k:'en',l:'Énergie/an (€)'},{k:'form',l:'Formation (€)'},{k:'dur',l:'Durée (ans)'},{k:'fin',l:'Fin de vie (€)'}].map(f=>(
              <div key={f.k}><label style={{fontSize:11,fontWeight:600,color:'var(--txm)',display:'block',marginBottom:3}}>{f.l}</label><input type="number" className="inp" value={v[f.k]} onChange={e=>set(f.k,e.target.value)} placeholder="0"/></div>
            ))}
          </div>
          <button className="btn btn-p" onClick={calc}>Calculer le TCO</button>
        </div>
        <div className="card cp">
          {res?(
            <div>
              <div style={{textAlign:'center',marginBottom:18}}>
                <div style={{fontSize:11,color:'var(--txm)',marginBottom:3}}>TCO Total sur {v.dur} ans</div>
                <div style={{fontFamily:'Georgia,serif',fontSize:34,fontWeight:700,color:P.s}}>{res.tot.toLocaleString('fr-FR')} €</div>
                <div style={{fontSize:12,color:'var(--txm)'}}>{res.an.toLocaleString('fr-FR')} €/an</div>
              </div>
              <div style={{background:'var(--bg)',borderRadius:9,padding:'11px 13px',marginBottom:12,border:'1px solid var(--bdr)'}}>
                {[{l:'Coûts visibles',val:res.pa,c:P.s},{l:'Coûts cachés 🧊',val:res.h,c:P.terra}].map(b=>(
                  <div key={b.l} style={{marginBottom:10}}>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:4}}>
                      <span style={{fontWeight:600}}>{b.l}</span><span style={{fontWeight:700,color:b.c}}>{b.val.toLocaleString('fr-FR')} €</span>
                    </div>
                    <div className="ptrack"><div className="pfill" style={{width:`${res.tot>0?b.val/res.tot*100:0}%`,background:b.c}}/></div>
                  </div>
                ))}
              </div>
              {res.items.filter(i=>i.val>0).map(i=>(
                <div key={i.l} style={{display:'flex',justifyContent:'space-between',fontSize:12,padding:'3px 0',borderBottom:'1px solid var(--bdr)'}}>
                  <span style={{color:'var(--txm)'}}>{i.l}</span><span style={{fontWeight:600}}>{i.val.toLocaleString('fr-FR')} €</span>
                </div>
              ))}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',color:'var(--txm)',gap:8}}>
              <span style={{fontSize:38,opacity:.3}}>💰</span><div style={{fontSize:12}}>Remplissez les champs et calculez</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Comparateur(){
  const [tab,setTab]=useState('compare');
  const [offers,setOffers]=useState(OFFERS_DEMO);
  const [weights,setWeights]=useState({prix:35,qual:20,delai:15,garantie:15,rse:15});
  const [savings,setSavings]=useState(SAVINGS_LOG);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({type:'Cost Saving',cat:'IT',sup:'',desc:'',amt:'',baseline:''});

  const minPrice=Math.min(...offers.map(o=>o.total));
  const maxPrice=Math.max(...offers.map(o=>o.total));
  const cheapest=offers.find(o=>o.total===minPrice);

  const score=(o)=>{
    const sPrix=100-((o.total-minPrice)/(maxPrice-minPrice||1))*100;
    const sQual=o.warranty*20+(o.warranty>=3?20:0);
    const sDelai=Math.max(0,100-o.delay*4);
    const sGar=o.warranty*22;
    const sRse=o.rse;
    return Math.round((sPrix*weights.prix+sQual*weights.qual+sDelai*weights.delai+sGar*weights.garantie+sRse*weights.rse)/100);
  };
  const scored=offers.map(o=>({...o,score:score(o)}));
  const winner=scored.reduce((a,b)=>a.score>b.score?a:b);
  const baselineMax=Math.max(...offers.map(o=>o.total));
  const winnerSavings=baselineMax-winner.total;

  const validated=savings.filter(s=>s.status==='Validé');
  const pending=savings.filter(s=>s.status==='En attente');
  const totalCS=validated.filter(s=>s.type==='Cost Saving').reduce((a,b)=>a+b.amt,0);

// Prefer external v8 window.* modules when they've loaded; fall back to local components.
function useV8(){
  const [ready,setReady]=useState(!!(window.APV8&&window.DashboardV8));
  useEffect(()=>{
    if(ready) return;
    const t=setInterval(()=>{
      if(window.APV8&&window.DashboardV8){setReady(true);clearInterval(t);}
    },120);
    return()=>clearInterval(t);
  },[ready]);
  return ready;
}

  // Cross-module navigation used by the v8 modules (window.APRef.goto)
  useEffect(()=>{
    if(window.APRef){window.APRef.goto=(id)=>setMod(id);}
    else {window.APRef={goto:(id)=>setMod(id),DB:{suppliers:{},contracts:{},orders:{},categories:{},docs:{},alerts:{}}};}
  },[]);

  useEffect(()=>{
    const root=document.documentElement;
    root.setAttribute('data-ambiance',t.ambiance);
    root.setAttribute('data-density',t.density);
    root.setAttribute('data-perso',t.perso);
  },[t.ambiance,t.density,t.perso]);

  // Global click delegation for cross-module drilldown (data-ref-kind / data-ref-id)
  useEffect(()=>{
    const h=(e)=>{
      const el=e.target.closest('[data-ref-kind][data-ref-id]');
      if(!el) return;
      if(window.APRef&&window.APRef.open){window.APRef.open(el.dataset.refKind,el.dataset.refId);}
    };
    document.addEventListener('click',h);
    return()=>document.removeEventListener('click',h);
  },[]);

  const ctx={goto:setMod,hero:'Mélanie'};

  const render=()=>{
    // v8 real modules (loaded via external .jsx) — take precedence when available
    if(v8){
      if(mod==='dashboard'&&window.DashboardV8) return React.createElement(window.DashboardV8,{ctx});
      if(mod==='basededonnees'&&window.BaseDonnees) return React.createElement(window.BaseDonnees,{ctx});
      if(mod==='processus'&&window.ProcessusV8) return React.createElement(window.ProcessusV8,{ctx});
      if(mod==='sourcing'&&window.Sourcing2) return React.createElement(window.Sourcing2,{ctx});
      if(mod==='workflows'&&window.Workflows2) return React.createElement(window.Workflows2,{ctx});
      if(mod==='risques'&&window.RisquesV8) return React.createElement(window.RisquesV8,{ctx});
      if(mod==='commandes'&&window.DemandesAchat) return React.createElement(window.DemandesAchat,{ctx});
      if(mod==='conseil'&&window.CoachNego) return React.createElement(window.CoachNego,{ctx});
      if(mod==='analyseur'&&window.VeilleMarches) return React.createElement(window.VeilleMarches,{ctx});
      if(mod==='calendrier'&&window.PlanAnnuel) return React.createElement(window.PlanAnnuel,{ctx});
      if(mod==='integrations'&&window.IntegrationsModule) return React.createElement(window.IntegrationsModule,{ctx});
      if(mod==='knowledge'&&window.KnowledgeModule) return React.createElement(window.KnowledgeModule,{ctx});
      // Extra routes the v8 dashboard may navigate to
      if(mod==='da'&&window.DemandesAchat) return React.createElement(window.DemandesAchat,{ctx});
      if(mod==='paa'&&window.PlanAnnuel) return React.createElement(window.PlanAnnuel,{ctx});
      if(mod==='veille'&&window.VeilleMarches) return React.createElement(window.VeilleMarches,{ctx});
      if(mod==='nego'&&window.CoachNego) return React.createElement(window.CoachNego,{ctx});
      if(mod==='budget'&&window.BudgetEngagements) return React.createElement(window.BudgetEngagements,{ctx});
      if(mod==='kpi'&&window.SuiviKPI) return React.createElement(window.SuiviKPI,{ctx});
      if(mod==='ged'&&window.GedAchats) return React.createElement(window.GedAchats,{ctx});
      if(mod==='alertes'&&window.CentreAlertes) return React.createElement(window.CentreAlertes,{ctx});
    }

    // Fallback : native components defined earlier in this file
    switch(mod){
      case 'dashboard': return <Dashboard/>;
      case 'processus': return <ProcessusAZ/>;
      case 'email': return <EmailModule/>;
      case 'sourcing': return <Sourcing/>;
      case 'workflows': return <Workflows/>;
      case 'comparateur': return <Comparateur/>;
      case 'dashboards': return <Dashboards/>;
      case 'tco': return <TcoModule/>;
      case 'contrats': return <AnalyseContrats/>;
      case 'eval': return <EvalFournisseurs/>;
      case 'risques': return <Risques/>;
      case 'rse': return <Rse/>;
      case 'prompts': return <PromptsLibrary/>;
      case 'couts': return <AnalyseCouts/>;
      case 'redaction': return <RedactionContrats/>;
      case 'integrations': return <Simple title="Intégrations" sub="Connectez AchatPro à votre ERP, SAP, DocuSign et outils métiers" icon="🔗"/>;
      case 'knowledge': return <Simple title="Base de connaissances" sub="Glossaire, procédures, modèles et micro-formations" icon="📚"/>;
      case 'basededonnees': return <Simple title="Base de données" sub="Chargement du référentiel fournisseurs…" icon="🗄️"/>;
      case 'commandes': return <Simple title="Commandes & Réceptions" sub="Bon de commande, réception, rapprochement 3-way, litiges facturation" icon="📦"/>;
      case 'analyseur': return <Simple title="Analyseur Documents" sub="Analyse IA de tout document reçu : offre, spec, courrier, réponse à consultation" icon="🔬"/>;
      case 'conseil': return <Simple title="Conseil Achat" sub="Coach IA sur mesure — préparation de négociation, dossier d'arbitrage, note au CODIR" icon="💡"/>;
      case 'calendrier': return <Simple title="Calendrier contrats" sub="Vue frise chronologique — échéances, préavis, renouvellements, alertes automatiques" icon="📅"/>;
      default: return <Dashboard/>;
    }
  };

  return (
    <div className={dark?'dark':''} style={{display:'flex',width:'100%',height:'100vh',overflow:'hidden',background:'var(--bg)'}}>
      <div className="sidebar">
        <div className="sidebar-logo">
          <span style={{fontSize:22}}>🌿</span>
          <div><div className="logo-text">AchatPro</div><div className="logo-sub">Copilote IA Achats</div></div>
        </div>
        <div className="snav">
          {NAV.map(s=>(
            <div key={s.sec}>
              <div className="sec-lbl">{s.sec}</div>
              {s.items.map(item=>(
                <button key={item.id} className={`ni ${mod===item.id?'active':''} ${item.id==='prompts'?'ni-prompts':''}`} onClick={()=>setMod(item.id)}>
                  <span style={{fontSize:14,flexShrink:0,width:18,textAlign:'center'}}>{item.e}</span>{item.l}
                </button>
              ))}
            </div>
          ))}
        </div>
        <div className="sfooter">
          <div className="ucard">
            <div className="avatar">MO</div>
            <div><div className="uname">Mélanie Oudoire</div><div className="urole">Responsable Achats</div></div>
          </div>
        </div>
      </div>
      <div className="main-area">
        <div className="topbar">
          <div className="breadcrumb">
            <span>{MOD_SEC[mod]}</span><span style={{opacity:.35}}>›</span><strong>{MOD_LABEL[mod]}</strong>
          </div>
          <div className="tsearch">
            <span style={{fontSize:13,opacity:.45}}>🔍</span>
            <input placeholder="Rechercher ou demander à l'IA…"/>
          </div>
          <div style={{display:'flex',gap:7}}>
            <div className="tbtn" style={{position:'relative'}}>🔔<div style={{position:'absolute',top:5,right:5,width:7,height:7,borderRadius:'50%',background:P.terra,border:'2px solid var(--card)'}}/></div>
            <button className="tbtn" onClick={()=>setDark(!dark)}>{dark?'☀️':'🌙'}</button>
            <button className="tbtn" onClick={()=>setIa(!ia)} style={{color:ia?P.s:'var(--txm)',borderColor:ia?P.s:'var(--bdr)'}}>✦</button>
          </div>
        </div>
        <div className="content-area">
          <div className="content">{render()}</div>
          <IaPanel open={ia} onClose={()=>setIa(false)} mod={mod}/>
          {window.APDetailDrawer?React.createElement(window.APDetailDrawer):null}
        </div>
      </div>
      {window.TweaksPanel?React.createElement(window.TweaksPanel,{title:'Tweaks'},
        React.createElement(window.TweakSection,{title:'Ambiance'},
          React.createElement(window.TweakRadio,{label:'Palette',value:t.ambiance,onChange:v=>setTweak('ambiance',v),options:[
            {value:'terre',label:'Terre'},{value:'aube',label:'Aube'},{value:'ardoise',label:'Ardoise'},{value:'encre',label:'Encre'},
          ]})
        ),
        React.createElement(window.TweakSection,{title:'Densité'},
          React.createElement(window.TweakRadio,{label:'Espacement',value:t.density,onChange:v=>setTweak('density',v),options:[
            {value:'compact',label:'Compact'},{value:'cosy',label:'Confort'},{value:'airy',label:'Spacieux'},
          ]})
        ),
        React.createElement(window.TweakSection,{title:'Personnalité'},
          React.createElement(window.TweakRadio,{label:'Style',value:t.perso,onChange:v=>setTweak('perso',v),options:[
            {value:'botanique',label:'Botanique'},{value:'editorial',label:'Editorial'},{value:'tech',label:'Tech'},
          ]})
        )
      ):null}
      {!ia&&<button className="fab" onClick={()=>setIa(true)} title="Assistant IA">✦</button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
