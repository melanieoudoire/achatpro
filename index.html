<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AchatPro — Copilote IA Achats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F5F1EA;--card:#FAF7F2;--card2:#E8DFD3;
  --sl:#A8B89B;--s:#7A8B6F;--sd:#3D4A3D;
  --tx:#5A5A52;--txs:#3D4A3D;--txm:#9A9A8E;
  --gold:#C9A961;--terra:#B85C3E;
  --bdr:rgba(122,139,111,0.15);
  --sh:0 2px 12px rgba(60,70,60,0.06);
  --shm:0 4px 24px rgba(60,70,60,0.10);
  --r:16px;--rsm:10px;
  --pad:24px;--gap:14px;--fs:13px;--ttl:22px;
}
/* Densité — Compact / Confort / Spacieux */
[data-density="compact"]{--pad:16px;--gap:9px;--fs:12px;--ttl:19px;--r:11px;--rsm:7px}
[data-density="cosy"]{--pad:24px;--gap:14px;--fs:13px;--ttl:22px}
[data-density="airy"]{--pad:36px;--gap:22px;--fs:14px;--ttl:28px;--r:22px;--rsm:14px}
[data-density="airy"] .card{padding:24px}
[data-density="airy"] .kpi{padding:22px}
[data-density="compact"] .card{padding:11px 13px}
[data-density="compact"] .kpi{padding:11px 13px}
[data-density="compact"] .kpi-v{font-size:20px}
[data-density="airy"] .kpi-v{font-size:32px}

/* Ambiance — palette moods */
[data-ambiance="terre"]{--bg:#F5F1EA;--card:#FAF7F2;--card2:#E8DFD3;--sl:#A8B89B;--s:#7A8B6F;--sd:#3D4A3D;--gold:#C9A961;--terra:#B85C3E}
[data-ambiance="argile"]{--bg:#D7C9B8;--card:#F5F1EA;--card2:#E8DCC8;--sl:#B2967D;--s:#7D5A44;--sd:#4A342A;--tx:#4A342A;--txs:#4A342A;--txm:#7D5A44;--gold:#B2967D;--terra:#7D5A44;--bdr:rgba(74,52,42,0.18)}
[data-perso="botanique"] [data-ambiance="argile"] h1,
[data-perso="botanique"] [data-ambiance="argile"] h2,
[data-perso="botanique"] [data-ambiance="argile"] h3,
[data-perso="botanique"] [data-ambiance="argile"] .kpi-v{font-family:'Playfair Display','Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;letter-spacing:-0.01em}
[data-ambiance="argile"] h1,
[data-ambiance="argile"] h2,
[data-ambiance="argile"] h3,
[data-ambiance="argile"] .kpi-v{font-family:'Playfair Display','Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;letter-spacing:-0.01em}
[data-ambiance="argile"] .logo-text,
[data-ambiance="argile"] .ni,
[data-ambiance="argile"] .breadcrumb,
[data-ambiance="argile"] .breadcrumb strong,
[data-ambiance="argile"] .uname,
[data-ambiance="argile"] .sec-lbl{font-family:'Playfair Display',Georgia,serif;font-style:italic}
[data-ambiance="argile"] .logo-text{font-weight:700;font-size:19px}
[data-ambiance="argile"] .sec-lbl{font-weight:600;letter-spacing:.5px}
[data-ambiance="argile"] .ni{font-weight:500;font-size:13.5px}
[data-ambiance="argile"] .ni.active{font-weight:700}
[data-ambiance="argile"] .breadcrumb{font-style:normal}
[data-ambiance="argile"] .breadcrumb strong{font-style:italic;font-weight:700}
[data-ambiance="argile"] .hero-h1{color:#4A2C1A !important}
[data-ambiance="aube"]{--bg:#F4EDE5;--card:#FBF6EE;--card2:#E8D7C2;--sl:#E0AD8F;--s:#C77F58;--sd:#5C3A2A;--gold:#D9A14A;--terra:#A8412B}
[data-ambiance="ardoise"]{--bg:#EEF1F2;--card:#F8FAFA;--card2:#D9DFE2;--sl:#90A0A8;--s:#5E7480;--sd:#1F2D33;--gold:#A88E5C;--terra:#A14B3E}
[data-ambiance="encre"]{--bg:#1F1F22;--card:#2A2B2E;--card2:#34353A;--sl:#9CB6E0;--s:#6B8AB8;--sd:#E8ECF2;--tx:#C8CED8;--txs:#E8ECF2;--txm:#7A7E88;--gold:#D4B36A;--terra:#D87A5E;--bdr:rgba(156,182,224,0.14);--sh:0 2px 12px rgba(0,0,0,0.3);--shm:0 4px 28px rgba(0,0,0,0.45)}

/* Personnalité — type system */
[data-perso="botanique"]{--ff-h:Georgia,'Playfair Display',serif;--ff-b:Inter,system-ui,sans-serif;--lg-shape:8px}
[data-perso="editorial"]{--ff-h:'Times New Roman',Georgia,serif;--ff-b:Georgia,serif;--lg-shape:2px}
[data-perso="editorial"] .kpi-v,[data-perso="editorial"] h1,[data-perso="editorial"] h2{letter-spacing:-0.02em;font-style:italic}
[data-perso="editorial"] .badge{border-radius:2px!important;text-transform:uppercase;letter-spacing:1px}
[data-perso="tech"]{--ff-h:'Inter','SF Pro Display',system-ui,sans-serif;--ff-b:'Inter',system-ui,sans-serif;--lg-shape:6px;--r:8px;--rsm:6px}
[data-perso="tech"] .kpi-v,[data-perso="tech"] h1,[data-perso="tech"] h2{font-family:'Inter',system-ui,sans-serif!important;font-weight:800;letter-spacing:-0.03em}
[data-perso="tech"] .badge{font-family:'JetBrains Mono','Courier New',monospace;text-transform:lowercase}

body{font-family:var(--ff-b,Inter,system-ui,sans-serif)}
h1,h2,h3,.kpi-v{font-family:var(--ff-h,Georgia,serif)}
.dark{
  --bg:#2A2D26;--card:#363A33;--card2:#2F3229;
  --bdr:rgba(168,184,155,0.12);
  --tx:#C8C8B8;--txs:#E8E8D8;--txm:#7A7A68;
  --sh:0 2px 12px rgba(0,0,0,0.2);--shm:0 4px 24px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
#root{height:100vh;display:flex;overflow:hidden}

.sidebar{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr)}
.logo-text{font-family:Georgia,serif;font-weight:700;font-size:17px;color:var(--sd)}
.logo-sub{font-size:10px;color:var(--txm);letter-spacing:.5px;text-transform:uppercase}
.snav{flex:1;overflow-y:auto;padding:6px 8px;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txm);padding:8px 8px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--tx);font-size:12.5px;font-weight:500;transition:all .13s}
.ni:hover{background:rgba(122,139,111,0.09);color:var(--sd)}
.ni.active{background:rgba(122,139,111,0.14);color:var(--sd);font-weight:700}
.ni-prompts{background:rgba(201,169,97,0.09) !important;border:1px solid rgba(201,169,97,0.22) !important}
.ni-prompts:hover,.ni-prompts.active{background:rgba(201,169,97,0.16) !important}
.sfooter{padding:10px;border-top:1px solid var(--bdr)}
.ucard{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .13s}
.ucard:hover{background:rgba(122,139,111,0.07)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--sl),var(--s));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--txs)}
.urole{font-size:10px;color:var(--txm)}

.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
.breadcrumb{font-size:13px;color:var(--txm);flex:1;display:flex;align-items:center;gap:5px}
.breadcrumb strong{color:var(--txs);font-weight:600}
.tsearch{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--bdr);border-radius:30px;padding:5px 13px;width:270px}
.tsearch input{background:none;border:none;outline:none;font-size:12px;color:var(--tx);width:100%}
.tsearch input::placeholder{color:var(--txm)}
.tbtn{width:32px;height:32px;border-radius:7px;border:1px solid var(--bdr);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txm);font-size:14px;transition:all .13s}
.tbtn:hover{border-color:var(--sl);color:var(--sd)}

.content-area{display:flex;flex:1;overflow:hidden}
.content{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}

/* Cards */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh)}
.cp{padding:18px 20px}
.csm{padding:12px 14px}
.card-hover{transition:all .18s;cursor:pointer}
.card-hover:hover{box-shadow:var(--shm);transform:translateY(-2px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all .16s}
.btn-p{background:var(--s);color:#fff}.btn-p:hover{background:var(--sd);transform:translateY(-1px);box-shadow:0 4px 12px rgba(122,139,111,0.3)}
.btn-s{background:transparent;color:var(--s);border:1.5px solid var(--s)}.btn-s:hover{background:rgba(122,139,111,0.07)}
.btn-g{background:transparent;color:var(--txm);border:1px solid var(--bdr);font-size:11.5px;padding:6px 12px}.btn-g:hover{color:var(--sd);border-color:var(--sl)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.b-sage{background:rgba(168,184,155,0.22);color:var(--sd);border:1px solid rgba(122,139,111,0.18)}
.b-gold{background:rgba(201,169,97,0.14);color:#8A5E10;border:1px solid rgba(201,169,97,0.28)}
.b-terra{background:rgba(184,92,62,0.10);color:var(--terra);border:1px solid rgba(184,92,62,0.2)}
.b-muted{background:rgba(154,154,142,0.10);color:var(--txm);border:1px solid var(--bdr)}
.b-sys{background:rgba(61,74,61,0.09);color:var(--sd);border:1px solid rgba(61,74,61,0.18)}
.b-team{background:rgba(122,139,111,0.11);color:var(--s);border:1px solid rgba(122,139,111,0.22)}
.b-perso{background:rgba(201,169,97,0.11);color:#8A5E10;border:1px solid rgba(201,169,97,0.28)}

/* KPI */
.kpi{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:16px 18px;box-shadow:var(--sh);transition:all .18s;cursor:default}
.kpi:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.kpi-v{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--sd);margin:5px 0 2px}
.kpi-l{font-size:11px;color:var(--txm);font-weight:500}
.kpi-d{font-size:11px;font-weight:600;margin-top:3px}
.up{color:var(--s)}.dn{color:var(--terra)}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* Input */
.inp{width:100%;padding:7px 11px;border-radius:8px;border:1px solid var(--bdr);background:var(--bg);color:var(--tx);font-size:12.5px;outline:none;font-family:inherit;transition:border-color .14s}
.inp:focus{border-color:var(--sl);box-shadow:0 0 0 3px rgba(122,139,111,0.08)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}

/* Chip */
.chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bdr);background:var(--bg);color:var(--tx);transition:all .13s}
.chip:hover,.chip.on{background:var(--s);color:#fff;border-color:var(--s)}

/* Progress */
.ptrack{height:5px;background:var(--card2);border-radius:10px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--s),var(--sl));border-radius:10px;transition:width .8s ease}

/* Steps */
.steprow{display:flex;align-items:flex-start;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.steprow::-webkit-scrollbar{display:none}
.snum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--bdr);flex-shrink:0;transition:all .18s}
.snum.done{background:var(--s);border-color:var(--s);color:#fff}
.snum.active{background:var(--sd);border-color:var(--sd);color:#fff;box-shadow:0 0 0 4px rgba(122,139,111,0.18)}
.snum.idle{background:var(--bg);color:var(--txm)}
.sconn{width:36px;height:2px;flex-shrink:0;margin-top:13px;background:var(--bdr)}
.sconn.done{background:var(--s)}
.slbl{font-size:9.5px;font-weight:600;margin-top:4px;text-align:center;color:var(--txm);max-width:60px}
.slbl.on{color:var(--sd)}

/* IA Panel */
.ia-panel{width:320px;flex-shrink:0;background:var(--card);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.ia-panel.shut{width:0;border:none}
.ia-hdr{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px;flex-shrink:0}
.ia-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.bub{padding:9px 12px;border-radius:10px;font-size:11.5px;line-height:1.6}
.bub-ai{background:rgba(168,184,155,0.18);color:var(--txs);border-radius:3px 10px 10px 10px}
.bub-u{background:var(--sd);color:#fff;border-radius:10px 3px 10px 10px}
.ia-sug{padding:7px 10px;border-top:1px solid var(--bdr);flex-shrink:0}
.ia-sug-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txm);margin-bottom:5px}
.sugg{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;background:rgba(168,184,155,0.1);border:1px solid rgba(122,139,111,0.13);font-size:11px;color:var(--sd);cursor:pointer;margin-bottom:4px;transition:all .12s}
.sugg:hover{background:rgba(122,139,111,0.14)}
.ia-inp-row{padding:8px 10px;border-top:1px solid var(--bdr);display:flex;gap:6px;flex-shrink:0}
.ia-inp{flex:1;padding:6px 9px;border-radius:7px;border:1px solid var(--bdr);background:var(--bg);font-size:11.5px;color:var(--tx);outline:none}
.ia-send{width:30px;height:30px;border-radius:7px;background:var(--s);border:none;color:#fff;cursor:pointer;font-size:14px;transition:all .13s}
.ia-send:hover{background:var(--sd)}

/* Prompt card */
.pcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rsm);padding:12px 14px;cursor:pointer;transition:all .16s;margin-bottom:7px}
.pcard:hover,.pcard.sel{border-color:var(--s);box-shadow:0 0 0 2px rgba(122,139,111,0.08)}
.pcard.sel{background:rgba(122,139,111,0.03)}

/* Kanban */
.kcol{background:var(--bg);border-radius:var(--rsm);border:1px solid var(--bdr);padding:10px;min-height:180px}
.khdr{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txm);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:11.5px;transition:all .13s}
.kcard:hover{border-color:var(--sl);box-shadow:var(--sh);transform:translateY(-1px)}

/* Divider */
hr.div{border:none;border-top:1px solid var(--bdr);margin:14px 0}

/* Prompt content */
.pcontent{font-family:monospace;font-size:11.5px;line-height:1.75;color:var(--tx);background:var(--bg);padding:13px;border-radius:8px;border:1px solid var(--bdr);white-space:pre-wrap;word-break:break-word}

/* Alert */
.aitem{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--rsm);border:1px solid var(--bdr);background:var(--card);margin-bottom:7px;transition:all .14s;cursor:pointer}
.aitem:hover{box-shadow:var(--sh);border-color:var(--sl)}

/* Split */
.split{display:flex;flex:1;overflow:hidden}
.sl-left{flex:1;overflow-y:auto;border-right:1px solid var(--bdr);padding:18px 20px;scrollbar-width:thin}
.sl-right{width:300px;flex-shrink:0;overflow-y:auto;padding:18px;background:var(--card);scrollbar-width:thin}

/* Tabs */
.tab-row{display:flex;gap:5px;margin-bottom:14px}
.tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--bdr);background:transparent;color:var(--txm);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s}
.tab.on{border-color:var(--s);background:rgba(122,139,111,0.09);color:var(--sd);font-weight:700}

/* FAB */
.fab{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;background:var(--sd);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(61,74,61,0.28);transition:all .18s;z-index:100;font-size:18px;color:#fff}
.fab:hover{background:var(--s);transform:scale(1.08)}

/* Anim */
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .22s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px}

/* Presentation mode — zoom for soutenance */
[data-presentation="on"]{font-size:15.5px}
[data-presentation="on"] .kpi-v{font-size:30px}
[data-presentation="on"] h1{font-size:32px}
[data-presentation="on"] h2{font-size:26px}
[data-presentation="on"] .breadcrumb{font-size:14.5px}
[data-presentation="on"] .ni{font-size:13.5px;padding:9px 11px}

/* Drilldown breadcrumb chip */
.crumb-back{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;background:rgba(122,139,111,0.10);color:var(--sd);font-size:11.5px;font-weight:600;border:1px solid rgba(122,139,111,0.18);cursor:pointer;transition:all .12s;margin-bottom:14px}
.crumb-back:hover{background:rgba(122,139,111,0.18)}

/* Severity pills */
.sev{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.sev-crit{background:rgba(184,92,62,0.13);color:var(--terra);border:1px solid rgba(184,92,62,0.28)}
.sev-urg{background:rgba(217,119,6,0.13);color:#9a5a06;border:1px solid rgba(217,119,6,0.26)}
.sev-att{background:rgba(201,169,97,0.16);color:#8a6610;border:1px solid rgba(201,169,97,0.32)}
.sev-info{background:rgba(122,139,111,0.10);color:var(--s);border:1px solid rgba(122,139,111,0.22)}

/* Highlight in doc viewer */
.hi-g{background:rgba(122,139,111,0.22);border-bottom:1.5px solid var(--s);cursor:pointer;border-radius:3px;padding:0 2px}
.hi-y{background:rgba(201,169,97,0.30);border-bottom:1.5px solid #C9A961;cursor:pointer;border-radius:3px;padding:0 2px}
.hi-r{background:rgba(184,92,62,0.22);border-bottom:1.5px solid var(--terra);cursor:pointer;border-radius:3px;padding:0 2px}
.hi-on{outline:2px solid var(--sd);outline-offset:1px}

/* Drop zone */
.dropz{border:2px dashed var(--bdr);border-radius:14px;padding:32px 22px;text-align:center;background:var(--bg);transition:all .15s;cursor:pointer}
.dropz:hover,.dropz.on{border-color:var(--s);background:rgba(122,139,111,0.05)}

/* Horizon column */
.horizon{background:var(--bg);border-radius:var(--rsm);border:1px solid var(--bdr);padding:12px 13px;min-height:240px}
.horizon-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.horizon-lbl{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--txm)}

/* Conseil / alert card */
.ccard{background:var(--card);border:1px solid var(--bdr);border-radius:9px;padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:all .14s}
.ccard:hover{border-color:var(--sl);box-shadow:var(--sh);transform:translateY(-1px)}
.ccard.sel{border-color:var(--s);background:rgba(122,139,111,0.04);box-shadow:0 0 0 2px rgba(122,139,111,0.08)}

/* Doc viewer */
.doc-paper{background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:18px 20px;font-family:Georgia,serif;font-size:13px;line-height:1.85;color:var(--tx);white-space:pre-wrap;max-height:none}
.doc-paper strong{color:var(--sd)}

/* APRef — Drilldown universal drawer */
[data-ref-kind][data-ref-id]{cursor:pointer;transition:background .12s,color .12s,border-color .12s}
[data-ref-kind][data-ref-id]:hover{filter:brightness(.95)}
.apref-shell{position:fixed;inset:0;z-index:2147483640;display:flex;justify-content:flex-end;animation:apref-fi .2s ease}
@keyframes apref-fi{from{opacity:0}to{opacity:1}}
.apref-backdrop{position:absolute;inset:0;background:rgba(30,28,22,0.32);backdrop-filter:blur(2px)}
.apref-drawer{position:relative;width:440px;max-width:95vw;height:100%;background:var(--card);border-left:1px solid var(--bdr);box-shadow:-14px 0 48px rgba(40,34,22,0.18);display:flex;flex-direction:column;animation:apref-sl .26s cubic-bezier(.2,.7,.2,1)}
@keyframes apref-sl{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
.apref-shell *{box-sizing:border-box}
.apref-shell .btn{justify-content:flex-start}
</style>

<script>
// ── window.claude.complete — mock intelligent pour démo hors-ligne ─────────
// Analyse le prompt et retourne une réponse française réaliste selon le cas.
(function(){
  const R = (t, delay) => new Promise(res => setTimeout(() => res(t), delay || 900 + Math.random() * 900));

  function pick(prompt) {
    const p = String(prompt || '').toLowerCase();

    // ── Rédaction / contrats ─────────────────────────────────────
    if (p.includes('rédige') && (p.includes('contrat') || p.includes('article'))) {
      return `CONTRAT DE PRESTATION DE SERVICES\n\nENTRE LES SOUSSIGNÉS :\n\nLa société [CLIENT], SAS au capital de [MONTANT] €, dont le siège social est situé [ADRESSE], immatriculée au RCS sous le numéro [SIREN], représentée par Mme Mélanie Oudoire en qualité de Responsable Achats, ci-après dénommée « le Client »,\nD'une part,\n\nET\n\nLa société [FOURNISSEUR], dont le siège social est situé [ADRESSE], immatriculée au RCS sous le numéro [SIREN], représentée par [NOM] en qualité de [FONCTION], ci-après dénommée « le Prestataire »,\nD'autre part.\n\nARTICLE 1 — OBJET\nLe Prestataire s'engage à fournir au Client les prestations décrites en annexe I, conformément au cahier des charges annexé aux présentes.\n\nARTICLE 2 — DURÉE\nLe présent contrat est conclu pour une durée déterminée. Il prend effet à sa signature et court jusqu'à l'exécution complète des prestations.\n\nARTICLE 3 — PRIX ET MODALITÉS DE PAIEMENT\nLe prix forfaitaire des prestations est fixé conformément au bordereau de prix annexé. Les factures seront réglées à 30 jours fin de mois, par virement bancaire.\n\nARTICLE 4 — PÉNALITÉS DE RETARD\nEn cas de retard dans l'exécution des prestations, une pénalité de 1 % par semaine de retard sera appliquée, plafonnée à 10 % du montant du contrat.\n\nARTICLE 5 — RÉCEPTION ET CONTRÔLE QUALITÉ\nLa réception fait l'objet d'un procès-verbal contradictoire. Le Client dispose d'un délai de 15 jours pour formuler des réserves.\n\nARTICLE 6 — GARANTIE\nLe Prestataire garantit les prestations pendant une durée de 12 mois à compter de la réception définitive.\n\nARTICLE 7 — RÉSILIATION\nChacune des parties pourra résilier le présent contrat moyennant un préavis de 3 mois notifié par lettre recommandée avec accusé de réception.\n\nARTICLE 8 — LIMITATION DE RESPONSABILITÉ\nLa responsabilité du Prestataire est plafonnée au montant total du contrat, hors dommages résultant d'une faute lourde ou intentionnelle.\n\nARTICLE 9 — FORCE MAJEURE\nAucune des parties ne pourra être tenue responsable de l'inexécution de ses obligations en cas de force majeure.\n\nARTICLE 10 — CONFIDENTIALITÉ\nLes parties s'engagent à préserver la confidentialité de toute information échangée pendant l'exécution du présent contrat et pendant 5 ans après son terme.\n\nARTICLE 11 — LOI APPLICABLE ET JURIDICTION\nLe présent contrat est régi par la loi française. Tout litige relèvera de la compétence exclusive du Tribunal de Commerce de Lyon.\n\nFait à Lyon, le [DATE], en deux exemplaires originaux.\n\nPour le Client                                    Pour le Prestataire\nMélanie Oudoire                                   [NOM PRÉNOM]\nResponsable Achats                                [FONCTION]`;
    }

    // ── Analyse de contrat (retourne JSON structuré) ────────────
    if (p.includes('retourne exactement ce format json') || (p.includes('json') && p.includes('analyse') && p.includes('contrat'))) {
      return JSON.stringify({
        score: 68,
        type: "Contrat de prestation de services",
        synthese: "Contrat de nettoyage industriel sur 36 mois avec reconduction tacite biennale et préavis court. La grille tarifaire prévoit une indexation annuelle plafonnée. Plusieurs clauses présentent un déséquilibre significatif au détriment du Client, notamment sur la responsabilité et les pénalités asymétriques. Une renégociation ciblée sur 4 clauses permettrait de ramener le score de risque à un niveau acceptable.",
        parties: ["ACME France SAS (Client)", "CleanPro Services SARL (Prestataire)"],
        montant: "285 000 € HT/an",
        duree: "36 mois",
        dates: [
          {label: "Prise d'effet", date: "1er juin 2026", type: "ok"},
          {label: "Fin initiale", date: "31 mai 2029", type: "warn"},
          {label: "Préavis reconduction", date: "31 mars 2029", type: "risk"}
        ],
        clauses: [
          {nom: "Reconduction tacite biennale", extrait: "reconduit tacitement par périodes successives de 24 mois", niveau: "rouge", commentaire: "Engagement automatique de 2 ans sans consentement explicite. Renégocier vers une reconduction expresse annuelle."},
          {nom: "Exclusivité post-contractuelle", extrait: "pendant 24 mois après son terme", niveau: "rouge", commentaire: "Non-concurrence de 24 mois excessive et probablement inapplicable en l'état. À supprimer ou plafonner à 6 mois maximum."},
          {nom: "Pénalités asymétriques", extrait: "Aucune pénalité ne peut être appliquée au Client", niveau: "rouge", commentaire: "Déséquilibre manifeste : seul le Prestataire est sanctionné. Exiger la réciprocité."},
          {nom: "Limitation de responsabilité", extrait: "limitée au montant des prestations facturées au cours des 3 derniers mois", niveau: "orange", commentaire: "Plafond très bas (~71 K€). Négocier a minima 12 mois de facturation."},
          {nom: "Résiliation Client", extrait: "Préavis de 12 mois requis pour toute résiliation à l'initiative du Client", niveau: "orange", commentaire: "Préavis disproportionné. Le usage sur ce type de prestation est 3 à 6 mois."},
          {nom: "Indexation prix", extrait: "Indexation annuelle automatique selon indice INSEE des services généraux, plafonnée à +5%", niveau: "vert", commentaire: "Clause équilibrée : indice objectif et plafond raisonnable."},
          {nom: "Prix forfaitaire", extrait: "prix forfaitaire annuel est fixé à 285 000 € HT", niveau: "vert", commentaire: "Prix ferme, transparent et clairement défini."}
        ],
        manquantes: [
          "Clause RGPD / traitement des données personnelles (obligatoire dès qu'il y a accès aux systèmes)",
          "Engagement RSE et devoir de vigilance",
          "Clause d'audit du Prestataire par le Client",
          "Procédure de règlement amiable préalable à la saisine du tribunal"
        ],
        recommandations: [
          "Renégocier la reconduction tacite en reconduction expresse annuelle — impact : suppression d'un engagement automatique de 570 K€.",
          "Rétablir la réciprocité des pénalités : le Client doit pouvoir sanctionner un manquement de la même manière que le Prestataire.",
          "Ramener la limitation de responsabilité à 12 mois de facturation (285 K€) au lieu de 3 mois (71 K€).",
          "Supprimer ou plafonner à 6 mois la clause de non-concurrence post-contractuelle.",
          "Aligner les préavis de résiliation à 6 mois pour les deux parties."
        ]
      }, null, 2);
    }

    // ── Emails achat ─────────────────────────────────────────────
    if (p.includes('email') || p.includes('relance') || p.includes('négociation prix') || p.includes('refus')) {
      if (p.includes('relance')) {
        return `Objet : Relance urgente — Réponse attendue à notre consultation\n\nBonjour,\n\nJe fais suite à notre consultation transmise le [DATE], à laquelle nous n'avons toujours pas reçu votre offre malgré nos échanges précédents.\n\nJe vous rappelle les éléments clés :\n- Référence : [REF_DOCUMENT]\n- Montant estimé : [MONTANT] €\n- Date limite initiale : [DATE_LIMITE]\n\nSans réponse de votre part sous 48 heures, nous serons contraints de retirer votre société de la consultation et de statuer avec les offres reçues à ce jour.\n\nJe reste disponible pour tout éclaircissement qui pourrait vous permettre de finaliser votre proposition.\n\nCordialement,\nMélanie Oudoire\nResponsable Achats`;
      }
      if (p.includes('négociation') || p.includes('réduction')) {
        return `Objet : Demande de révision tarifaire — Contrat [REF]\n\nBonjour,\n\nAprès analyse comparative de votre offre avec les propositions du marché sur ce périmètre, nous constatons un écart tarifaire de +12% par rapport à la moyenne des 4 offres reçues.\n\nEn cohérence avec notre partenariat historique et le volume annuel engagé ([MONTANT] € HT), je vous sollicite formellement pour un alignement tarifaire à -8%.\n\nEn contrepartie, nous vous confirmons :\n- Un engagement pluriannuel sur 3 ans\n- Un délai de paiement ramené à 30 jours fin de mois\n- Un objectif de volume révisé à la hausse de 15%\n\nJe vous propose un échange en visio la semaine prochaine pour finaliser les modalités. Merci de me confirmer vos disponibilités mardi ou jeudi entre 10h et 12h.\n\nCordialement,\nMélanie Oudoire\nResponsable Achats`;
      }
      if (p.includes('refus') || p.includes('décliner')) {
        return `Objet : Suite à votre proposition — Consultation [REF]\n\nBonjour,\n\nJe vous remercie pour le soin apporté à votre offre transmise le [DATE], que nous avons étudiée avec attention.\n\nAprès analyse comparative des propositions reçues sur des critères de prix, de délai et de couverture géographique, votre offre n'a pas été retenue à l'issue de cette consultation.\n\nCe choix ne remet aucunement en cause la qualité de votre proposition ni notre appréciation de vos équipes. Nous vous encourageons à candidater à nos prochaines consultations sur ce segment.\n\nJe reste à votre disposition pour un débriefing téléphonique si vous le souhaitez.\n\nCordialement,\nMélanie Oudoire\nResponsable Achats`;
      }
      return `Objet : [À COMPLÉTER]\n\nBonjour,\n\n[Corps du message professionnel généré selon le scénario, ton et langue demandés]\n\nCordialement,\nMélanie Oudoire\nResponsable Achats`;
    }

    // ── Structurer un besoin ────────────────────────────────────
    if (p.includes('expression de besoin') || p.includes('structurer un besoin') || p.includes('exprimé librement')) {
      return `EXPRESSION DE BESOIN — MAINTENANCE CVC MULTI-SITES\n\n1. PÉRIMÈTRE À CONFIRMER\n- 14 sites en France (nombre à valider par la DT : possibilité de 12 ou 15 selon les projets d'ouverture 2027)\n- Composition du parc : 62 centrales de traitement d'air, dont X centrales de forte puissance (>500 kW)\n- Sites classés critiques (arrêt = perte d'exploitation) à identifier explicitement\n\n2. PRESTATIONS ATTENDUES\n- Maintenance préventive selon programme constructeur\n- Maintenance corrective avec astreinte 24/7\n- SLA d'intervention 4h sur les sites critiques, 24h sur les autres\n- Reporting mensuel d'interventions et indicateurs de performance\n- Retrofit progressif des installations utilisant des fluides HFC (règlement F-Gas)\n\n3. CONTRAINTES DE SERVICE\n- Continuité pendant les périodes de pic (juin-août, décembre-février)\n- Coordination avec les responsables techniques de site\n- Certification ISO 50001 requise (trajectoire CSRD 2027)\n- Pénalités de non-respect SLA à négocier\n\n4. DONNÉES MANQUANTES À RÉCLAMER AU DEMANDEUR\n→ Question 1 : "Peux-tu confirmer la liste exhaustive des 14 sites et pour chacun le niveau de criticité (critique / standard) ?"\n→ Question 2 : "Quels sont les projets d'ouverture ou fermeture de site prévus sur les 3 prochaines années ?"\n→ Question 3 : "As-tu un historique consolidé des interventions et des indisponibilités des 24 derniers mois pour dimensionner le contrat ?"`;
    }

    // ── Négociation ─────────────────────────────────────────────
    if (p.includes('dossier de négociation') || p.includes('préparer la négociation')) {
      return `DOSSIER DE NÉGOCIATION — Renouvellement maintenance CVC 14 sites\n\n1. OBJECTIF & POSITION DE REPLI\n- Objectif : reconduction à 385 K€/an (-8% vs proposition +16% du titulaire), soit 3 ans à 1 155 K€\n- Position de repli : 401 K€/an avec engagement de performance énergétique (-4% de conso garantis)\n- Ligne rouge : refus de toute reconduction > 405 K€/an sans SLA renforcé\n\n2. CINQ LEVIERS DANS L'ORDRE\n① BENCHMARK MARCHÉ : présenter les 3 offres alternatives (372 à 401 K€) pour objectiver le juste prix\n② ANCIENNETÉ SANS REMISE EN CONCURRENCE : 3 ans de partenariat sans consultation = position de rente à corriger\n③ ENGAGEMENT VOLUME : proposer un contrat 3 ans ferme + 2 ans optionnels contre concession tarifaire\n④ INDEXATION MAÎTRISÉE : négocier indice INSEE plafonné à +2%/an au lieu de la révision libre\n⑤ CLAUSE DE PERFORMANCE : introduire un bonus/malus sur les indicateurs de disponibilité\n\n3. CONCESSIONS ACCEPTABLES ET LEUR COÛT\n- Paiement 30j au lieu de 45j : coût de trésorerie ~2 K€/an\n- Extension du périmètre astreinte à 2 sites supplémentaires : ~8 K€/an\n- Renonciation à l'audit annuel externe : gain qualité -, coût 0€\n\n4. BATNA RÉEL & RISQUES\nMeilleure alternative : Engie Solutions à 386 K€ (leader marché, ISO 50001, couverture 14/14)\nRisques du changement : période de transition 3-4 mois, coût d'onboarding ~15 K€, risque opérationnel modéré sur 4 sites critiques\n\n5. TROIS OBJECTIONS ATTENDUES\n→ "Nos coûts ont augmenté de 16% à cause de l'inflation" : Réponse — l'indice INSEE maintenance progresse de +6% sur 24 mois, pas +16%. Refus argumenté.\n→ "Un nouveau prestataire mettra 6 mois à connaître vos sites" : Réponse — Engie Solutions dispose déjà des plans techniques (fournisseur d'énergie), période de reprise ramenée à 3 mois documentés.\n→ "Nous garantissons notre qualité de service" : Réponse — 4 incidents SLA constatés en 2025 sans pénalité appliquée. Le renouvellement inclura des pénalités effectives.`;
    }

    // ── Sourcing / RFQ ───────────────────────────────────────────
    if (p.includes('cahier des charges') || p.includes('rfq') || p.includes('consultation')) {
      return `CAHIER DES CHARGES DE CONSULTATION\nMaintenance CVC multi-sites — 14 sites France\n\n1. OBJET & PÉRIMÈTRE\nMaintenance préventive et corrective des installations CVC (chauffage, ventilation, climatisation) sur 14 sites répartis en Hauts-de-France, Île-de-France et AURA. 62 centrales de traitement d'air à couvrir. Durée : 3 ans à compter du 1er janvier 2027, révisable annuellement.\n\n2. PRESTATIONS ATTENDUES\n• Maintenance préventive : programme selon préconisations constructeur, 4 visites/an minimum\n• Maintenance corrective : astreinte 24/7 sur l'ensemble du parc\n• Reporting mensuel : indicateurs de disponibilité, interventions, MTTR, MTBF\n• Retrofit progressif : plan de sortie des fluides HFC conforme au règlement F-Gas révisé\n• Formation des équipes site : 2 sessions/an par site\n\n3. NIVEAUX DE SERVICE & PÉNALITÉS\n• SLA intervention : 4h maximum sur sites critiques (à définir en annexe), 24h sur autres sites\n• Disponibilité garantie : 99% par mois sur sites critiques, 97% globale\n• Pénalités : 1% du montant mensuel par heure de dépassement SLA, plafonnées à 10%\n\n4. OBLIGATIONS RÉGLEMENTAIRES ET RSE\n• Certification ISO 50001 impérative (trajectoire CSRD 2027 du Client)\n• Certification ISO 9001 exigée\n• Plan de sortie F-Gas documenté et budgété\n• Bilan carbone Scope 1-2-3 fourni annuellement\n• Adhésion aux principes du Pacte Mondial et code éthique fournisseur du Client\n\n5. FORME DE LA RÉPONSE ATTENDUE\n• Réponse technique détaillée (maximum 30 pages)\n• Bordereau de prix par site et par nature de prestation (Excel joint)\n• Variante recommandée : contrat de performance énergétique avec engagement d'économies\n• Références comparables (3 minimum) avec contacts vérifiables\n• Attestations d'assurance, certifications, bilan financier 3 derniers exercices\n\n6. CRITÈRES DE JUGEMENT PONDÉRÉS\n• Prix : 40 points\n• Valeur technique (méthodologie, moyens, capacité astreinte) : 35 points\n• Performance RSE (ISO 50001, plan F-Gas, bilan carbone) : 15 points\n• Délai de mise en œuvre : 10 points\n\n7. CALENDRIER\n• Remise des offres : [DATE + 30 jours]\n• Auditions candidats retenus : [SEMAINE +5]\n• Notification attribution : [SEMAINE +7]\n• Démarrage prestations : 1er janvier 2027`;
    }

    // ── Note de justification / synthèse ────────────────────────
    if (p.includes('note de justification') || p.includes('synthèse de la trajectoire') || p.includes('cadrage')) {
      return `NOTE DE CADRAGE — Digitalisation du processus achats par l'IA générative\nComité de direction — Direction Achats\n\nCONSTAT\nLe processus achats complet mobilise aujourd'hui 72 jours ouvrés et 63 heures d'acheteur par dossier type. Six des dix étapes présentent un potentiel de transformation profonde par l'IA générative, quatre restent majoritairement humaines (négociation, arbitrage d'attribution, engagement juridique, traitement des litiges). L'étape d'évaluation fournisseur est aujourd'hui sacrifiée faute de temps — elle sera rétablie.\n\nCE QUE NOUS CHANGEONS\nExpression du besoin, sourcing, consultation, analyse des offres, contrôle de facture et évaluation fournisseur passent au copilote IA. Le processus complet est ramené à 21 jours ouvrés et 18,5 heures d'acheteur par dossier (-71% délai, -71% temps). La couverture des contrôles devient exhaustive au lieu d'être échantillonnée. Toute décision reste tracée et motivée.\n\nCE QUE NOUS NE CHANGEONS PAS\nLa négociation en face-à-face reste entièrement humaine. L'arbitrage d'attribution demeure un acte de responsabilité de l'acheteur, avec motivation écrite versée au dossier. L'engagement juridique de l'entreprise ne peut être délégué à un outil. Aucune décision automatique.\n\nSÉQUENCE DE DÉPLOIEMENT — TROIS VAGUES\nVague 1 (Q1 2027) : sourcing, analyse des offres, contrôle de facture — les trois cas où le ROI est le plus rapide et le risque le plus faible.\nVague 2 (Q3 2027) : rédaction contractuelle, préparation de négociation, évaluation fournisseur — impact fort mais nécessite l'adoption métier.\nVague 3 (Q1 2028) : expression du besoin en amont (demandeurs), workflows d'approbation — étape la plus dépendante de la conduite du changement.\n\nINDICATEURS DE SUIVI\nDélai moyen par dossier, temps acheteur par dossier, taux de savings, taux d'exhaustivité des contrôles, taux d'écart entre recommandation IA et décision humaine (indicateur d'amélioration continue).\n\nCONDITIONS DE RÉUSSITE\nNumérisation préalable du référentiel contractuel (préalable non négociable). Formation et adoption des directions métier. Protection contractuelle des données fournisseurs. Contrôle humain systématique des productions.`;
    }

    // ── Plan de dual sourcing ───────────────────────────────────
    if (p.includes('dual sourcing') || p.includes('dépendance')) {
      return `PLAN DE DUAL SOURCING — Horizon 12 mois\n\nMATIÈRES & COMPOSANTS (ElectroPro, 67%)\n▸ Objectif : ramener la part ElectroPro à 55% maximum d'ici Q4 2027\n▸ Action T1 : qualifier 2 fournisseurs alternatifs sur composants K3 (Schneider Composants, Legrand Systems). Coût d'onboarding estimé : 12 K€.\n▸ Risque de l'action : perte d'effet volume estimée à 3-4% sur ElectroPro si la répartition passe à 55/45\n▸ Indicateur : part de marché fournisseur mesurée mensuellement, revue trimestrielle en comité fournisseurs\n\nFACILITIES (Dalkia + EcoServ, 68%)\n▸ Objectif : décorréler les deux catégories dominantes (maintenance CVC et propreté) actuellement traitées ensemble\n▸ Action T1-T2 : lancer la consultation CVC séparée (en cours), maintenir EcoServ propreté sous contrat jusqu'en 2027\n▸ Risque : moindre effet de bundle sur les négociations tarifaires, à compenser par l'engagement pluriannuel\n▸ Indicateur : nombre de fournisseurs actifs par sous-catégorie\n\nÉNERGIE (Engie, 92%)\n▸ Objectif : maintenir la dépendance (assumée stratégiquement) mais la contractualiser\n▸ Action T1 : intégrer une clause de garantie de service dans le contrat cadre 2027\n▸ Risque : aucun changement de fournisseur crédible sans transition complexe (12+ mois)\n▸ Indicateur : présence effective des clauses de continuité et de préavis dans le contrat\n\nTRANSPORT (Geodis, 41%)\n▸ Situation saine, dispositif de dual sourcing déjà opérationnel (Geodis + Dachser)\n▸ Action : rien de nouveau requis à 12 mois, surveillance continue\n▸ Indicateur : maintien de la répartition 40-45% / 40-45% / 10-15%`;
    }

    // ── Note de sensibilisation ─────────────────────────────────
    if (p.includes('note de sensibilisation') || p.includes('achats hors procédure') || p.includes('sauvages')) {

  window.claude = {

      const prompt = typeof arg === 'string'
        ? arg
        : (arg && arg.messages && arg.messages.map(m => m.content).join('\n')) || '';

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
// AchatPro v3 — new module components
// Exposes: AnalyseurDocuments, ConseilAchat, CentreAlertes, Commandes, CalendrierContrats, DepensesDrill
// All read shared data from window.AP3.

const { useState: useState3, useRef: useRef3, useEffect: useEffect3, useMemo } = React;

const P3 = { s:'#7A8B6F', sl:'#A8B89B', sd:'#3D4A3D', gold:'#C9A961', terra:'#B85C3E', tx:'#5A5A52' };

// ───────────────────────── helpers ─────────────────────────
function Crumb({ctx, parts}){
  if(!parts||!parts.length) return null;
  return (
    <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:14,fontSize:12,color:'var(--txm)',flexWrap:'wrap'}}>
      <button className="crumb-back" onClick={()=>ctx.goto('dashboard')}>← Tableau de bord</button>
      {parts.map((p,i)=>(
        <React.Fragment key={i}>
          <span style={{opacity:.4}}>›</span>
          {p.go ? <button onClick={p.go} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txm)',fontSize:12,fontFamily:'inherit',padding:0,textDecoration:'underline',textDecorationColor:'rgba(0,0,0,0.08)'}}>{p.label}</button> : <strong style={{color:'var(--txs)',fontWeight:600}}>{p.label}</strong>}
        </React.Fragment>
      ))}
    </div>
  );
}

function SevPill({sev}){
  const cls = {crit:'sev-crit',urg:'sev-urg',att:'sev-att',info:'sev-info'}[sev]||'sev-info';
  return <span className={`sev ${cls}`}>{({crit:'🔴 Critique',urg:'🟠 Urgent',att:'🟡 Attention',info:'⚪ Info'})[sev]}</span>;
}

function PageHeader({icon,title,sub,right}){
  return (
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:18,gap:18,flexWrap:'wrap'}}>
      <div>
        <div style={{display:'flex',alignItems:'center',gap:9,marginBottom:3}}>
          <span style={{fontSize:22}}>{icon}</span>
          <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P3.sd,margin:0}}>{title}</h2>

        <p style={{color:'var(--txm)',fontSize:13,margin:0,maxWidth:680}}>{sub}</p>

      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{right}</div>
    </div>
  );
}

// ───────────────────────── 1. ANALYSEUR DOCUMENTS ─────────────────────────
function AnalyseurDocuments({ctx}){
  const DOCS = window.AP3.DOCS;
  const [doc,setDoc] = useState3(null);
  const [tab,setTab] = useState3('extracted');

  const [hi,setHi] = useState3(null);
  const [drag,setDrag] = useState3(false);

  const pickExample = (e)=>{
    const id=e.target.value;
    if(!id){ setDoc(null); return; }
    const d=DOCS.find(x=>x.id===id);
    setLoad(true);
    setDoc(null);
    setTimeout(()=>{ setDoc(d); setLoad(false); setTab('extracted'); setHi(null); },550);
  };

  const fakeUpload=()=>{
    setLoad(true); setDoc(null);
    setTimeout(()=>{ setDoc(DOCS[0]); setLoad(false); setTab('extracted'); },900);
  };

  const fakePaste=()=>{
    if(!pasteVal.trim()) return;
    setLoad(true); setDoc(null);
    // simple keyword detection mock
    const v=pasteVal.toLowerCase();
    let pick=DOCS[0];
    if(v.includes('facture')||v.includes('invoice')) pick=DOCS[1];
    else if(v.includes('bonjour')||v.includes('cordialement')||v.includes('email')) pick=DOCS[2];
    else if(v.includes('réception')||v.includes('ncr')||v.includes('procès')) pick=DOCS[3];
    else if(v.includes('tarif')||v.includes('prix')||v.includes('€/t')) pick=DOCS[4];
    setTimeout(()=>{ setDoc(pick); setLoad(false); setTab('extracted'); },700);
  };

  const sup = doc ? window.AP3.SUPPLIERS[doc.supplier] : null;

  return (
    <div className="fi" style={{padding:'24px 28px',maxWidth:1280}}>

        <select key="ex" className="inp" style={{width:240}} onChange={pickExample} defaultValue="">
          <option value="">Voir un exemple…</option>
          {DOCS.map(d=><option key={d.id} value={d.id}>{d.icon} {d.type} — {window.AP3.SUPPLIERS[d.supplier].n}</option>)}

          <div className="card cp">
            <div style={{display:'flex',gap:6,marginBottom:14}}>

              <button className={`tab ${mode==='paste'?'on':''}`} onClick={()=>setMode('paste')}>Copier-coller</button>
            </div>
            {mode==='upload' ? (
              <div className={`dropz ${drag?'on':''}`}
                onDragOver={e=>{e.preventDefault();setDrag(true);}}

                onClick={fakeUpload}>
                <div style={{fontSize:36,marginBottom:9,opacity:.4}}>📤</div>
                <div style={{fontWeight:600,color:P3.sd,marginBottom:5,fontSize:14}}>Déposez un document ici</div>
                <div style={{fontSize:11.5,color:'var(--txm)',lineHeight:1.6,maxWidth:340,margin:'0 auto'}}>PDF, Word (.docx), Excel (.xlsx, .csv), Images (JPG/PNG), Texte brut.<br/>L'IA détecte automatiquement le type de document.</div>
                <button className="btn btn-p" style={{marginTop:14,fontSize:12}}>Choisir un fichier…</button>
                <div style={{fontSize:10,color:'var(--txm)',marginTop:8}}>Analyse côté client · RGPD-friendly</div>
              </div>
            ) : (
              <div>
                <textarea className="inp" style={{minHeight:200}} placeholder="Colle ici le contenu d'un devis, d'une facture, d'un email, d'un contrat… L'IA détecte automatiquement le type." value={pasteVal} onChange={e=>setPasteVal(e.target.value)}/>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:10}}>
                  <div style={{fontSize:10.5,color:'var(--txm)'}}>Détection auto par mots-clés : devis, facture, contrat, PV, tarifs, email…</div>
                  <button className="btn btn-p" onClick={fakePaste} disabled={!pasteVal.trim()}>Analyser →</button>
                </div>
              </div>
            )}
          </div>

          <div className="card cp">
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P3.sd,marginBottom:10}}>Types pris en charge</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[['📋','Devis fournisseurs'],['🧾','Factures'],['✉️','Emails commerciaux'],['📦','PV de réception'],['📊','Tableaux de prix'],['📑','Contrats'],['📃','Bons de commande'],['🛡️','Rapports audit'],['💬','Comptes rendus']].map(([i,l])=>(
                <div key={l} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 9px',background:'var(--bg)',borderRadius:8,border:'1px solid var(--bdr)',fontSize:11.5,color:'var(--txs)'}}>
                  <span style={{fontSize:14}}>{i}</span>{l}
                </div>
              ))}
            </div>
            <div style={{marginTop:14,padding:'10px 12px',background:'rgba(122,139,111,0.06)',borderRadius:9,border:'1px solid rgba(122,139,111,0.18)'}}>
              <div style={{fontSize:11.5,fontWeight:700,color:P3.sd,marginBottom:6}}>L'IA analyse en parallèle :</div>
              <ul style={{fontSize:11,color:'var(--tx)',paddingLeft:18,lineHeight:1.75,margin:0}}>
                <li>Extraction structurée des données clés</li>
                <li>Analyse de risques (juridique, financier, opérationnel)</li>
                <li>Comparaison historique + contrat-type</li>
                <li>Recommandations contextuelles</li>
                <li>Propositions d'actions directes</li>
              </ul>
            </div>
          </div>
        </div>
      )}

      {load && (
        <div className="card cp" style={{textAlign:'center',padding:46}}>
          <div style={{fontSize:34,marginBottom:11}}>🌿</div>
          <div style={{fontWeight:700,color:P3.sd,fontSize:15,marginBottom:5}}>Analyse en cours…</div>
          <div style={{fontSize:12,color:'var(--txm)'}}>Extraction · Détection des risques · Comparaison historique · Recommandations</div>
          <div className="ptrack" style={{maxWidth:300,margin:'18px auto 0'}}><div className="pfill" style={{width:'68%'}}/></div>
        </div>
      )}

      {doc && (
        <div className="fi" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          {/* LEFT — DOC VIEWER */}
          <div className="card" style={{padding:18,display:'flex',flexDirection:'column',gap:12,minHeight:680}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:9}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{width:36,height:36,borderRadius:9,background:'rgba(122,139,111,0.10)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{doc.icon}</div>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:P3.sd}}>{doc.filename}</div>
                  <div style={{fontSize:10.5,color:'var(--txm)'}}>{doc.type} · {doc.size||'124 Ko'} · <Ref k="supplier" id={doc.supplier} style={{color:'var(--txm)'}}>{sup.n}</Ref></div>
                </div>
              </div>
              <button className="btn btn-g" onClick={()=>setDoc(null)}>↺ Charger un autre</button>
            </div>

            <div style={{fontSize:11,color:'var(--txm)',background:'rgba(122,139,111,0.06)',padding:'7px 10px',borderRadius:7,border:'1px solid rgba(122,139,111,0.15)'}}>
              <strong style={{color:P3.sd}}>Type détecté :</strong> {doc.type} · <strong style={{color:P3.sd,marginLeft:7}}>Résumé IA :</strong> {doc.summary}
            </div>

            <div className="doc-paper" style={{flex:1,overflowY:'auto',maxHeight:560}}>
              {doc.segments.map((s,i)=>{
                if(!s.hi) return <span key={i}>{s.t}</span>;
                const cls = s.hi==='g'?'hi-g':s.hi==='y'?'hi-y':'hi-r';
                const active = hi===s.id;
                return <span key={i} className={`${cls} ${active?'hi-on':''}`} title={s.note} data-anchor={s.id} onClick={()=>setHi(s.id)}>{s.t}</span>;
              })}
            </div>

            <div style={{display:'flex',alignItems:'center',gap:10,fontSize:10.5,color:'var(--txm)',borderTop:'1px solid var(--bdr)',paddingTop:9}}>
              <span><span style={{display:'inline-block',width:11,height:11,background:'rgba(122,139,111,0.30)',borderRadius:3,verticalAlign:-1}}/> OK</span>
              <span><span style={{display:'inline-block',width:11,height:11,background:'rgba(201,169,97,0.40)',borderRadius:3,verticalAlign:-1}}/> Attention</span>
              <span><span style={{display:'inline-block',width:11,height:11,background:'rgba(184,92,62,0.30)',borderRadius:3,verticalAlign:-1}}/> Risque</span>
              <span style={{marginLeft:'auto'}}>Cliquez un surlignage pour le lier à la donnée extraite →</span>
            </div>

            </div>

            <div style={{flex:1,overflowY:'auto'}}>
              {tab==='extracted' && (

                  {Object.entries(doc.extracted.reduce((a,e)=>{(a[e.cat]=a[e.cat]||[]).push(e); return a;},{})).map(([cat,items])=>(

                        </div>

                </div>

              {tab==='risks' && (

// ───────────────────────── 2. CONSEIL ACHAT ─────────────────────────
function ConseilAchat({ctx}){
  const CS = window.AP3.CONSEILS;
  const HZ = window.AP3.HORIZONS;
  const [sel,setSel] = useState3(null);
  const [filter,setFilter] = useState3('all');
  const totals = useMemo(()=>{
    const opp=CS.length;
    const eco = CS.filter(c=>c.impact.includes('K€')).reduce((a,c)=>{
      const m = c.impact.match(/(\d+(\.\d+)?)/);
      return a + (m?parseFloat(m[1]):0);
    },0);
    return {opp, eco:Math.round(eco)};
  },[CS]);

  const shown = filter==='all'?CS:CS.filter(c=>c.type===filter);

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <PageHeader icon="💡" title="Conseil Achat" sub="Toutes les opportunités d'optimisation triées par horizon et par impact"/>

      <div className="g4" style={{marginBottom:16}}>
        {[
          {l:'Opportunités détectées',v:totals.opp,d:'sur 4 horizons',i:'🎯'},
          {l:'Économie potentielle',v:`${totals.eco} K€`,d:'cumulée toutes catégories',i:'💰'},
          {l:'Économie réalisée ce mois',v:'+23 K€',d:'+12.4 % vs N-1',i:'📈',up:true},
          {l:'Actions en cours',v:CS.filter(c=>c.status==='En cours'||c.status==='Démarré').length,d:'sur l\'ensemble',i:'⚙️'},
        ].map((k,i)=>(
          <div key={i} className="kpi">
            <div style={{fontSize:17,marginBottom:3}}>{k.i}</div>
            <div className="kpi-v">{k.v}</div>
            <div className="kpi-l">{k.l}</div>
            <div className="kpi-d" style={{color:k.up?P3.s:'var(--txm)'}}>{k.d}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',gap:6,marginBottom:13,flexWrap:'wrap',alignItems:'center'}}>
        <span style={{fontSize:11,color:'var(--txm)',marginRight:5}}>Filtre :</span>
        {[['all','Tous'],['savings','💰 Savings'],['urgent','⚡ Urgent'],['risk','🎯 Risque'],['benchmark','🔍 Benchmark'],['esg','🌱 ESG'],['innovation','💡 Innovation'],['compliance','📋 Conformité']].map(([k,l])=>(
          <button key={k} className={`chip ${filter===k?'on':''}`} onClick={()=>setFilter(k)}>{l}</button>
        ))}
      </div>

      <div className="g3" style={{alignItems:'flex-start'}}>
        {HZ.map(h=>(
          <div key={h.id} className="horizon">
            <div className="horizon-hdr">
              <div>
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:2}}>
                  <span style={{fontSize:15}}>{h.icon}</span>
                  <span style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P3.sd}}>{h.l}</span>
                </div>
                <div style={{fontSize:10,color:'var(--txm)',letterSpacing:'.3px'}}>{h.sub}</div>
              </div>
              <span className="badge b-muted">{shown.filter(c=>c.h===h.id).length}</span>
            </div>
            {shown.filter(c=>c.h===h.id).map(c=>(
              <div key={c.id} className={`ccard ${sel===c.id?'sel':''}`} onClick={()=>setSel(sel===c.id?null:c.id)}>
                <div style={{display:'flex',alignItems:'flex-start',gap:9,marginBottom:5}}>
                  <span style={{fontSize:14,marginTop:1}}>{c.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:700,color:P3.sd,lineHeight:1.4,marginBottom:3}}>{c.title}</div>
                    <div style={{fontSize:10.5,color:'var(--txm)',lineHeight:1.55}}>{c.desc}</div>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:8,gap:6,flexWrap:'wrap'}}>
                  <span style={{fontSize:11,fontWeight:700,color:c.type==='savings'?P3.s:c.type==='urgent'?P3.terra:c.type==='risk'?P3.gold:P3.sd}}>{c.impact}</span>
                  <span className={`badge ${c.status==='Nouveau'?'b-gold':c.status==='En cours'?'b-sage':'b-team'}`}>{c.status}</span>
                </div>
                {sel===c.id && (
                  <div className="fi" style={{marginTop:10,paddingTop:10,borderTop:'1px dashed var(--bdr)',fontSize:11.5,color:'var(--tx)',lineHeight:1.65}}>
                    <div style={{marginBottom:7}}>{c.detail}</div>
                    {c.formula && <div style={{padding:'7px 9px',background:'rgba(201,169,97,0.07)',borderRadius:7,border:'1px dashed rgba(201,169,97,0.3)',fontSize:11,fontFamily:'monospace',color:P3.sd,marginBottom:7}}>{c.formula}</div>}
                    {c.sources && <div style={{fontSize:10.5,color:'var(--txm)',marginBottom:9}}>Sources : {c.sources.map((src,si)=>(<React.Fragment key={si}>{si>0&&' · '}<Ref rel={src.replace(/\.pdf$|\.csv$|\.eml$/,'')} style={{color:'var(--txm)'}}>{src}</Ref></React.Fragment>))}</div>}
                    {c.supplier && <div style={{marginBottom:9}}><Ref k="supplier" id={c.supplier} className="badge b-sage" style={{fontSize:10.5}}>🏢 {window.APRef?.DB.suppliers[c.supplier]?.n||c.supplier} — voir la fiche</Ref></div>}
                    <button className="btn btn-p" style={{fontSize:11}} onClick={(e)=>{e.stopPropagation();ctx.goto(c.action);}}>Démarrer l'action →</button>
