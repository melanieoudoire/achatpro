<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AchatPro — Copilote IA Achats</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#F5F1EA;--card:#FAF7F2;--card2:#E8DFD3;
  --sl:#A8B89B;--s:#7A8B6F;--sd:#3D4A3D;
  --tx:#5A5A52;--txs:#3D4A3D;--txm:#9A9A8E;
  --gold:#C9A961;--terra:#B85C3E;
  --bdr:rgba(122,139,111,0.15);
  --sh:0 2px 12px rgba(60,70,60,0.06);
  --shm:0 4px 24px rgba(60,70,60,0.10);
  --r:16px;--rsm:10px;
  --pad:24px;--gap:14px;--fs:13px;--ttl:22px;
}
/* Densité — Compact / Confort / Spacieux */
[data-density="compact"]{--pad:16px;--gap:9px;--fs:12px;--ttl:19px;--r:11px;--rsm:7px}
[data-density="cosy"]{--pad:24px;--gap:14px;--fs:13px;--ttl:22px}
[data-density="airy"]{--pad:36px;--gap:22px;--fs:14px;--ttl:28px;--r:22px;--rsm:14px}
[data-density="airy"] .card{padding:24px}
[data-density="airy"] .kpi{padding:22px}
[data-density="compact"] .card{padding:11px 13px}
[data-density="compact"] .kpi{padding:11px 13px}
[data-density="compact"] .kpi-v{font-size:20px}
[data-density="airy"] .kpi-v{font-size:32px}

/* Ambiance — palette moods */
[data-ambiance="terre"]{--bg:#F5F1EA;--card:#FAF7F2;--card2:#E8DFD3;--sl:#A8B89B;--s:#7A8B6F;--sd:#3D4A3D;--gold:#C9A961;--terra:#B85C3E}
[data-ambiance="aube"]{--bg:#F4EDE5;--card:#FBF6EE;--card2:#E8D7C2;--sl:#E0AD8F;--s:#C77F58;--sd:#5C3A2A;--gold:#D9A14A;--terra:#A8412B}
[data-ambiance="ardoise"]{--bg:#EEF1F2;--card:#F8FAFA;--card2:#D9DFE2;--sl:#90A0A8;--s:#5E7480;--sd:#1F2D33;--gold:#A88E5C;--terra:#A14B3E}
[data-ambiance="encre"]{--bg:#1F1F22;--card:#2A2B2E;--card2:#34353A;--sl:#9CB6E0;--s:#6B8AB8;--sd:#E8ECF2;--tx:#C8CED8;--txs:#E8ECF2;--txm:#7A7E88;--gold:#D4B36A;--terra:#D87A5E;--bdr:rgba(156,182,224,0.14);--sh:0 2px 12px rgba(0,0,0,0.3);--shm:0 4px 28px rgba(0,0,0,0.45)}

/* Personnalité — type system */
[data-perso="botanique"]{--ff-h:Georgia,'Playfair Display',serif;--ff-b:Inter,system-ui,sans-serif;--lg-shape:8px}
[data-perso="editorial"]{--ff-h:'Times New Roman',Georgia,serif;--ff-b:Georgia,serif;--lg-shape:2px}
[data-perso="editorial"] .kpi-v,[data-perso="editorial"] h1,[data-perso="editorial"] h2{letter-spacing:-0.02em;font-style:italic}
[data-perso="editorial"] .badge{border-radius:2px!important;text-transform:uppercase;letter-spacing:1px}
[data-perso="tech"]{--ff-h:'Inter','SF Pro Display',system-ui,sans-serif;--ff-b:'Inter',system-ui,sans-serif;--lg-shape:6px;--r:8px;--rsm:6px}
[data-perso="tech"] .kpi-v,[data-perso="tech"] h1,[data-perso="tech"] h2{font-family:'Inter',system-ui,sans-serif!important;font-weight:800;letter-spacing:-0.03em}
[data-perso="tech"] .badge{font-family:'JetBrains Mono','Courier New',monospace;text-transform:lowercase}

body{font-family:var(--ff-b,Inter,system-ui,sans-serif)}
h1,h2,h3,.kpi-v{font-family:var(--ff-h,Georgia,serif)}
.dark{
  --bg:#2A2D26;--card:#363A33;--card2:#2F3229;
  --bdr:rgba(168,184,155,0.12);
  --tx:#C8C8B8;--txs:#E8E8D8;--txm:#7A7A68;
  --sh:0 2px 12px rgba(0,0,0,0.2);--shm:0 4px 24px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
#root{height:100vh;display:flex;overflow:hidden}

.sidebar{width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:18px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr)}
.logo-text{font-family:Georgia,serif;font-weight:700;font-size:17px;color:var(--sd)}
.logo-sub{font-size:10px;color:var(--txm);letter-spacing:.5px;text-transform:uppercase}
.snav{flex:1;overflow-y:auto;padding:6px 8px;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txm);padding:8px 8px 3px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--tx);font-size:12.5px;font-weight:500;transition:all .13s}
.ni:hover{background:rgba(122,139,111,0.09);color:var(--sd)}
.ni.active{background:rgba(122,139,111,0.14);color:var(--sd);font-weight:700}
.ni-prompts{background:rgba(201,169,97,0.09) !important;border:1px solid rgba(201,169,97,0.22) !important}
.ni-prompts:hover,.ni-prompts.active{background:rgba(201,169,97,0.16) !important}
.sfooter{padding:10px;border-top:1px solid var(--bdr)}
.ucard{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .13s}
.ucard:hover{background:rgba(122,139,111,0.07)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--sl),var(--s));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.uname{font-size:12px;font-weight:600;color:var(--txs)}
.urole{font-size:10px;color:var(--txm)}

.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0}
.breadcrumb{font-size:13px;color:var(--txm);flex:1;display:flex;align-items:center;gap:5px}
.breadcrumb strong{color:var(--txs);font-weight:600}
.tsearch{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--bdr);border-radius:30px;padding:5px 13px;width:270px}
.tsearch input{background:none;border:none;outline:none;font-size:12px;color:var(--tx);width:100%}
.tsearch input::placeholder{color:var(--txm)}
.tbtn{width:32px;height:32px;border-radius:7px;border:1px solid var(--bdr);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--txm);font-size:14px;transition:all .13s}
.tbtn:hover{border-color:var(--sl);color:var(--sd)}

.content-area{display:flex;flex:1;overflow:hidden}
.content{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}

/* Cards */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh)}
.cp{padding:18px 20px}
.csm{padding:12px 14px}
.card-hover{transition:all .18s;cursor:pointer}
.card-hover:hover{box-shadow:var(--shm);transform:translateY(-2px)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;border:none;transition:all .16s}
.btn-p{background:var(--s);color:#fff}.btn-p:hover{background:var(--sd);transform:translateY(-1px);box-shadow:0 4px 12px rgba(122,139,111,0.3)}
.btn-s{background:transparent;color:var(--s);border:1.5px solid var(--s)}.btn-s:hover{background:rgba(122,139,111,0.07)}
.btn-g{background:transparent;color:var(--txm);border:1px solid var(--bdr);font-size:11.5px;padding:6px 12px}.btn-g:hover{color:var(--sd);border-color:var(--sl)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700}
.b-sage{background:rgba(168,184,155,0.22);color:var(--sd);border:1px solid rgba(122,139,111,0.18)}
.b-gold{background:rgba(201,169,97,0.14);color:#8A5E10;border:1px solid rgba(201,169,97,0.28)}
.b-terra{background:rgba(184,92,62,0.10);color:var(--terra);border:1px solid rgba(184,92,62,0.2)}
.b-muted{background:rgba(154,154,142,0.10);color:var(--txm);border:1px solid var(--bdr)}
.b-sys{background:rgba(61,74,61,0.09);color:var(--sd);border:1px solid rgba(61,74,61,0.18)}
.b-team{background:rgba(122,139,111,0.11);color:var(--s);border:1px solid rgba(122,139,111,0.22)}
.b-perso{background:rgba(201,169,97,0.11);color:#8A5E10;border:1px solid rgba(201,169,97,0.28)}

/* KPI */
.kpi{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);padding:16px 18px;box-shadow:var(--sh);transition:all .18s;cursor:default}
.kpi:hover{box-shadow:var(--shm);transform:translateY(-2px)}
.kpi-v{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--sd);margin:5px 0 2px}
.kpi-l{font-size:11px;color:var(--txm);font-weight:500}
.kpi-d{font-size:11px;font-weight:600;margin-top:3px}
.up{color:var(--s)}.dn{color:var(--terra)}

/* Grid */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* Input */
.inp{width:100%;padding:7px 11px;border-radius:8px;border:1px solid var(--bdr);background:var(--bg);color:var(--tx);font-size:12.5px;outline:none;font-family:inherit;transition:border-color .14s}
.inp:focus{border-color:var(--sl);box-shadow:0 0 0 3px rgba(122,139,111,0.08)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.6}

/* Chip */
.chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--bdr);background:var(--bg);color:var(--tx);transition:all .13s}
.chip:hover,.chip.on{background:var(--s);color:#fff;border-color:var(--s)}

/* Progress */
.ptrack{height:5px;background:var(--card2);border-radius:10px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--s),var(--sl));border-radius:10px;transition:width .8s ease}

/* Steps */
.steprow{display:flex;align-items:flex-start;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.steprow::-webkit-scrollbar{display:none}
.snum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--bdr);flex-shrink:0;transition:all .18s}
.snum.done{background:var(--s);border-color:var(--s);color:#fff}
.snum.active{background:var(--sd);border-color:var(--sd);color:#fff;box-shadow:0 0 0 4px rgba(122,139,111,0.18)}
.snum.idle{background:var(--bg);color:var(--txm)}
.sconn{width:36px;height:2px;flex-shrink:0;margin-top:13px;background:var(--bdr)}
.sconn.done{background:var(--s)}
.slbl{font-size:9.5px;font-weight:600;margin-top:4px;text-align:center;color:var(--txm);max-width:60px}
.slbl.on{color:var(--sd)}

/* IA Panel */
.ia-panel{width:320px;flex-shrink:0;background:var(--card);border-left:1px solid var(--bdr);display:flex;flex-direction:column;overflow:hidden}
.ia-panel.shut{width:0;border:none}
.ia-hdr{padding:12px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:9px;flex-shrink:0}
.ia-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.bub{padding:9px 12px;border-radius:10px;font-size:11.5px;line-height:1.6}
.bub-ai{background:rgba(168,184,155,0.18);color:var(--txs);border-radius:3px 10px 10px 10px}
.bub-u{background:var(--sd);color:#fff;border-radius:10px 3px 10px 10px}
.ia-sug{padding:7px 10px;border-top:1px solid var(--bdr);flex-shrink:0}
.ia-sug-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txm);margin-bottom:5px}
.sugg{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;background:rgba(168,184,155,0.1);border:1px solid rgba(122,139,111,0.13);font-size:11px;color:var(--sd);cursor:pointer;margin-bottom:4px;transition:all .12s}
.sugg:hover{background:rgba(122,139,111,0.14)}
.ia-inp-row{padding:8px 10px;border-top:1px solid var(--bdr);display:flex;gap:6px;flex-shrink:0}
.ia-inp{flex:1;padding:6px 9px;border-radius:7px;border:1px solid var(--bdr);background:var(--bg);font-size:11.5px;color:var(--tx);outline:none}
.ia-send{width:30px;height:30px;border-radius:7px;background:var(--s);border:none;color:#fff;cursor:pointer;font-size:14px;transition:all .13s}
.ia-send:hover{background:var(--sd)}

/* Prompt card */
.pcard{background:var(--card);border:1px solid var(--bdr);border-radius:var(--rsm);padding:12px 14px;cursor:pointer;transition:all .16s;margin-bottom:7px}
.pcard:hover,.pcard.sel{border-color:var(--s);box-shadow:0 0 0 2px rgba(122,139,111,0.08)}
.pcard.sel{background:rgba(122,139,111,0.03)}

/* Kanban */
.kcol{background:var(--bg);border-radius:var(--rsm);border:1px solid var(--bdr);padding:10px;min-height:180px}
.khdr{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txm);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--bdr);border-radius:7px;padding:9px 11px;margin-bottom:6px;cursor:pointer;font-size:11.5px;transition:all .13s}
.kcard:hover{border-color:var(--sl);box-shadow:var(--sh);transform:translateY(-1px)}

/* Divider */
hr.div{border:none;border-top:1px solid var(--bdr);margin:14px 0}

/* Prompt content */
.pcontent{font-family:monospace;font-size:11.5px;line-height:1.75;color:var(--tx);background:var(--bg);padding:13px;border-radius:8px;border:1px solid var(--bdr);white-space:pre-wrap;word-break:break-word}

/* Alert */
.aitem{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:var(--rsm);border:1px solid var(--bdr);background:var(--card);margin-bottom:7px;transition:all .14s;cursor:pointer}
.aitem:hover{box-shadow:var(--sh);border-color:var(--sl)}

/* Split */
.split{display:flex;flex:1;overflow:hidden}
.sl-left{flex:1;overflow-y:auto;border-right:1px solid var(--bdr);padding:18px 20px;scrollbar-width:thin}
.sl-right{width:300px;flex-shrink:0;overflow-y:auto;padding:18px;background:var(--card);scrollbar-width:thin}

/* Tabs */
.tab-row{display:flex;gap:5px;margin-bottom:14px}
.tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--bdr);background:transparent;color:var(--txm);font-size:12px;font-weight:500;cursor:pointer;transition:all .12s}
.tab.on{border-color:var(--s);background:rgba(122,139,111,0.09);color:var(--sd);font-weight:700}

/* FAB */
.fab{position:fixed;bottom:22px;right:22px;width:42px;height:42px;border-radius:50%;background:var(--sd);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(61,74,61,0.28);transition:all .18s;z-index:100;font-size:18px;color:#fff}
.fab:hover{background:var(--s);transform:scale(1.08)}

/* Anim */
@keyframes fi{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fi .22s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:10px}
</style>
</head>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, title, subtitle, children }) {
  const heading = label || title;
  return (
    <>
      {heading && <div className="twk-sect">{heading}{subtitle && <span style={{fontWeight:400,textTransform:'none',letterSpacing:0,opacity:.6}}> — {subtitle}</span>}</div>}
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ── SVG Charts ───────────────────────────────────────────────
function AreaChart({data, k1, k2, c1=P.s, c2=P.gold, h=150}){
  const W=600, H=h*2;
  const v1=data.map(d=>+d[k1]||0), v2=k2?data.map(d=>+d[k2]||0):[];
  const allV=[...v1,...v2]; const mn=Math.min(...allV), mx=Math.max(...allV)||1, rng=mx-mn;
  const px=(v,i)=>[i/(data.length-1)*(W-40)+20, H-20-(v-mn)/rng*(H-40)];
  const path=(vals)=>vals.map((v,i)=>{ const [x,y]=px(v,i); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
  const area=(vals,color)=>{ const p=path(vals); const [lx]=px(vals[vals.length-1],vals.length-1); const [fx]=px(vals[0],0); return `${p} L${lx.toFixed(1)} ${H-20} L${fx.toFixed(1)} ${H-20} Z`; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={c1} stopOpacity=".18"/><stop offset="100%" stopColor={c1} stopOpacity=".01"/></linearGradient>

      <path d={area(v1,c1)} fill="url(#g1)"/>

}

function BarChart({data, dk, h=160, multi=false, keys=[], colors=CC}){
  const W=580, H=h*2;
  const vals=multi?data.flatMap(d=>keys.map(k=>+d[k]||0)):data.map(d=>+d[dk]||0);
  const mx=Math.max(...vals)||1;
  const n=data.length, bw=W/n, pad=bw*.14;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:h}} preserveAspectRatio="none">
      {[0,.25,.5,.75,1].map(f=><line key={f} x1="0" y1={(H-20-(H-40)*f).toFixed(1)} x2={W} y2={(H-20-(H-40)*f).toFixed(1)} stroke="rgba(122,139,111,0.07)" strokeWidth="1"/>)}

        if(multi) return keys.map((k,ki)=>{
          const v=(+d[k]||0)/mx*(H-40); const subW=(bw-pad*2)/keys.length;
          const x=i*bw+pad+ki*subW; const y=H-20-v;
          return <rect key={k} x={x} y={y} width={subW-2} height={v} fill={colors[ki]} rx="3"/>;
        });
        const v=(+d[dk]||0)/mx*(H-40); const x=i*bw+pad; const y=H-20-v;
        return <rect key={i} x={x} y={y} width={bw-pad*2} height={v} fill={CC[i%CC.length]} rx="3"/>;
      })}

    </svg>

function Donut({data, h=180}){
  const total=data.reduce((s,d)=>s+(d.value||0),0)||1;
  let ang=-Math.PI/2; const cx=90, cy=h*.9, R=72, ri=46;
  const slices=data.map(d=>{
    const a=(d.value/total)*Math.PI*2;
    const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang);
    ang+=a;
    const x2=cx+R*Math.cos(ang),y2=cy+R*Math.sin(ang);
    const ix1=cx+ri*Math.cos(ang-a),iy1=cy+ri*Math.sin(ang-a);
    const ix2=cx+ri*Math.cos(ang),iy2=cy+ri*Math.sin(ang);
    const lg=a>Math.PI?1:0;
    return {path:`M${x1.toFixed(2)},${y1.toFixed(2)} A${R},${R},0,${lg},1,${x2.toFixed(2)},${y2.toFixed(2)} L${ix2.toFixed(2)},${iy2.toFixed(2)} A${ri},${ri},0,${lg},0,${ix1.toFixed(2)},${iy1.toFixed(2)} Z`,color:d.color||CC[0],name:d.name,value:d.value};
  });
  return (
    <svg viewBox={`0 0 320 ${h*1.8}`} style={{width:'100%',height:h}}>
      {slices.map((sl,i)=><path key={i} d={sl.path} fill={sl.color} opacity=".9"/>)}

    </svg>
  );
}

function HBar({data, h=170}){

  });
  const poly=pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const grids=[.25,.5,.75,1].map(f=>data.map((_,i)=>{
    const ang=-Math.PI/2+i*(Math.PI*2/n);
    return `${(cx+R*f*Math.cos(ang)).toFixed(1)},${(cy+R*f*Math.sin(ang)).toFixed(1)}`;
  }).join(' '));

function TcoModule(){

            {tab==='Vue'&&(

                <div style={{fontSize:12,color:'var(--txm)',marginBottom:9}}>Les variables <span style={{color:P.s,fontWeight:700,background:'rgba(122,139,111,0.09)',borderRadius:3,padding:'0 3px'}}>{'{exemple}'}</span> sont remplacées automatiquement à l'exécution.</div>
                <div className="pcontent">{hlVars(sel.content)}</div>
              </div>
            )}
            {tab==='Édition'&&(
              <div>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:9}}>
                  <div style={{fontSize:12,color:'var(--txm)'}}>Modifiez le prompt ci-dessous.</div>
                  <button className="btn btn-g" style={{fontSize:11}} onClick={()=>setEdit(sel.content)}>↩ Réinitialiser</button>
                </div>
                <textarea className="inp" value={edit} onChange={e=>setEdit(e.target.value)} style={{minHeight:320,fontFamily:'monospace',fontSize:11.5,lineHeight:1.75}}/>
                <div style={{marginTop:8,padding:'7px 11px',background:'rgba(201,169,97,0.06)',borderRadius:7,border:'1px solid rgba(201,169,97,0.18)',fontSize:11,color:'#8A5E10'}}>
                  💡 IA suggère : Ajoutez un exemple few-shot pour améliorer la cohérence du format de réponse.
                </div>
              </div>
            )}
            {tab==='Versions'&&(
              <div>
                {VERS.map((v,i)=>(
                  <div key={i} style={{position:'relative',paddingLeft:26,paddingBottom:18}}>
                    <div style={{position:'absolute',left:0,top:4,width:14,height:14,borderRadius:'50%',background:i===0?P.s:'var(--card2)',border:`2px solid ${i===0?P.s:'var(--bdr)'}`,zIndex:1}}/>
                    {i<VERS.length-1&&<div style={{position:'absolute',left:6,top:18,bottom:0,width:2,background:'var(--bdr)'}}/>}
                    <div style={{background:'var(--card)',border:'1px solid var(--bdr)',borderRadius:9,padding:'9px 12px'}}>
                      <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:3}}>
                        <span className="badge b-sage">{v.v}</span>
                        <span style={{fontSize:11,color:'var(--txm)'}}>{v.d} — {v.a}</span>
                        {i>0&&<button className="btn btn-g" style={{fontSize:10,padding:'2px 7px',marginLeft:'auto'}}>Restaurer</button>}
                      </div>
                      <div style={{fontSize:12,color:'var(--tx)'}}>{v.n}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
            {tab==='Sandbox'&&(
              <div>
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:12,fontWeight:600,color:P.sd,marginBottom:4}}>Test avec données fictives</div>
                  <div style={{fontSize:11,color:'var(--txm)',marginBottom:10}}>L'IA va compléter les variables avec des exemples réalistes.</div>
                  <button className="btn btn-p" onClick={runSandbox} disabled={sbLoad}>{sbLoad?'Exécution…':'▶ Exécuter le prompt'}</button>
                </div>
                {sbRes&&(<><hr className="div"/><div style={{fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase',marginBottom:7}}>Résultat</div><div className="pcontent" style={{fontFamily:'inherit',fontSize:12,lineHeight:1.85}}>{sbRes}</div></>)}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Comparateur d'Offres + Cost Saving / Cost Avoidance ─────
const OFFERS_DEMO = [
  {id:1, sup:'Dell France', price:1280, qty:25, ship:450, warranty:3, delay:12, rse:72, pay:'30j', total:0},
  {id:2, sup:'Lenovo / Computacenter', price:1185, qty:25, ship:0, warranty:4, delay:5, rse:84, pay:'45j', total:0},
  {id:3, sup:'HP Inc.', price:1340, qty:25, ship:280, warranty:2, delay:10, rse:68, pay:'30j', total:0},
  {id:4, sup:'Asus Pro', price:1095, qty:25, ship:520, warranty:1, delay:21, rse:55, pay:'comptant', total:0},
];
OFFERS_DEMO.forEach(o=>{o.total=o.price*o.qty+o.ship;});

const SAVINGS_LOG = [
  {id:'CS-2026-014', type:'Cost Saving', cat:'IT', sup:'Lenovo', desc:'Renégociation parc PC portables', amt:11875, baseline:'Offre Dell (référence marché)', status:'Validé', valid:'M. Durand (DAF)', date:'28 avr. 2026'},
  {id:'CA-2026-008', type:'Cost Avoidance', cat:'Énergie', sup:'Engie', desc:'Évitement hausse tarif index ICHT', amt:18400, baseline:'Tarif catalogue 2026 sans négo', status:'Validé', valid:'M. Durand (DAF)', date:'14 avr. 2026'},
  {id:'CS-2026-011', type:'Cost Saving', cat:'Prestations', sup:'Veolia', desc:'Renégo contrat nettoyage -8%', amt:11600, baseline:'Tarif contrat précédent', status:'Validé', valid:'C. Petit (Achats)', date:'2 avr. 2026'},
  {id:'CA-2026-006', type:'Cost Avoidance', cat:'IT', sup:'Adobe', desc:'Résiliation 14 licences inactives', amt:9660, baseline:'Renouvellement automatique prévu', status:'En attente', valid:'—', date:'1 mai 2026'},
  {id:'CS-2026-018', type:'Cost Saving', cat:'EPI', sup:'Decathlon Pro', desc:'Passage tarif Compte Entreprise', amt:4200, baseline:'Tarif standard', status:'En attente', valid:'—', date:'30 avr. 2026'},
  {id:'CA-2026-009', type:'Cost Avoidance', cat:'BTP', sup:'Lafarge', desc:'Stop hausse indexation matière', amt:7800, baseline:'Application clause d\'indexation', status:'Refusé', valid:'M. Durand — manque justificatif', date:'25 avr. 2026'},
];

function Comparateur(){
  const [tab,setTab]=useState('compare');
  const [offers,setOffers]=useState(OFFERS_DEMO);
  const [weights,setWeights]=useState({prix:35,qual:20,delai:15,garantie:15,rse:15});
  const [savings,setSavings]=useState(SAVINGS_LOG);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({type:'Cost Saving',cat:'IT',sup:'',desc:'',amt:'',baseline:''});

  const minPrice=Math.min(...offers.map(o=>o.total));
  const maxPrice=Math.max(...offers.map(o=>o.total));
  const cheapest=offers.find(o=>o.total===minPrice);

  const score=(o)=>{
    const sPrix=100-((o.total-minPrice)/(maxPrice-minPrice||1))*100;
    const sQual=o.warranty*20+(o.warranty>=3?20:0);
    const sDelai=Math.max(0,100-o.delay*4);
    const sGar=o.warranty*22;
    const sRse=o.rse;
    return Math.round((sPrix*weights.prix+sQual*weights.qual+sDelai*weights.delai+sGar*weights.garantie+sRse*weights.rse)/100);
  };
  const scored=offers.map(o=>({...o,score:score(o)}));
  const winner=scored.reduce((a,b)=>a.score>b.score?a:b);
  const baselineMax=Math.max(...offers.map(o=>o.total));
  const winnerSavings=baselineMax-winner.total;

  const validated=savings.filter(s=>s.status==='Validé');
  const pending=savings.filter(s=>s.status==='En attente');
  const totalCS=validated.filter(s=>s.type==='Cost Saving').reduce((a,b)=>a+b.amt,0);
  const totalCA=validated.filter(s=>s.type==='Cost Avoidance').reduce((a,b)=>a+b.amt,0);
  const totalPending=pending.reduce((a,b)=>a+b.amt,0);

  const submitSaving=()=>{
    if(!form.desc||!form.amt) return;
    const newId=`${form.type==='Cost Saving'?'CS':'CA'}-2026-${(savings.length+20).toString().padStart(3,'0')}`;
    setSavings([{id:newId,...form,amt:+form.amt,status:'En attente',valid:'—',date:new Date().toLocaleDateString('fr-FR')},...savings]);
    setForm({type:'Cost Saving',cat:'IT',sup:'',desc:'',amt:'',baseline:''});
    setShowForm(false);
  };
  const validate=(id,decision)=>{
    setSavings(savings.map(s=>s.id===id?{...s,status:decision,valid:decision==='Validé'?'M. Durand (DAF)':'Refusé — '+(prompt('Motif ?')||'non motivé'),date:new Date().toLocaleDateString('fr-FR')}:s));
  };
  const pushToSavings=(amt,desc,sup,type='Cost Saving')=>{
    const newId=`${type==='Cost Saving'?'CS':'CA'}-2026-${(savings.length+30).toString().padStart(3,'0')}`;
    setSavings([{id:newId,type,cat:'IT',sup,desc,amt,baseline:'Comparatif d\'offres '+winner.sup,status:'En attente',valid:'—',date:new Date().toLocaleDateString('fr-FR')},...savings]);
    setTab('savings');
  };

  return (
    <div className="fi" style={{padding:'24px 28px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
        <div>
          <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P.sd}}>Comparateur d'offres & Suivi des Savings</h2>
          <p style={{color:'var(--txm)',fontSize:13}}>Analyse comparative + Cost Saving / Cost Avoidance avec validation</p>
        </div>
      </div>
      <div className="tab-row">
        <button className={`tab ${tab==='compare'?'on':''}`} onClick={()=>setTab('compare')}>📊 Comparatif d'offres</button>
        <button className={`tab ${tab==='savings'?'on':''}`} onClick={()=>setTab('savings')}>💰 Savings Tracker</button>
        <button className={`tab ${tab==='analytics'?'on':''}`} onClick={()=>setTab('analytics')}>📈 Analytics</button>
      </div>

      {tab==='compare'&&(
        <div>
          <div className="card cp" style={{marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd}}>Cas démo : Renouvellement 25 ordinateurs portables</div>
              <span className="badge b-gold">4 offres reçues</span>
            </div>
            <div style={{fontSize:11,fontWeight:700,color:'var(--txm)',marginBottom:6,letterSpacing:'.5px'}}>PONDÉRATION DES CRITÈRES (somme = {Object.values(weights).reduce((a,b)=>a+b,0)}%)</div>
            <div className="g4" style={{gap:10}}>
              {Object.entries(weights).map(([k,v])=>(
                <div key={k}>
                  <div style={{fontSize:11,color:'var(--txm)',marginBottom:3,textTransform:'capitalize'}}>{k} : <strong style={{color:P.sd}}>{v}%</strong></div>
                  <input type="range" min="0" max="50" value={v} onChange={e=>setWeights({...weights,[k]:+e.target.value})} style={{width:'100%',accentColor:P.s}}/>
                </div>
              ))}
            </div>
          </div>

          <div className="card cp" style={{marginBottom:14,overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{borderBottom:'2px solid var(--bdr)'}}>
                  <th style={{textAlign:'left',padding:'8px 6px',color:'var(--txm)',fontWeight:600,fontSize:11}}>Critère</th>
                  {scored.map(o=>(
                    <th key={o.id} style={{textAlign:'left',padding:'8px 6px',color:o.id===winner.id?P.sd:'var(--txs)',fontWeight:700}}>
                      {o.id===winner.id&&<span style={{marginRight:5}}>🏆</span>}
                      {o.sup}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  {l:'Prix unitaire HT',k:'price',fmt:v=>v+' €',best:'min'},
                  {l:'Frais de port',k:'ship',fmt:v=>v+' €',best:'min'},
                  {l:'Total HT livré',k:'total',fmt:v=>v.toLocaleString('fr-FR')+' €',best:'min'},
                  {l:'Délai (jours)',k:'delay',fmt:v=>v+' j',best:'min'},
                  {l:'Garantie (ans)',k:'warranty',fmt:v=>v+' ans',best:'max'},
                  {l:'Score RSE /100',k:'rse',fmt:v=>v,best:'max'},
                  {l:'Paiement',k:'pay',fmt:v=>v,best:null},
                ].map((row,ri)=>{
                  const vals=scored.map(o=>o[row.k]);
                  const bestV=row.best==='min'?Math.min(...vals.filter(v=>typeof v==='number')):row.best==='max'?Math.max(...vals.filter(v=>typeof v==='number')):null;
                  return (
                    <tr key={ri} style={{borderBottom:'1px solid var(--bdr)'}}>
                      <td style={{padding:'8px 6px',color:'var(--txm)',fontWeight:500}}>{row.l}</td>
                      {scored.map(o=>(
                        <td key={o.id} style={{padding:'8px 6px',background:o[row.k]===bestV?'rgba(168,184,155,0.18)':'transparent',fontWeight:o[row.k]===bestV?700:500,color:o[row.k]===bestV?P.sd:'var(--tx)',borderRadius:5}}>
                          {row.fmt(o[row.k])}
                          {o[row.k]===bestV&&<span style={{marginLeft:4,color:P.s}}>✓</span>}
                        </td>
                      ))}
                    </tr>
                  );
                })}
                <tr style={{borderTop:'2px solid var(--bdr)',background:'rgba(122,139,111,0.05)'}}>
                  <td style={{padding:'10px 6px',fontWeight:700,color:P.sd}}>Score pondéré IA /100</td>
                  {scored.map(o=>(
                    <td key={o.id} style={{padding:'10px 6px',fontFamily:'Georgia,serif',fontSize:18,fontWeight:700,color:o.id===winner.id?P.s:'var(--tx)'}}>{o.score}</td>
                  ))}
                </tr>
              </tbody>
            </table>
          </div>

          <div className="card cp" style={{background:'linear-gradient(135deg,rgba(122,139,111,0.08),rgba(201,169,97,0.05))',border:`1.5px solid ${P.s}33`}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:14}}>
              <div style={{fontSize:34}}>🏆</div>
              <div style={{flex:1}}>
                <div style={{fontFamily:'Georgia,serif',fontSize:16,fontWeight:700,color:P.sd,marginBottom:4}}>Recommandation IA : {winner.sup}</div>
                <div style={{fontSize:12,color:'var(--tx)',lineHeight:1.65,marginBottom:10}}>
                  Score pondéré <strong>{winner.score}/100</strong> — Meilleure combinaison prix/qualité/délai/RSE.
                  Économie réelle vs offre la plus chère : <strong style={{color:P.s}}>{winnerSavings.toLocaleString('fr-FR')} €</strong> ({Math.round(winnerSavings/baselineMax*100)}%).
                </div>
                <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
                  <button className="btn btn-p" style={{fontSize:12}} onClick={()=>pushToSavings(winnerSavings,`Comparatif PC portables — choix ${winner.sup}`,winner.sup,'Cost Saving')}>💰 Déclarer en Cost Saving</button>
                  <button className="btn btn-s" style={{fontSize:12}} onClick={()=>pushToSavings(winnerSavings,`Évitement écart prix max — ${winner.sup}`,winner.sup,'Cost Avoidance')}>🛡️ Déclarer en Cost Avoidance</button>
                  <button className="btn btn-g">📄 Exporter PDF</button>
                  <button className="btn btn-g">✉️ Notifier le fournisseur</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {tab==='savings'&&(
        <div>
          <div className="g4" style={{marginBottom:14}}>
            <div className="kpi"><div className="kpi-l">💰 Cost Saving validé</div><div className="kpi-v" style={{color:P.s}}>{totalCS.toLocaleString('fr-FR')} €</div><div className="kpi-d up">{validated.filter(s=>s.type==='Cost Saving').length} dossiers</div></div>
            <div className="kpi"><div className="kpi-l">🛡️ Cost Avoidance validé</div><div className="kpi-v" style={{color:P.gold}}>{totalCA.toLocaleString('fr-FR')} €</div><div className="kpi-d up">{validated.filter(s=>s.type==='Cost Avoidance').length} dossiers</div></div>
            <div className="kpi"><div className="kpi-l">⏳ En attente validation</div><div className="kpi-v" style={{color:P.terra}}>{totalPending.toLocaleString('fr-FR')} €</div><div className="kpi-d">{pending.length} à arbitrer</div></div>
            <div className="kpi"><div className="kpi-l">🎯 Total Savings YTD</div><div className="kpi-v">{(totalCS+totalCA).toLocaleString('fr-FR')} €</div><div className="kpi-d up">+12.4% vs N-1</div></div>
          </div>

          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd}}>Registre des économies</div>
            <button className="btn btn-p" onClick={()=>setShowForm(!showForm)}>+ Déclarer une économie</button>
          </div>

          {showForm&&(
            <div className="card cp" style={{marginBottom:12,border:`1.5px solid ${P.s}`}}>
              <div style={{fontWeight:700,color:P.sd,marginBottom:9}}>Nouvelle déclaration de Saving</div>
              <div className="g3" style={{gap:9,marginBottom:9}}>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Type</label><select className="inp" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}><option>Cost Saving</option><option>Cost Avoidance</option></select></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Catégorie</label><select className="inp" value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})}><option>IT</option><option>BTP</option><option>Énergie</option><option>Prestations</option><option>EPI</option><option>Marketing</option></select></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Fournisseur</label><input className="inp" value={form.sup} onChange={e=>setForm({...form,sup:e.target.value})} placeholder="Ex: Lenovo"/></div>
              </div>
              <div className="g2" style={{gap:9,marginBottom:9}}>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Description / Action</label><input className="inp" value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} placeholder="Ex: Renégociation contrat -8%"/></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Baseline (référence)</label><input className="inp" value={form.baseline} onChange={e=>setForm({...form,baseline:e.target.value})} placeholder="Ex: Tarif contrat précédent"/></div>
              </div>
              <div style={{display:'flex',gap:9,alignItems:'flex-end'}}>
                <div style={{flex:1}}><label style={{fontSize:11,color:'var(--txm)'}}>Montant économisé (€)</label><input type="number" className="inp" value={form.amt} onChange={e=>setForm({...form,amt:e.target.value})} placeholder="0"/></div>
                <button className="btn btn-p" onClick={submitSaving}>Soumettre pour validation</button>
                <button className="btn btn-g" onClick={()=>setShowForm(false)}>Annuler</button>
              </div>
              <div style={{marginTop:9,padding:'7px 10px',background:'rgba(201,169,97,0.07)',borderRadius:7,fontSize:11,color:'#8A5E10'}}>
                💡 Différence : <strong>Cost Saving</strong> = économie réelle sur prix antérieur. <strong>Cost Avoidance</strong> = hausse évitée vs référence projetée.
              </div>
            </div>
          )}

          <div className="card" style={{overflow:'hidden'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
              <thead>
                <tr style={{background:'var(--bg)',borderBottom:'1px solid var(--bdr)'}}>
                  {['Réf.','Type','Catégorie','Fournisseur','Description','Montant','Baseline','Statut','Validateur','Actions'].map(h=>(
                    <th key={h} style={{textAlign:'left',padding:'9px 11px',fontSize:10,fontWeight:700,color:'var(--txm)',letterSpacing:'.5px',textTransform:'uppercase'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {savings.map(s=>(
                  <tr key={s.id} style={{borderBottom:'1px solid var(--bdr)'}}>
                    <td style={{padding:'9px 11px',fontFamily:'monospace',fontSize:10.5,color:'var(--txm)'}}>{s.id}</td>
                    <td style={{padding:'9px 11px'}}><span className={`badge ${s.type==='Cost Saving'?'b-sage':'b-gold'}`}>{s.type==='Cost Saving'?'💰 CS':'🛡️ CA'}</span></td>
                    <td style={{padding:'9px 11px',fontSize:11.5}}>{s.cat}</td>
                    <td style={{padding:'9px 11px',fontSize:11.5,fontWeight:600}}>{s.sup}</td>
                    <td style={{padding:'9px 11px',fontSize:11.5,maxWidth:200}}>{s.desc}</td>
                    <td style={{padding:'9px 11px',fontWeight:700,color:s.type==='Cost Saving'?P.s:P.gold,fontFamily:'Georgia,serif',fontSize:13}}>{s.amt.toLocaleString('fr-FR')} €</td>
                    <td style={{padding:'9px 11px',fontSize:10.5,color:'var(--txm)',maxWidth:150}}>{s.baseline}</td>
                    <td style={{padding:'9px 11px'}}>
                      {s.status==='Validé'&&<span className="badge b-sage">✓ Validé</span>}
                      {s.status==='En attente'&&<span className="badge b-gold">⏳ En attente</span>}
                      {s.status==='Refusé'&&<span className="badge b-terra">✗ Refusé</span>}
                    </td>
                    <td style={{padding:'9px 11px',fontSize:10.5,color:'var(--txm)'}}>{s.valid}<div style={{fontSize:9,opacity:.7}}>{s.date}</div></td>
                    <td style={{padding:'9px 11px'}}>
                      {s.status==='En attente'?(
                        <div style={{display:'flex',gap:4}}>
                          <button onClick={()=>validate(s.id,'Validé')} style={{background:P.s,color:'#fff',border:'none',borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer',fontWeight:700}}>✓ Valider</button>
                          <button onClick={()=>validate(s.id,'Refusé')} style={{background:'transparent',color:P.terra,border:`1px solid ${P.terra}`,borderRadius:5,padding:'3px 7px',fontSize:10,cursor:'pointer'}}>✗ Refuser</button>
                        </div>
                      ):(<button className="btn btn-g" style={{fontSize:10,padding:'3px 8px'}}>Voir</button>)}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          <div style={{marginTop:11,padding:'10px 13px',background:'rgba(122,139,111,0.06)',borderRadius:9,border:'1px solid var(--bdr)',fontSize:11.5,color:'var(--tx)'}}>
            <strong style={{color:P.sd}}>📋 Workflow de validation :</strong> Acheteur déclare → Manager Achats vérifie → DAF arbitre (si &gt; 5k€) → Comptabilité enregistre. Toute économie validée alimente le KPI Savings YTD du tableau de bord et du reporting CODIR.
          </div>
        </div>
      )}

      {tab==='analytics'&&(
        <div>
          <div className="g2" style={{marginBottom:14}}>
            <div className="card cp">
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>Répartition CS vs CA</div>
              <Donut data={[{name:'Cost Saving',value:Math.round(totalCS/(totalCS+totalCA)*100)||50,color:P.s},{name:'Cost Avoidance',value:Math.round(totalCA/(totalCS+totalCA)*100)||50,color:P.gold}]} h={170}/>
            </div>
            <div className="card cp">
              <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>Savings par catégorie (€)</div>
              <HBar data={['IT','Énergie','Prestations','EPI','BTP','Marketing'].map(c=>({name:c,val:Math.round(validated.filter(s=>s.cat===c).reduce((a,b)=>a+b.amt,0)/1000)||Math.floor(Math.random()*15+3)}))} h={170}/>
            </div>
          </div>
          <div className="card cp">
            <div style={{fontFamily:'Georgia,serif',fontSize:15,fontWeight:700,color:P.sd,marginBottom:10}}>📈 Cumulé YTD vs Objectif</div>
            <div style={{padding:'14px 0'}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5,fontSize:12}}>
                <span>Réalisé : <strong style={{color:P.s}}>{(totalCS+totalCA).toLocaleString('fr-FR')} €</strong></span>
                <span>Objectif annuel : <strong>500 000 €</strong></span>
              </div>
              <div className="ptrack" style={{height:14}}><div className="pfill" style={{width:Math.min(100,(totalCS+totalCA)/500000*100)+'%'}}/></div>
              <div style={{marginTop:6,fontSize:11,color:'var(--txm)'}}>{Math.round((totalCS+totalCA)/500000*100)}% de l'objectif annuel atteint au 6 mai 2026</div>

          </div>
        </div>
      )}
    </div>
  );
}

  const [genLoad,setGenLoad]=useState(false);
  const [analyse,setAnalyse]=useState(null);
  const [anaLoad,setAnaLoad]=useState(false);
  const [drag,setDrag]=useState(false);
  const [upFile,setUpFile]=useState(null);
  const fRef=useRef();

  const togglePick=(id)=>setPicked(picked.includes(id)?picked.filter(x=>x!==id):[...picked,id]);

  const generate=async()=>{

    const pickedClauses=picked.map(id=>all.find(c=>c.id===id)?.n).filter(Boolean).join(', ');
    const tlabel=CONTRACT_TYPES.find(t=>t.id===ctype)?.l;
    const prompt=`Tu es juriste senior expert achats. Rédige un ${tlabel} en français, format professionnel cabinet d'avocats.

PARAMÈTRES :
- Fournisseur : ${meta.four}
- Objet : ${meta.obj}
- Durée : ${meta.duree} mois
- Montant : ${meta.montant||'à préciser'} € HT
- Préavis résiliation : ${meta.preavis} mois

CLAUSES À INTÉGRER (numérotées en articles) : ${pickedClauses}.

Acheteuse : Mélanie Oudoire, Responsable Achats.

    try{
      const t=await window.claude.complete(prompt);
      setDraft(t);setTab('preview');
    }catch(e){setDraft('Erreur : '+e.message);}
    setGenLoad(false);

  const analyzeFile=async(content,name)=>{
    setUpFile({name});setAnaLoad(true);setAnalyse(null);
    const prompt=`Tu es juriste expert achats. Analyse ce contrat et retourne EXACTEMENT ce format JSON (sans markdown, juste le JSON) :
{
  "score": <nombre 0-100, plus haut = plus risqué>,
  "type":"<type de contrat détecté>",
  "synthese":"<résumé exécutif en 4 phrases pour la direction>",
  "parties":["<partie 1>","<partie 2>"],
  "montant":"<montant détecté ou non précisé>",
  "duree":"<durée détectée>",
  "dates":[{"label":"<libellé>","date":"<date>","type":"ok|warn|risk"}],
  "clauses":[{"nom":"<nom clause>","extrait":"<extrait court>","niveau":"vert|orange|rouge","commentaire":"<analyse courte>"}],
  "manquantes":["<clause manquante 1>","<clause manquante 2>"],
  "recommandations":["<reco 1 négociation>","<reco 2>","<reco 3>"]
}

Contrat à analyser :
${content.slice(0,4000)}`;
    try{
      const t=await window.claude.complete(prompt);
      const m=t.match(/\{[\s\S]*\}/);
      if(m){
        const parsed=JSON.parse(m[0]);
        setAnalyse(parsed);
      }else{
        setAnalyse({score:50,synthese:t,clauses:[],dates:[],manquantes:[],recommandations:[],parties:[],type:'?',montant:'?',duree:'?'});
      }
    }catch(e){
      setAnalyse({score:0,synthese:'Erreur d\'analyse : '+e.message,clauses:[],dates:[],manquantes:[],recommandations:[],parties:[],type:'?',montant:'?',duree:'?'});

    const demo=`CONTRAT DE PRESTATION DE SERVICES N° CP-2026-114

La société ACME France SAS, dont le siège est sis 12 rue Voltaire, 69003 Lyon, immatriculée au RCS de Lyon sous le numéro 814 552 109, représentée par M. Pierre Dumas en qualité de Directeur Général, ci-après dénommée « le Client »,
D'une part,
ET
La société CleanPro Services SARL, dont le siège est sis 47 av. Jean Jaurès, 69007 Lyon, immatriculée au RCS de Lyon sous le numéro 521 887 443, représentée par Mme Sandrine Roy en qualité de Gérante, ci-après dénommée « le Prestataire »,
D'autre part.

ARTICLE 1 — OBJET

ARTICLE 2 — DURÉE

ARTICLE 3 — PRIX
Le prix forfaitaire annuel est fixé à 285 000 € HT, payable par mensualités de 23 750 € HT, à 60 jours fin de mois. Indexation annuelle automatique selon indice INSEE des services généraux, plafonnée à +5%.

ARTICLE 4 — PÉNALITÉS
En cas de manquement constaté, le Client pourra appliquer une pénalité de 0,5% du montant mensuel par jour de retard. Aucune pénalité ne peut être appliquée au Client.

ARTICLE 7 — RÉSILIATION
Préavis de 12 mois requis pour toute résiliation à l'initiative du Client. Aucune indemnité due par le Prestataire en cas de manquement.

Fait à Lyon, le 15 mai 2026, en deux exemplaires originaux.`;
    analyzeFile(demo,'CleanPro_contrat_demo.txt');
  };

  return (
    <div className="fi" style={{padding:'24px 28px'}}>

        <h2 style={{fontFamily:'Georgia,serif',fontSize:22,fontWeight:700,color:P.sd}}>Rédaction & Analyse de contrats</h2>
        <p style={{color:'var(--txm)',fontSize:13}}>Construire un contrat par blocs · Analyser un contrat reçu · Recommandations IA</p>
      </div>
      <div className="tab-row">
        <button className={`tab ${tab==='builder'?'on':''}`} onClick={()=>setTab('builder')}>✍️ Construire un contrat</button>

        <button className={`tab ${tab==='upload'?'on':''}`} onClick={()=>setTab('upload')}>🔍 Analyser un contrat reçu</button>
      </div>

      {tab==='builder'&&(
        <div className="g2" style={{gap:14,alignItems:'flex-start'}}>
          <div>
            <div className="card cp" style={{marginBottom:12}}>
              <div style={{fontFamily:'Georgia,serif',fontSize:14,fontWeight:700,color:P.sd,marginBottom:9}}>1. Type de contrat</div>
              <div className="g3" style={{gap:7}}>
                {CONTRACT_TYPES.map(t=>(
                  <button key={t.id} onClick={()=>setCtype(t.id)} style={{textAlign:'left',padding:'8px 10px',borderRadius:8,border:`1.5px solid ${ctype===t.id?P.s:'var(--bdr)'}`,background:ctype===t.id?'rgba(122,139,111,0.08)':'var(--card)',cursor:'pointer'}}>
                    <div style={{fontSize:16,marginBottom:2}}>{t.e}</div>

              <div className="g2" style={{gap:8}}>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Fournisseur</label><input className="inp" value={meta.four} onChange={e=>setMeta({...meta,four:e.target.value})} placeholder="Ex: CleanPro Services SARL"/></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Objet</label><input className="inp" value={meta.obj} onChange={e=>setMeta({...meta,obj:e.target.value})} placeholder="Ex: Nettoyage tertiaire"/></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Durée (mois)</label><input className="inp" type="number" value={meta.duree} onChange={e=>setMeta({...meta,duree:e.target.value})}/></div>
                <div><label style={{fontSize:11,color:'var(--txm)'}}>Montant (€ HT)</label><input className="inp" type="number" value={meta.montant} onChange={e=>setMeta({...meta,montant:e.target.value})} placeholder="285000"/></div>

            {[['Obligatoires',CLAUSES_LIB.obligatoire,P.s],['Recommandées',CLAUSES_LIB.recommande,P.gold],['Sensibles ⚠️',CLAUSES_LIB.sensible,P.terra]].map(([t,arr,c])=>(

      {tab==='preview'&&(

          {genLoad&&<div style={{padding:50,textAlign:'center'}}><div style={{width:32,height:32,margin:'0 auto 12px',borderRadius:'50%',border:`3px solid var(--bdr)`,borderTopColor:P.s,animation:'spin 1s linear infinite'}}/><div style={{color:'var(--txm)',fontSize:13}}>Rédaction en cours…</div></div>}
          {draft&&(
            <div>
              <div style={{display:'flex',gap:7,marginBottom:10,flexWrap:'wrap'}}>

                <button className="btn btn-s" onClick={generate} disabled={genLoad}>↺ Régénérer</button>
                <button className="btn btn-g" onClick={()=>analyzeFile(draft,'mon_contrat_genere.txt')}>🔍 Faire relire par l'IA</button>

              <div className="card cp" style={{maxHeight:600,overflow:'auto'}}>

              </div>

          {analyse&&!anaLoad&&(
            <div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <div><div style={{fontFamily:'Georgia,serif',fontSize:16,fontWeight:700,color:P.sd}}>📑 {upFile?.name}</div><div style={{fontSize:11,color:'var(--txm)'}}>{analyse.type} · {analyse.parties?.join(' / ')}</div></div>
                <button className="btn btn-g" onClick={()=>{setUpFile(null);setAnalyse(null);}}>← Nouveau</button>
              </div>

              <div className="g4" style={{marginBottom:12}}>
                <div className="kpi"><div className="kpi-l">Score de risque</div><div className="kpi-v" style={{color:analyse.score>60?P.terra:analyse.score>40?P.gold:P.s}}>{analyse.score}/100</div><div className="kpi-d">{analyse.score>60?'Élevé':analyse.score>40?'Modéré':'Faible'}</div></div>
                <div className="kpi"><div className="kpi-l">Montant</div><div className="kpi-v" style={{fontSize:18}}>{analyse.montant||'—'}</div><div className="kpi-d">Engagement</div></div>
                <div className="kpi"><div className="kpi-l">Durée</div><div className="kpi-v" style={{fontSize:18}}>{analyse.duree||'—'}</div><div className="kpi-d">Engagement temporel</div></div>

function IaPanel({open,onClose,mod}){
  const [msgs,setMsgs]=useState(IA_DEMO);const [inp,setInp]=useState('');const [load,setLoad]=useState(false);const bottom=useRef();
  useEffect(()=>{bottom.current?.scrollIntoView({behavior:'smooth'});},[msgs]);
  const SUGG={
    dashboard:['Résumer ma semaine achats','Actions prioritaires aujourd\'hui ?','Analyser mes dépenses Q1'],
    contrats:['Clauses à risque ?','Extraire les dates clés','Comparer avec contrat-type'],
    sourcing:['Fournisseurs alternatifs','Qualifier ce fournisseur','Préparer un RFI'],
  }[mod]||['Aide-moi sur ce module','Voir les prompts disponibles','Générer un rapport'];
  const send=async()=>{
    if(!inp.trim()||load) return;
    const u=inp.trim();setInp('');setMsgs(m=>[...m,{role:'user',text:u}]);setLoad(true);
    try{const t=await window.claude.complete({messages:[{role:'user',content:`Assistant AchatPro, expert achats. Module: ${mod}. Question: ${u}. Réponds en français, concis, max 100 mots.`}]});setMsgs(m=>[...m,{role:'ai',text:t}]);}
    catch(e){setMsgs(m=>[...m,{role:'ai',text:'Erreur de connexion.'}]);}
    setLoad(false);
  };
  return (
    <div className={`ia-panel ${open?'':'shut'}`}>
      {open&&<>
        <div className="ia-hdr">
          <div style={{width:28,height:28,borderRadius:7,background:'rgba(122,139,111,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}><Leaf size={15}/></div>
          <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:700,color:P.sd}}>Assistant AchatPro</div><div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--txm)'}}><span style={{width:5,height:5,borderRadius:'50%',background:'#22c55e',display:'inline-block'}}/>En ligne</div></div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txm)',fontSize:17,borderRadius:5,padding:'2px 5px'}}>×</button>
        </div>
        <div className="ia-msgs">
          {msgs.map((m,i)=><div key={i} style={{alignSelf:m.role==='user'?'flex-end':'flex-start',maxWidth:'90%'}}><div className={`bub ${m.role==='user'?'bub-u':'bub-ai'}`}>{m.text}</div></div>)}
          {load&&<div style={{alignSelf:'flex-start'}}><div className="bub bub-ai" style={{color:'var(--txm)',fontSize:11}}>● ● ●</div></div>}
          <div ref={bottom}/>
        </div>
        <div className="ia-sug">
          <div className="ia-sug-lbl">Suggestions</div>
          {SUGG.map((s,i)=><button key={i} className="sugg" onClick={()=>setInp(s)}>{s}</button>)}
        </div>
        <div className="ia-inp-row">
          <input className="ia-inp" placeholder="Posez votre question…" value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}/>
          <button className="ia-send" onClick={send}>→</button>
        </div>
      </>}
    </div>
  );
}

            <span style={{fontSize:13,opacity:.45}}>🔍</span>
            <input placeholder="Rechercher ou demander à l'IA…"/>
          </div>
          <div style={{display:'flex',gap:7}}>
            <div className="tbtn" style={{position:'relative'}}>🔔<div style={{position:'absolute',top:5,right:5,width:7,height:7,borderRadius:'50%',background:P.terra,border:'2px solid var(--card)'}}/></div>
            <button className="tbtn" onClick={()=>setDark(!dark)}>{dark?'☀️':'🌙'}</button>
            <button className="tbtn" onClick={()=>setIa(!ia)} style={{color:ia?P.s:'var(--txm)',borderColor:ia?P.s:'var(--bdr)'}}>
              <Leaf size={15} color={ia?P.s:undefined}/>
            </button>
          </div>
        </div>
        <div className="content-area">
          <div className="content">{render()}</div>
          <IaPanel open={ia} onClose={()=>setIa(false)} mod={mod}/>
        </div>
      </div>
      <TweaksPanel title="Tweaks">
        <TweakSection title="Ambiance" subtitle="L'humeur visuelle de l'interface">
          <TweakRadio label="Palette" value={t.ambiance} onChange={v=>setTweak('ambiance',v)} options={[
            {value:'terre',label:'Terre'},
            {value:'aube',label:'Aube'},
            {value:'ardoise',label:'Ardoise'},
            {value:'encre',label:'Encre'},
          ]}/>
        </TweakSection>
        <TweakSection title="Densité" subtitle="Compact pour data-people, spacieux pour la lecture">
          <TweakRadio label="Espacement" value={t.density} onChange={v=>setTweak('density',v)} options={[
            {value:'compact',label:'Compact'},
            {value:'cosy',label:'Confort'},
            {value:'airy',label:'Spacieux'},
          ]}/>
        </TweakSection>
        <TweakSection title="Personnalité" subtitle="Le caractère typographique">
          <TweakRadio label="Style" value={t.perso} onChange={v=>setTweak('perso',v)} options={[
            {value:'botanique',label:'Botanique'},
            {value:'editorial',label:'Editorial'},
            {value:'tech',label:'Tech'},
          ]}/>
        </TweakSection>
      </TweaksPanel>

      {!ia&&<button className="fab" onClick={()=>setIa(true)} title="Assistant IA"><Leaf size={18} color="#fff"/></button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
